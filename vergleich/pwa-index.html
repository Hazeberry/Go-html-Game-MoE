<script id="shared-go-logic">
const SIZE = 19;
const BOARD_SIZE = SIZE * SIZE;
const COL_LETTERS = 'ABCDEFGHJKLMNOPQRST';
const HOSHI_XY = [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]];
const HOSHI_IDX = new Set(HOSHI_XY.map(([x,y]) => y * SIZE + x));

function idx(x, y) { return y * SIZE + x; }
function xOf(i) { return i % SIZE; }
function yOf(i) { return (i / SIZE) | 0; }

const NEIGHBORS = (() => {
  const t = new Array(BOARD_SIZE);
  for (let i = 0; i < BOARD_SIZE; i++) {
    const x = xOf(i), y = yOf(i), n = [];
    if (x > 0)      n.push(i - 1);
    if (x < SIZE-1) n.push(i + 1);
    if (y > 0)      n.push(i - SIZE);
    if (y < SIZE-1) n.push(i + SIZE);
    t[i] = n;
  }
  return t;
})();

function createBoard() { return new Uint8Array(BOARD_SIZE); }
function cloneBoard(b) { return new Uint8Array(b); }

const ZOBRIST_LO = new Uint32Array(BOARD_SIZE * 3);
const ZOBRIST_HI = new Uint32Array(BOARD_SIZE * 3);
(() => {
  let s = 123456789;
  const r = () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return s >>> 0; };
  for (let i = 0; i < ZOBRIST_LO.length; i++) { ZOBRIST_LO[i] = r(); ZOBRIST_HI[i] = r(); }
})();

function computeZobrist(board) {
  let lo = 0, hi = 0;
  for (let i = 0; i < BOARD_SIZE; i++)
    if (board[i]) {
      const k = i * 3 + (board[i] - 1);
      lo ^= ZOBRIST_LO[k]; hi ^= ZOBRIST_HI[k];
    }
  return hi * 0x200000 + (lo >>> 11);
}

const _ffVisited = new Int32Array(BOARD_SIZE);
let   _ffEpoch   = 0;

function setzeFfEpoche(n) { _ffEpoch = n; }

function _nextFfEpoch() {
  if (++_ffEpoch >= 0x7fffffff) {
    _ffEpoch = 1;
    _ffVisited.fill(0);
    _rdgChecked.fill(0);
  }
  return _ffEpoch;
}

function floodFill(board, startIdx) {
  const color = board[startIdx];
  const group = [], liberties = [];
  const epoch = _nextFfEpoch();
  const queue = [startIdx];
  let head = 0;
  _ffVisited[startIdx] = epoch;
  while (head < queue.length) {
    const i = queue[head++];
    const cell = board[i];
    if (cell === 0) { liberties.push(i); continue; }
    if (cell !== color) continue;
    group.push(i);
    for (const n of NEIGHBORS[i])
      if (_ffVisited[n] !== epoch) { _ffVisited[n] = epoch; queue.push(n); }
  }
  return { group, liberties };
}

const _groupQueue = new Int32Array(BOARD_SIZE);

function countLiberties(board, startIdx, cap) {
  const color = board[startIdx];
  const limit = cap === undefined ? 0x7fffffff : cap;
  const epoch = _nextFfEpoch();
  let head = 0, tail = 0, libs = 0;
  _groupQueue[tail++] = startIdx;
  _ffVisited[startIdx] = epoch;
  while (head < tail) {
    const i = _groupQueue[head++];
    for (const n of NEIGHBORS[i]) {
      if (_ffVisited[n] === epoch) continue;
      _ffVisited[n] = epoch;
      const c = board[n];
      if (c === 0) { if (++libs >= limit) return libs; }
      else if (c === color) _groupQueue[tail++] = n;
    }
  }
  return libs;
}

function countGroupSize(board, startIdx) {
  const color = board[startIdx];
  const epoch = _nextFfEpoch();
  let head = 0, tail = 0;
  _groupQueue[tail++] = startIdx;
  _ffVisited[startIdx] = epoch;
  while (head < tail) {
    const i = _groupQueue[head++];
    for (const n of NEIGHBORS[i]) {
      if (_ffVisited[n] === epoch) continue;
      _ffVisited[n] = epoch;
      if (board[n] !== color) continue;
      _groupQueue[tail++] = n;
    }
  }
  return tail;
}

function _removeDeadGroup(board, startIdx) {
  const color = board[startIdx];
  let head = 0, tail = 0, removed = 1;
  _groupQueue[tail++] = startIdx; board[startIdx] = 0;
  while (head < tail) {
    const g = _groupQueue[head++];
    for (const n of NEIGHBORS[g])
      if (board[n] === color) { board[n] = 0; _groupQueue[tail++] = n; removed++; }
  }
  return removed;
}

const _rdgChecked = new Int32Array(BOARD_SIZE);

function removeDeadGroups(board, color, nearIdx) {
  const epoch = _nextFfEpoch();
  let captured = 0;
  if (nearIdx !== undefined) {
    for (const n of NEIGHBORS[nearIdx]) {
      if (board[n] !== color || _rdgChecked[n] === epoch) continue;
      _rdgChecked[n] = epoch;
      if (countLiberties(board, n, 1) > 0) continue;
      captured += _removeDeadGroup(board, n);
    }
  } else {
    for (let i = 0; i < BOARD_SIZE; i++) {
      if (board[i] !== color || _rdgChecked[i] === epoch) continue;
      const {group, liberties} = floodFill(board, i);
      for (const g of group) _rdgChecked[g] = epoch;
      if (liberties.length === 0)
        for (const g of group) { board[g] = 0; captured++; }
    }
  }
  return captured;
}

function _diagIsTrueEye(board, candIdx, color) {
  const x = xOf(candIdx), y = yOf(candIdx);
  const opp = color === 1 ? 2 : 1;
  let oppDiag = 0;
  const corners = [[x-1,y-1],[x+1,y-1],[x-1,y+1],[x+1,y+1]];
  for (const [cx, cy] of corners) {
    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) continue;
    if (board[cy * SIZE + cx] === opp) oppDiag++;
  }
  const edge = x===0||x===SIZE-1||y===0||y===SIZE-1;
  return oppDiag <= (edge ? 0 : 1);
}

const _bnChainId   = new Int32Array(BOARD_SIZE);
const _bnRegionId  = new Int32Array(BOARD_SIZE);
const _bnChainMark = new Int32Array(BOARD_SIZE);
const _bnAlive     = new Int32Array(BOARD_SIZE);
const _bnDead      = new Int32Array(BOARD_SIZE);
const _bnBornDead  = [null, new Int32Array(BOARD_SIZE), new Int32Array(BOARD_SIZE)];
const _bnAdjTmp    = [0, 0, 0, 0];
let _bnEpoch = 0;

function _bensonForColor(board, color, epoch) {
  const opp = color === 1 ? 2 : 1;
  _bnChainId.fill(-1);
  _bnRegionId.fill(-1);
  _bnChainMark.fill(-1);

  let chainCount = 0;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] !== color || _bnChainId[i] !== -1) continue;
    let head = 0, tail = 0;
    _groupQueue[tail++] = i; _bnChainId[i] = chainCount;
    while (head < tail) {
      const g = _groupQueue[head++];
      for (const n of NEIGHBORS[g])
        if (board[n] === color && _bnChainId[n] === -1) { _bnChainId[n] = chainCount; _groupQueue[tail++] = n; }
    }
    chainCount++;
  }
  if (!chainCount) return;

  const vitalChains = [], borderChains = [], regionSmall = [];
  let regionCount = 0;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] === color || _bnRegionId[i] !== -1) continue;
    const r = regionCount++;
    let head = 0, tail = 0;
    _groupQueue[tail++] = i; _bnRegionId[i] = r;
    let vital = null;
    const border = [];
    let small = true, hasEmpty = false;
    while (head < tail) {
      const p = _groupQueue[head++];
      let adjCount = 0;
      for (const n of NEIGHBORS[p]) {
        const c = board[n];
        if (c === color) {
          const k = _bnChainId[n];
          _bnAdjTmp[adjCount++] = k;
          if (_bnChainMark[k] !== r) { _bnChainMark[k] = r; border.push(k); }
        } else if (_bnRegionId[n] === -1) {
          _bnRegionId[n] = r; _groupQueue[tail++] = n;
        }
      }
      if (board[p] === 0) {
        hasEmpty = true;
        if (adjCount === 0) { small = false; vital = []; }
        else if (vital === null) {
          vital = [];
          for (let a = 0; a < adjCount; a++) if (vital.indexOf(_bnAdjTmp[a]) < 0) vital.push(_bnAdjTmp[a]);
        } else if (vital.length) {
          for (let v = vital.length - 1; v >= 0; v--) {
            let found = false;
            for (let a = 0; a < adjCount; a++) if (_bnAdjTmp[a] === vital[v]) { found = true; break; }
            if (!found) vital.splice(v, 1);
          }
        }
      }
    }
    vitalChains.push(hasEmpty && vital ? vital : []);
    borderChains.push(border);
    regionSmall.push(small && hasEmpty);
  }

  const vitalCount  = new Int32Array(chainCount);
  const chainAlive  = new Uint8Array(chainCount).fill(1);
  const regionAlive = new Uint8Array(regionCount).fill(1);
  const borderOf = new Array(chainCount);
  for (let k = 0; k < chainCount; k++) borderOf[k] = [];
  for (let r = 0; r < regionCount; r++) {
    for (const k of vitalChains[r]) vitalCount[k]++;
    for (const k of borderChains[r]) borderOf[k].push(r);
  }
  const killQ = [];
  for (let k = 0; k < chainCount; k++) if (vitalCount[k] < 2) { chainAlive[k] = 0; killQ.push(k); }
  while (killQ.length) {
    const k = killQ.pop();
    for (const r of borderOf[k]) {
      if (!regionAlive[r]) continue;
      regionAlive[r] = 0;
      for (const j of vitalChains[r])
        if (chainAlive[j] && --vitalCount[j] < 2) { chainAlive[j] = 0; killQ.push(j); }
    }
  }

  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] === color) {
      if (chainAlive[_bnChainId[i]]) _bnAlive[i] = epoch;
    } else {
      const r = _bnRegionId[i];
      if (regionAlive[r] && regionSmall[r] && borderChains[r].length) {
        if (board[i] === opp) _bnDead[i] = epoch;
        else _bnBornDead[opp][i] = epoch;
      }
    }
  }
}

function bensonClassify(board) {
  if (++_bnEpoch >= 0x7fffffff) {
    _bnEpoch = 1;
    _bnAlive.fill(0);
    _bnDead.fill(0);
    _bnBornDead[1].fill(0);
    _bnBornDead[2].fill(0);
  }
  const epoch = _bnEpoch;
  _bensonForColor(board, 1, epoch);
  _bensonForColor(board, 2, epoch);
  return epoch;
}

const AUGE_GROSS = 7, OFFEN_GROSS = 40, OFFEN_KLEIN = 5, OFFEN_ANTEIL = 0.2;

function augenraumLebt(punkte, augeGross = AUGE_GROSS) {
  const n = punkte.length;
  if (n <= 3) return false;
  if (n >= augeGross) return true;
  const drin = new Set(punkte);
  let maxGrad = 0, quadrat = false;
  for (const p of punkte) {
    let g = 0;
    for (const q of NEIGHBORS[p]) if (drin.has(q)) g++;
    if (g > maxGrad) maxGrad = g;
    if (xOf(p) < SIZE - 1 && yOf(p) < SIZE - 1
        && drin.has(p + 1) && drin.has(p + SIZE) && drin.has(p + SIZE + 1)) quadrat = true;
  }
  if (n === 4) return !(quadrat || maxGrad === 3);
  if (n === 5) return !(quadrat || maxGrad === 4);

  const name = state.currentPlayer === 1 ? '● Schwarz' : '○ Weiß';
  state.sgfMoves.push({c: state.currentPlayer, pass: true});
  state.log.push(`${++state.moveCount}. ${name} passt`);
  state.consecutivePasses++;
  state.koPoint = null;
  if (state.consecutivePasses >= 2) {
    state.gameOver = true; state.log.push('— Spiel beendet (2× Pass) —');
    resolveLifeAndDeath(); showFinalScore();
  } else state.currentPlayer = opp;
  updateUndoButton();
}

function kiTrainingAbschliessen() {
  if (!globalThis.policyNet || policyNet._trained || !state.gameOver) return;
  if (!policyNet._gameBuffer || !policyNet._gameBuffer.length) return;
  policyNet._trained = true;
  let gewonnen;
  if (state.resignedBy) gewonnen = state.resignedBy !== state.aiColor;
  else {
    const s = endWertung();
    gewonnen = state.aiColor === 1 ? s.schwarz > s.weiss : s.weiss > s.schwarz;
  }
  policyNet.trainGame(gewonnen ? 1 : -1);
}

function resetGame() {
  kiTrainingAbschliessen();
  cleanupWorker();
  state.workerDead = false;
  state.workerDeadReason = null;
  if (globalThis.policyNet) { policyNet._trained=false; policyNet._gameBuffer=[]; }
  state.aiRequestId++;
  const eb = createBoard(), eh = computeZobrist(eb);
  Object.assign(state, {
    board: eb, currentPlayer: 1, captures: {1:0,2:0},
    boardHistory: new Set([eh]), hashListe: [eh], currentHash: eh,
    consecutivePasses: 0, moveCount: 0, gameOver: false, lastMove: null,
    koPoint: null,
    sgfMoves: [],
    resignedBy: null, finalMargin: null,
    log: [], aiThinking: false, deadStones: new Set(), undoStack: [],
    aiDiag: [], lastAIRequest: null, aiReqT0: 0, aiReqBudget: 0
  });
  _hopelessStreak = 0;
  _allDeadStreak  = 0;
  pendingTouch = null;
  document.getElementById('territory-panel').style.display = 'none';
  drawStateToCache(); updateUndoButton();
}

function resolveLifeAndDeath() {
  state.deadStones = new Set();
  const tot = toteSteineAmEnde(state.board);
  for (let i = 0; i < BOARD_SIZE; i++) if (tot[i]) state.deadStones.add(i);
  if (state.deadStones.size)
    state.log.push(`! ${state.deadStones.size} Steine als tot markiert (antippen zum Ändern)`);
  drawStateToCache();
}

function endBrett() {
  const board = cloneBoard(state.board), captures = {...state.captures};
  for (const i of state.deadStones) {
    const c = board[i];
    if (!c) continue;
    board[i] = 0;
    captures[c === 1 ? 2 : 1]++;
  }
  return {board, captures};
}

function _gebiete(board) {
  const gebiet = {1:0, 2:0}, visited = new Uint8Array(BOARD_SIZE);
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] || visited[i]) continue;
    const queue = [i], borders = new Set();
    let head = 0; visited[i] = 1;
    while (head < queue.length) {
      const c = queue[head++];
      for (const n of NEIGHBORS[c]) {
        const cell = board[n];
        if (!cell) { if (!visited[n]) { visited[n] = 1; queue.push(n); } }
        else borders.add(cell);
      }
    }
    if (borders.size === 1) gebiet[[...borders][0]] += queue.length;
  }
  return gebiet;
}

function finalAreaScore() {
  const {board} = endBrett(), area = _gebiete(board);
  for (let i = 0; i < BOARD_SIZE; i++) if (board[i]) area[board[i]]++;
  return area;
}

function finalTerritoryScore() {
  const {board, captures} = endBrett(), gebiet = _gebiete(board);
  return {1: gebiet[1] + captures[1], 2: gebiet[2] + captures[2]};
}

function endWertung() {
  const territory = state.scoringMode === 'territory';
  const t = territory ? finalTerritoryScore() : finalAreaScore();
  return {schwarz: t[1], weiss: t[2] + KOMI,
          label: territory ? 'Territory (Komi 7.5)' : 'Area (Komi 7.5)'};
}

function showFinalScore() {
  const w = endWertung();
  const winner = w.schwarz > w.weiss ? 'Schwarz' : 'Weiß';
  state.finalMargin = `${winner} +${Math.abs(w.schwarz - w.weiss).toFixed(1)}`;
  document.getElementById('final-label').textContent = w.label;
  document.getElementById('final-score').textContent = state.finalMargin;
  document.getElementById('territory-panel').style.display = 'flex';
}

function zaehlPhase() {
  return state.gameOver && !state.resignedBy && state.consecutivePasses >= 2;
}

function toteKetteUmschalten(i) {
  if (!state.board[i]) return false;
  const {group} = floodFill(state.board, i);
  const warTot = state.deadStones.has(i);
  for (const g of group) { if (warTot) state.deadStones.delete(g); else state.deadStones.add(g); }
  showFinalScore();
  drawStateToCache();
  return true;
}

function applyAIResult(result, reqId, netInp, netPriors, netHidden) {
  if (!result || reqId !== state.aiRequestId) return;
  if (!state.aiEnabled || state.gameOver || state.currentPlayer !== state.aiColor) {
    state.aiThinking = false; updateAIStatus(); updateUndoButton(); return;
  }
  if (result.type === 'stone') {
    const r = placeStone(result.x, result.y);
    if (r.ok && netPriors && globalThis.policyNet) {
      policyNet._gameBuffer.push({
        inp: netInp, probs: netPriors, hidden: netHidden,
        moveIdx: idx(result.x, result.y)
      });
    }
    if (!r.ok) {
      state.log.push(`! KI: ${r.reason} → Fallback`);
      const fb = findAnyLegalMove(state.aiColor);
      if (fb) { const r2 = placeStone(fb.x, fb.y); if (!r2.ok) pass(); }
      else pass();
    } else if (result.info) {
      state.log.push(`   ↳ ${result.info}`);
    }
  } else if (result.type === 'resign') {
    state.gameOver = true;
    state.resignedBy = state.aiColor;
    const kiName = state.aiColor === 1 ? '● Schwarz' : '○ Weiß';
    state.log.push(`— ${kiName} (KI) gibt auf —`);
    if (result.info) state.log.push(`   ↳ ${result.info}`);
    const _logLen = state.log.length;
    resolveLifeAndDeath();
    showFinalScore();
    const stand = state.finalMargin;
    state.deadStones = new Set();
    state.log.length = _logLen;
    drawStateToCache();
    const gewinner = state.aiColor === 1 ? 'Weiß' : 'Schwarz';
    document.getElementById('final-label').textContent = 'Aufgabe';
    document.getElementById('final-score').textContent =
      `${gewinner} gewinnt (Stand ${stand || '–'})`;
  } else {
    pass();
    if (result.info) state.log.push(`   ↳ ${result.info}`);
  }
  state.aiDiag.push({
    zug: state.moveCount, typ: result.type, info: result.info || null,
    dauerMs: state.aiReqT0 ? Date.now() - state.aiReqT0 : null,
    budgetMs: state.aiReqT0 ? state.aiReqBudget : null,
    msProSim: typeof _lastMsPerSim === 'number' ? Math.round(_lastMsPerSim * 100) / 100 : null
  });
  state.aiReqT0 = 0;
  state.aiThinking = false;
  render(); updateUI(); updateAIStatus(); updateUndoButton();
  if (!state.gameOver && state.aiEnabled && state.currentPlayer === state.aiColor) triggerAIMove();
}

function buildWorkerSource() {
  const aiSrc = document.getElementById('shared-go-logic').textContent
              + '\n' + document.getElementById('worker-ai').textContent;
  const handler = `
    self.onmessage = function(e) {
      const d = e.data;
      try {
        Object.assign(PARAMS, d.params);
        if (d.netPriors) {
          globalThis.policyNet = {
            _netPriors: new Float32Array(d.netPriors),
            _netHidden: null, _netInp: null,
            _netBlend: d.netBlend, _gameBuffer: [],
            blendWeight: d.netBlend
          };
        }
        const histSet = new Set(d.histHashes);
        const result = getAIMove(
          new Uint8Array(d.board), d.aiColor, histSet,
          d.captures, d.mc, 'hard', d.reqId,
          d.koPoint ?? null,
          d.lastMove ?? null
        );
        if (globalThis.policyNet) globalThis.policyNet._netPriors = null;
        self.postMessage({...result, reqId: d.reqId, lastMsPerSim: _lastMsPerSim});
      } catch (err) {
        self.postMessage({
          type: 'workerError',
          message: (err && err.message) || String(err),
          stack: (err && err.stack) || '',
          reqId: d.reqId,
          lastMsPerSim: _lastMsPerSim
        });
      }
    };`;
  return aiSrc + '\n' + handler;
}

function cleanupWorker() {
  if (state.aiWorker) { state.aiWorker.terminate(); state.aiWorker = null; }
  if (state.aiWorkerCtx) {
    if (state.aiWorkerCtx.url && state.aiWorkerCtx.url.startsWith('blob:'))
      URL.revokeObjectURL(state.aiWorkerCtx.url);
    state.aiWorkerCtx = null;
  }
}

function fallbackToMainThread(reqId, netInp, netPriors, netHidden) {
  setTimeout(() => {
    if (reqId !== state.aiRequestId) return;
    let r;
    try {
      r = getAIMove(state.board, state.aiColor,
        Array.from(state.boardHistory), {...state.captures},
        state.moveCount, 'hard', reqId,
        state.koPoint, state.lastMove);
    } catch (e) {
      console.error('[Fallback] getAIMove synchron gescheitert:', e);
      state.log.push(`! KI-Fehler (synchron): ${(e && e.message) || e} → Notzug`);
      const fb = findAnyLegalMove(state.aiColor);
      r = fb ? {type:'stone', x:fb.x, y:fb.y, requestId:reqId} : {type:'pass', requestId:reqId};
    }
    applyAIResult(r, reqId, netInp, netPriors, netHidden);
  }, 10);
}

function erzeugeWorker(art) {
  const workerSrc = buildWorkerSource();
  let url;
  if (art === 'data') {
    url = 'data:application/javascript;base64,' + btoa(unescape(encodeURIComponent(workerSrc)));
  } else {
    url = URL.createObjectURL(new Blob([workerSrc], {type: 'application/javascript'}));
  }
  state.aiWorker = new Worker(url);
  state.aiWorkerCtx = {url, art, antwort: false, letzteAnfrage: null, netInp: null, netPriors: null, netHidden: null};
  attachWorkerHandlers();
}

function attachWorkerHandlers() {
  state.aiWorker.onmessage = function(e) {
    const ctx = state.aiWorkerCtx;
    if (ctx) ctx.antwort = true;
    if (e.data && typeof e.data.lastMsPerSim === 'number')
      _lastMsPerSim = e.data.lastMsPerSim;
    if (e.data && e.data.type === 'workerError') {
      console.error('[Worker] Interner Fehler:', e.data.message, e.data.stack || '');
      state.workerDeadReason = `workerError: ${e.data.message || 'unbekannt'}`;
      state.log.push(`! Worker-Fehler: ${e.data.message || 'unbekannt'} → synchroner Modus`);
      state.workerDead = true;
      cleanupWorker();
      fallbackToMainThread(e.data.reqId,
        ctx ? ctx.netInp : null, ctx ? ctx.netPriors : null, ctx ? ctx.netHidden : null);
      return;
    }
    applyAIResult(e.data, e.data.reqId,
      ctx ? ctx.netInp : null, ctx ? ctx.netPriors : null, ctx ? ctx.netHidden : null);
  };
  state.aiWorker.onerror = function(err) {
    const ctx = state.aiWorkerCtx;
    if (ctx && ctx.art === 'data' && !ctx.antwort && ctx.letzteAnfrage) {
      const anfrage = ctx.letzteAnfrage, netz = {netInp: ctx.netInp, netPriors: ctx.netPriors, netHidden: ctx.netHidden};
      try {
        cleanupWorker();
        erzeugeWorker('blob');
        Object.assign(state.aiWorkerCtx, netz, {letzteAnfrage: anfrage});
        state.log.push('! data:-Worker abgelehnt → blob:-Worker');
        state.aiWorker.postMessage(anfrage);
        return;
      } catch (e2) {
        console.warn('[Worker] blob:-URL ebenfalls fehlgeschlagen:', e2.message || e2);
      }
    }
    console.error('[Worker] Fehler:', err.message || err);
    state.workerDeadReason = `onerror: ${err.message || 'unbekannt'}`;
    state.log.push(`! Worker-Crash: ${err.message || 'unbekannt'} → synchroner Modus`);
    state.workerDead = true;
    cleanupWorker();
    fallbackToMainThread(state.aiRequestId,
      ctx ? ctx.netInp : null, ctx ? ctx.netPriors : null, ctx ? ctx.netHidden : null);
  };
}

function triggerAIMove() {
  if (!state.aiEnabled || state.gameOver || state.currentPlayer !== state.aiColor) return;
  state.aiThinking = true;
  const reqId = ++state.aiRequestId;
  updateAIStatus(); updateUndoButton();

  let _emptyCount = 0;
  for (let i = 0; i < BOARD_SIZE; i++) if (state.board[i] === 0) _emptyCount++;

  let _netInp = null, _netPriors = null, _netHidden = null;
  if (globalThis.policyNet && state.aiDifficulty === 'hard') {
    const _lm = state.lastMove !== null ? {x: xOf(state.lastMove), y: yOf(state.lastMove)} : null;
    policyNet._lastMove = _lm;
    _netInp = policyNet.boardToInput(state.board, state.aiColor, _lm, state.koPoint);
    const {probs, hidden} = policyNet.forward(_netInp);
    _netPriors = probs; _netHidden = hidden;
  }

  if (state.aiDifficulty === 'hard') {
    const _adaptiveBudget = getAdaptiveTimeBudget(_emptyCount);
    state.aiReqT0 = Date.now();
    state.aiReqBudget = _adaptiveBudget;
    state.lastAIRequest = {
      board:      Array.from(state.board),
      aiColor:    state.aiColor,
      histHashes: Array.from(state.boardHistory),
      captures:   {...state.captures},
      mc:         state.moveCount,
      koPoint:    state.koPoint,
      lastMove:   state.lastMove,
      params:     JSON.parse(JSON.stringify(PARAMS)),
      netBlend:   _netPriors ? policyNet.blendWeight : 0,
      lastMsPerSim: _lastMsPerSim
    };
    if (state.workerDead) { fallbackToMainThread(reqId, _netInp, _netPriors, _netHidden); return; }
    try {
      if (!state.aiWorker) {
        try { erzeugeWorker('data'); }
        catch (e1) {
          console.warn('[Worker] data:-URL fehlgeschlagen, versuche blob:', e1.message || e1);
          erzeugeWorker('blob');
        }
      }
      state.aiWorkerCtx.netInp    = _netInp;
      state.aiWorkerCtx.netPriors = _netPriors;
      state.aiWorkerCtx.netHidden = _netHidden;

      const anfrage = {
        board:    Array.from(state.board),
        aiColor:  state.aiColor,
        histHashes: Array.from(state.boardHistory),
        captures: {...state.captures},
        mc:       state.moveCount,
        reqId,
        koPoint:  state.koPoint,
        lastMove: state.lastMove,
        params:   JSON.parse(JSON.stringify(PARAMS)),
        netPriors: _netPriors ? Array.from(_netPriors) : null,
        netBlend:  _netPriors ? policyNet.blendWeight : 0
      };
      state.aiWorkerCtx.letzteAnfrage = anfrage;
      state.aiWorker.postMessage(anfrage);

      const watchdogMs = _adaptiveBudget * 3 + 3000;
      const _watchdog = () => {
        if (reqId !== state.aiRequestId) return;
        if (!state.aiThinking) return;
        if (typeof document !== 'undefined' && document.hidden) {
          setTimeout(_watchdog, watchdogMs);
          return;
        }
        console.warn('[Worker] Watchdog: keine Antwort nach', watchdogMs, 'ms — erzwinge Fallback');
        state.workerDeadReason = `Watchdog: keine Antwort nach ${watchdogMs} ms`;
        state.log.push(`! Worker-Watchdog (${watchdogMs} ms) → synchroner Modus`);
        state.workerDead = true;
        cleanupWorker();
        fallbackToMainThread(reqId, _netInp, _netPriors, _netHidden);
      };
      setTimeout(_watchdog, watchdogMs);
    } catch(e) {
      console.warn('[triggerAIMove] Worker nicht verfügbar, synchron:', e);
      state.workerDead = true;
      cleanupWorker();
      fallbackToMainThread(reqId, _netInp, _netPriors, _netHidden);
    }
  } else {
    setTimeout(() => {
      if (reqId !== state.aiRequestId) return;
      if (!state.aiEnabled || state.gameOver || state.currentPlayer !== state.aiColor) {
        state.aiThinking = false; updateAIStatus(); return;
      }
      state.aiReqT0 = Date.now();
      state.aiReqBudget = 0;
      state.lastAIRequest = {
        board:      Array.from(state.board),
        aiColor:    state.aiColor,
        histHashes: Array.from(state.boardHistory),
        captures:   {...state.captures},
        mc:         state.moveCount,
        koPoint:    state.koPoint,
        lastMove:   state.lastMove,
        difficulty: state.aiDifficulty,
        params:     JSON.parse(JSON.stringify(PARAMS)),
        netBlend:   0,
        lastMsPerSim: _lastMsPerSim
      };
      const r = getAIMove(state.board, state.aiColor,
        Array.from(state.boardHistory), {...state.captures},
        state.moveCount, state.aiDifficulty, reqId,
        state.koPoint, state.lastMove);
      applyAIResult(r, reqId, null, null, null);
    }, 50);
  }
}

function buildSGF() {
  const L = i => String.fromCharCode(97 + i);
  const esc = t => String(t).replace(/([\]\\])/g, '\\$1');
  const rules = state.scoringMode === 'territory' ? 'Japanese' : 'Chinese';
  const d = new Date();
  const dt = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  let pb = 'Schwarz', pw = 'Weiß';
  if (state.aiEnabled) {
    const tag = `KI (${state.aiDifficulty})`;
    if (state.aiColor === 1) pb = tag; else pw = tag;
  }

  let head = `(;GM[1]FF[4]CA[UTF-8]AP[Go-PWA:${PROJEKT_KENNUNG}]SZ[${SIZE}]KM[${KOMI}]RU[${rules}]`
           + `PB[${esc(pb)}]PW[${esc(pw)}]DT[${dt}]`;

  if (state.resignedBy) {
    head += `RE[${state.resignedBy === 1 ? 'W' : 'B'}+R]`;
  } else if (state.gameOver) {
    let sb, sw;
    if (state.scoringMode === 'territory') { const t = finalTerritoryScore(); sb = t[1]; sw = t[2] + KOMI; }
    else { const a = finalAreaScore(); sb = a[1]; sw = a[2] + KOMI; }
    const diff = Math.abs(sb - sw).toFixed(1);
    head += `RE[${sb > sw ? 'B' : 'W'}+${diff}]`;
  }

  let body = '';
  for (const m of state.sgfMoves) {
    const c = m.c === 1 ? 'B' : 'W';
    body += m.pass ? `;${c}[]` : `;${c}[${L(m.x)}${L(m.y)}]`;
  }
  return head + '\n' + body + ')\n';
}

function downloadSGF() {
  if (!state.sgfMoves.length) { updateUI('Noch keine Züge zum Exportieren.'); return; }
  try {
    const blob = new Blob([buildSGF()], {type: 'application/x-go-sgf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `go_${state.sgfMoves.length}zuege_${Date.now()}.sgf`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.warn('[SGF] Download fehlgeschlagen, Fallback Zwischenablage:', e);
    const t = document.createElement('textarea');
    t.value = buildSGF(); t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); updateUI('SGF in Zwischenablage kopiert.'); } catch (e2) {}
    document.body.removeChild(t);
  }
}

function findAnyLegalMove(color) {
  const opp = color === 1 ? 2 : 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (state.board[i] !== 0) continue;
    if (state.koPoint !== null && i === state.koPoint) continue;
    const test = cloneBoard(state.board); test[i] = color;
    const cap = removeDeadGroups(test, opp, i);
    if (cap > 0 && !state.boardHistory.has(computeZobrist(test)))
      return {x: xOf(i), y: yOf(i)};
  }
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (state.board[i] !== 0) continue;
    if (state.koPoint !== null && i === state.koPoint) continue;
    const test = cloneBoard(state.board); test[i] = color;
    const cap = removeDeadGroups(test, opp, i);
    if (cap === 0 && floodFill(test, i).liberties.length === 0) continue;
    if (cap === 0 && fuelltEigenesAuge(state.board, i, color)) continue;
    if (!state.boardHistory.has(computeZobrist(test)))
      return {x: xOf(i), y: yOf(i)};
  }
  return null;
}

const canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
let layout = {}, grainCanvas = null;
let boardCache = document.createElement('canvas'), stateCache = document.createElement('canvas');
const bCtx = boardCache.getContext('2d'), sCtx = stateCache.getContext('2d');

function computeLayout() {
  const max = Math.min(innerWidth * 0.92, innerHeight * 0.82, 640);
  const M = Math.round(max / 22), C = Math.round((max - M*2) / (SIZE-1));
  return {MARGIN: M, CELL: C, S: M*2 + C*(SIZE-1)};
}

function generateGrain() {
  const {S} = layout; grainCanvas = document.createElement('canvas');
  grainCanvas.width = grainCanvas.height = S;
  const g = grainCanvas.getContext('2d'); g.fillStyle = '#c8a05a'; g.fillRect(0,0,S,S);
  for (let i = 0; i < 30; i++) {
    const px = Math.random()*S; g.beginPath(); g.moveTo(px,0); g.lineTo(px+8,S);
    g.strokeStyle = `rgba(0,0,0,${0.012+Math.random()*0.012})`;
    g.lineWidth = 0.6+Math.random(); g.stroke();
  }
}

function drawBoardToCache() {
  const {MARGIN:M, CELL:C, S} = layout, c = bCtx;
  c.drawImage(grainCanvas, 0, 0, S, S);
  c.strokeStyle = '#5a3a10'; c.lineWidth = 0.8;
  for (let i = 0; i < SIZE; i++) {
    const p = M + i*C;
    c.beginPath(); c.moveTo(p, M); c.lineTo(p, M+(SIZE-1)*C); c.stroke();
    c.beginPath(); c.moveTo(M, p); c.lineTo(M+(SIZE-1)*C, p); c.stroke();
  }
  c.strokeStyle = '#4a2e08'; c.lineWidth = 1.5;
  c.strokeRect(M, M, (SIZE-1)*C, (SIZE-1)*C);
  c.fillStyle = '#5a3a10';
  c.font = `${Math.round(C*0.38)}px 'Noto Sans Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < SIZE; i++) {
    const gx = M + i*C, gy = M + i*C;
    c.fillText(COL_LETTERS[i], gx, M/2); c.fillText(COL_LETTERS[i], gx, S-M/2);
    c.fillText(String(SIZE-i), M/2, gy); c.fillText(String(SIZE-i), S-M/2, gy);
  }
  c.fillStyle = '#4a2e08';
  for (const [hx,hy] of HOSHI_XY) {
    c.beginPath(); c.arc(M+hx*C, M+hy*C, C*0.13, 0, Math.PI*2); c.fill();
  }
}

function drawStoneTo(ct, x, y, color, isDead) {
  const {MARGIN:M, CELL:C} = layout, cx = M+x*C, cy = M+y*C, r = C*0.46;
  ct.save();
  if (isDead) ct.globalAlpha = 0.45;
  ct.beginPath(); ct.arc(cx, cy, r, 0, Math.PI*2);
  if (color === 1) {
    const g = ct.createRadialGradient(cx-r*.3, cy-r*.3, r*.05, cx, cy, r);
    g.addColorStop(0,'#666'); g.addColorStop(.3,'#2a2a2a'); g.addColorStop(1,'#0d0d0d');
    ct.shadowColor='rgba(0,0,0,.6)'; ct.shadowBlur=C*.25;
    ct.shadowOffsetX=C*.06; ct.shadowOffsetY=C*.08;
    ct.fillStyle=g; ct.fill(); ct.shadowColor='transparent';
    ct.beginPath(); ct.arc(cx-r*.28, cy-r*.28, r*.22, 0, Math.PI*2);
    ct.fillStyle='rgba(255,255,255,.15)'; ct.fill();
  } else {
    const g = ct.createRadialGradient(cx-r*.3, cy-r*.35, r*.05, cx, cy, r);
    g.addColorStop(0,'#fff'); g.addColorStop(.5,'#ede8df'); g.addColorStop(1,'#c8c0b0');
    ct.shadowColor='rgba(0,0,0,.45)'; ct.shadowBlur=C*.22;
    ct.shadowOffsetX=C*.05; ct.shadowOffsetY=C*.07;
    ct.fillStyle=g; ct.fill(); ct.shadowColor='transparent';
    ct.strokeStyle='rgba(120,100,70,.35)'; ct.lineWidth=0.6; ct.stroke();
    ct.beginPath(); ct.arc(cx-r*.28, cy-r*.3, r*.2, 0, Math.PI*2);
    ct.fillStyle='rgba(255,255,255,.7)'; ct.fill();
  }
  if (isDead) {
    ct.globalAlpha = 1;
    ct.strokeStyle='#c0392b'; ct.lineWidth=Math.max(2, C*0.09); ct.beginPath();
    ct.moveTo(cx-r*.6,cy-r*.6); ct.lineTo(cx+r*.6,cy+r*.6);
    ct.moveTo(cx+r*.6,cy-r*.6); ct.lineTo(cx-r*.6,cy+r*.6); ct.stroke();
  }
  ct.restore();
}

function drawStateToCache() {
  sCtx.drawImage(boardCache, 0, 0, layout.S, layout.S);
  for (let i = 0; i < BOARD_SIZE; i++)
    if (state.board[i]) drawStoneTo(sCtx, xOf(i), yOf(i), state.board[i], state.deadStones.has(i));
  const lm = state.lastMove;
  if (lm !== null && state.board[lm]) {
    const {MARGIN:M, CELL:C} = layout;
    sCtx.beginPath();
    sCtx.arc(M + xOf(lm)*C, M + yOf(lm)*C, C*0.2, 0, Math.PI*2);
    sCtx.strokeStyle = state.board[lm] === 1 ? 'rgba(255,255,255,.85)' : 'rgba(0,0,0,.6)';
    sCtx.lineWidth = Math.max(1.5, C*0.07);
    sCtx.stroke();
  }
}

function resizeCanvas() {
  layout = computeLayout();
  const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1)), px = Math.round(layout.S * dpr);
  canvas.width = canvas.height = px;
  canvas.style.width = canvas.style.height = layout.S + 'px';
  boardCache.width = boardCache.height = px;
  stateCache.width = stateCache.height = px;
  for (const c of [ctx, bCtx, sCtx]) c.setTransform(dpr, 0, 0, dpr, 0, 0);
  generateGrain(); drawBoardToCache(); drawStateToCache();
}
resizeCanvas();

function render() { ctx.drawImage(stateCache, 0, 0, layout.S, layout.S); }

function drawGhost(col, row) {
  const {MARGIN:M, CELL:C} = layout;
  ctx.beginPath(); ctx.arc(M+col*C, M+row*C, C*0.44, 0, Math.PI*2);
  ctx.fillStyle = state.currentPlayer===1 ? 'rgba(28,28,28,.4)' : 'rgba(242,237,228,.5)';

}

const elStone=document.getElementById('turn-stone'), elLabel=document.getElementById('turn-label');

function eventToBoard(e, hitRadius) {
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(layout.S/rect.width);
  const my=(e.clientY-rect.top)*(layout.S/rect.height);
  const{MARGIN:M,CELL:C}=layout;
  const col=Math.round((mx-M)/C),row=Math.round((my-M)/C);
  if(col<0||col>=SIZE||row<0||row>=SIZE)return null;
  if(Math.hypot(mx-(M+col*C),my-(M+row*C))>C*hitRadius)return null;
  return {col,row};
}

function commitMove(col,row){
  const res=placeStone(col,row);render();updateUI(res.ok?'':res.reason);
  if(res.ok&&!state.gameOver&&!humanTurn())triggerAIMove();
}

canvas.addEventListener('pointerup', e => {
  if(zaehlPhase()){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    const p=eventToBoard(e, e.pointerType!=='mouse'?0.68:0.48);
    if(p&&toteKetteUmschalten(idx(p.col,p.row))){
      render();
      updateUI(`Wertung: ${state.finalMargin} · ${state.deadStones.size} tote Steine`);
    }
    return;
  }
  if(state.gameOver||!humanTurn())return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const isTouch = e.pointerType!=='mouse';
  const pos = eventToBoard(e, isTouch?0.68:0.48);
  if(!pos){ pendingTouch=null; render(); return; }
  if(!isTouch){ commitMove(pos.col,pos.row); return; }
  if(pendingTouch&&pendingTouch.col===pos.col&&pendingTouch.row===pos.row){
    pendingTouch=null;
    commitMove(pos.col,pos.row);
  } else if(state.board[idx(pos.col,pos.row)]===0){
    pendingTouch=pos;
    render(); drawGhost(pos.col,pos.row);
    updateUI(`${coordToLabel(pos.col,pos.row)} — erneut tippen zum Setzen`);
  } else {
    pendingTouch=null; render();
  }
});

canvas.addEventListener('mousemove', e => {
  if(state.gameOver||!humanTurn()||pendingTouch)return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(layout.S/rect.width);
  const my=(e.clientY-rect.top)*(layout.S/rect.height);
  const{MARGIN:M,CELL:C}=layout;
  const col=Math.round((mx-M)/C),row=Math.round((my-M)/C);
  render();
  if(col>=0&&col<SIZE&&row>=0&&row<SIZE&&state.board[idx(col,row)]===0)drawGhost(col,row);
});

function copyWithFeedback(text, btnId, idleLabel) {
  const zeige = ok => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.textContent = ok ? '✓' : '✗';
    btn.style.color = ok ? 'var(--green)' : 'var(--red)';
    setTimeout(() => { btn.textContent = idleLabel; btn.style.color = ''; }, 1500);
  };
  const ersatz = () => {
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    zeige(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(() => zeige(true), ersatz);
  else ersatz();
}

document.getElementById('btn-sgf').addEventListener('click', downloadSGF);

function buildBugReport() {
  const rows = [];
  for (let y = 0; y < SIZE; y++) {
    let r = '';
    for (let x = 0; x < SIZE; x++) r += '.XO'[state.board[idx(x, y)]] + ' ';
    rows.push(String(SIZE - y).padStart(2) + ' ' + r.trimEnd());

  rows.push('   ' + COL_LETTERS.split('').join(' '));
  return JSON.stringify({
    meta: {
      kennung:    PROJEKT_KENNUNG,
      erstellt:   new Date().toISOString(),
      userAgent:  navigator.userAgent,
      zug:        state.moveCount,

      kiFarbe:    state.aiColor === 1 ? 'Schwarz' : 'Weiß',

      workerDead: state.workerDead,
      workerDeadReason: state.workerDeadReason || null,
      spielVorbei: state.gameOver,
      koPoint:    state.koPoint,
      gefangene:  {...state.captures},
      toteSteine: [...state.deadStones].map(i => coordToLabel(xOf(i), yOf(i))),
      msProSim:   typeof _lastMsPerSim === 'number' ? Math.round(_lastMsPerSim * 100) / 100 : null
    },
    brett: rows,
    zugprotokoll: state.log,
    kiDiagnose: state.aiDiag,
    reproduktion: state.lastAIRequest
  }, null, 1);
}

document.getElementById('btn-bug-report').addEventListener('click', () => {
  copyWithFeedback(buildBugReport(), 'btn-bug-report', '🐞');
});
window.addEventListener('pagehide', kiTrainingAbschliessen);
render();updateUI();updateAIStatus();updateUndoButton();

<script id="policy-net">
'use strict';

class PolicyNet {
  constructor() {
    this.IN  = 3971;
    this.HID = 128;
    this.OUT = 361;

    this.gamesPlayed = 0;
    this.wins        = 0;
    this.lastResult  = null;

    const he = n => Math.sqrt(2/n);
    this.W1 = this._rand(this.HID * this.IN,  he(this.IN));
    this.b1 = new Float32Array(this.HID);
    this.W2 = this._rand(this.OUT * this.HID, he(this.HID));
    this.b2 = new Float32Array(this.OUT);
    const ref = (n, s) => s * Math.sqrt(n / 3);
    this._normRef1 = ref(this.HID * this.IN,  he(this.IN));
    this._normRef2 = ref(this.OUT * this.HID, he(this.HID));

    this._netPriors  = null;
    this._netHidden  = null;
    this._netInp     = null;
    this._netBlend   = 0;
    this._gameBuffer = [];
    this._trained    = false;
    this._lastMove   = null;
    this._healthy     = true;
    this._divergences = 0;

    if (this.load()) {
      console.log(`[PolicyNet] Geladen: ${this.gamesPlayed} Spiele · ${this.wins} Siege`);
    } else {
      console.log('[PolicyNet] Neue Gewichte initialisiert.');
    }
  }

  get blendWeight() {
    if (!this._healthy) return 0;
    if (this.gamesPlayed < 2) return 0;
    return Math.min(PARAMS.netMaxBlend,
      (this.gamesPlayed / Math.max(1, PARAMS.netWarmup)) * PARAMS.netMaxBlend);
  }

  _rand(n, scale) {
    const a = new Float32Array(n);
    for (let i = 0; i < n; i++) a[i] = (Math.random()*2-1) * scale;
    return a;
  }

  static _firstBad(a) {
    for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) return i;
    return -1;
  }

  _badWeight() {
    for (const [name, a] of [['W1',this.W1], ['b1',this.b1], ['W2',this.W2], ['b2',this.b2]]) {
      const i = PolicyNet._firstBad(a);
      if (i >= 0) return {name, i, v: a[i]};
    }
    return null;
  }

  _projectLayer(W, b, limit) {
    let n = 0;
    for (let i = 0; i < W.length; i++) n += W[i] * W[i];
    for (let i = 0; i < b.length; i++) n += b[i] * b[i];
    n = Math.sqrt(n);
    if (!(n > limit)) return 0;
    const f = limit / n;
    for (let i = 0; i < W.length; i++) W[i] *= f;
    for (let i = 0; i < b.length; i++) b[i] *= f;
    return n;
  }

  _diag(was, extra) {
    const spanne = a => {
      let mx = 0, nf = 0;
      for (let i = 0; i < a.length; i++) {
        const v = a[i];
        if (!Number.isFinite(v)) { nf++; continue; }
        const m = v < 0 ? -v : v;
        if (m > mx) mx = m;
      }
      return `max ${mx.toExponential(2)}, ${nf} nicht-finit`;
    };
    console.error(`[PolicyNet] ${was}`, Object.assign({
      gamesPlayed: this.gamesPlayed,
      wins:        this.wins,
      netBlend:    this.blendWeight,
      netMaxBlend: PARAMS.netMaxBlend,
      netWarmup:   PARAMS.netWarmup,
      netLR:          PARAMS.netLR,
      netGradClip:    PARAMS.netGradClip,
      netWeightDecay: PARAMS.netWeightDecay,
      netMaxNorm:     PARAMS.netMaxNorm,
      W1: spanne(this.W1), b1: spanne(this.b1),
      W2: spanne(this.W2), b2: spanne(this.b2)
    }, extra || {}));
  }

  boardToInput(board, color, lastMove = null, koPos = null) {
    const inp = new Float32Array(this.IN);
    const opp = color === 1 ? 2 : 1;
    for (let i = 0; i < 361; i++) {
      if      (board[i] === color) inp[i]     = 1;
      else if (board[i] === opp)   inp[361+i] = 1;
    }
    const liberties = new Uint8Array(361);
    const visited   = new Uint8Array(361);
    for (let i = 0; i < 361; i++) {
      if (board[i] === 0 || visited[i]) continue;
      const ff = floodFill(board, i);
      const L = ff.liberties.length;
      for (const g of ff.group) { visited[g] = 1; liberties[g] = L; }
    }
    for (let i = 0; i < 361; i++) {
      if (board[i] === 0) continue;
      const lib = Math.min(Math.max(liberties[i], 1), 4);
      inp[722 + i * 4 + (lib - 1)] = 1;
    }
    for (let i = 0; i < 361; i++) {
      if (board[i] && liberties[i] === 1) inp[722 + 361*4 + i] = 1;
    }
    if (koPos !== null && koPos >= 0) inp[722 + 361*5 + koPos] = 1;
    if (lastMove !== null) {
      const li = idx(lastMove.x, lastMove.y);
      inp[722 + 361*6 + li] = 1;
    }
    for (let i = 0; i < 361; i++) {
      const x = xOf(i), y = yOf(i);
      inp[722 + 361*7 + i] = Math.min(x, SIZE-1-x, y, SIZE-1-y) / (SIZE/2);
    }
    for (let i = 0; i < 361; i++) {
      if (board[i] === color) { inp[722 + 361*8 + i] = 1; continue; }
      if (board[i] !== 0) continue;
      let ownT = true;
      for (const n of NEIGHBORS[i]) if (board[n] === opp) { ownT = false; break; }
      if (ownT) inp[722 + 361*8 + i] = 1;
    }
    return inp;
  }

  forward(inp) {
    const {HID, IN, OUT} = this;
    const h = new Float32Array(HID);
    for (let j = 0; j < HID; j++) {
      let s = this.b1[j], base = j*IN;
      for (let i = 0; i < IN; i++) s += this.W1[base+i] * inp[i];
      h[j] = s > 0 ? s : 0;
    }
    const logits = new Float32Array(OUT);
    let maxL = -Infinity;
    for (let k = 0; k < OUT; k++) {
      let s = this.b2[k], base = k*HID;
      for (let j = 0; j < HID; j++) s += this.W2[base+j] * h[j];
      if ((logits[k] = s) > maxL) maxL = s;
    }
    const probs = new Float32Array(OUT);
    let sumE = 0;
    for (let k = 0; k < OUT; k++) { probs[k] = Math.exp(logits[k]-maxL); sumE += probs[k]; }
    for (let k = 0; k < OUT; k++) probs[k] /= sumE;

    const bad = PolicyNet._firstBad(probs);
    if (bad >= 0) {
      if (this._healthy) {
        this._healthy = false;
        let hMax = 0;
        for (const v of h) if (Number.isFinite(v) && v > hMax) hMax = v;
        this._diag('forward() liefert nicht-finite Wahrscheinlichkeiten — das Netz steuert ab sofort nicht mehr mit.',
          {ersterIndex: bad, wert: probs[bad], maxLogit: maxL, sumE,
           hiddenMax: hMax, hiddenKaputt: PolicyNet._firstBad(h)});
        this.dashUpdate();
      }
      const u = new Float32Array(OUT).fill(1 / OUT);
      return {probs: u, hidden: null};
    }
    return {probs, hidden: h};
  }

  _backward(inp, hidden, probs, moveIdx, reward) {
    const {HID, IN, OUT} = this;
    if (!inp || !hidden || !probs) return false;
    if (!Number.isFinite(reward)) return false;
    let lr = PARAMS.netLR * reward;
    if (!Number.isFinite(lr)) return false;
    if (PolicyNet._firstBad(probs) >= 0 || PolicyNet._firstBad(hidden) >= 0) return false;

    if (reward < 0) {
      const boden = 1 / OUT;
      const p = probs[moveIdx];
      if (!(p > 0)) return false;
      if (p < boden) lr *= p / boden;
    }

    const cap = PARAMS.netGradClip > 0 ? PARAMS.netGradClip : Infinity;

    const dL = new Float32Array(OUT);
    let nL = 0;
    for (let k = 0; k < OUT; k++) {
      let g = -(probs[k] - (k===moveIdx ? 1 : 0)) * lr;
      if (g >  cap) g =  cap;
      if (g < -cap) g = -cap;
      dL[k] = g; nL += g * g;
    }
    let nHid = 0;
    for (let j = 0; j < HID; j++) nHid += hidden[j] * hidden[j];
    const normL = Math.sqrt(nL * (1 + nHid));
    if (normL > cap) { const f = cap / normL; for (let k = 0; k < OUT; k++) dL[k] *= f; }

    for (let k = 0; k < OUT; k++) {
      if (Math.abs(dL[k]) < 1e-9) continue;
      this.b2[k] += dL[k];
      const base = k*HID;
      for (let j = 0; j < HID; j++) this.W2[base+j] += dL[k] * hidden[j];
    }

    const dH = new Float32Array(HID);
    let nH = 0;
    for (let j = 0; j < HID; j++) {
      if (hidden[j] <= 0) continue;
      let g = 0;
      for (let k = 0; k < OUT; k++) g += this.W2[k*HID+j] * dL[k];
      if (g >  cap) g =  cap;
      if (g < -cap) g = -cap;
      dH[j] = g; nH += g * g;
    }
    let nInp = 0;
    for (let i = 0; i < IN; i++) nInp += inp[i] * inp[i];
    const normH = Math.sqrt(nH * (1 + nInp));
    if (normH > cap) { const f = cap / normH; for (let j = 0; j < HID; j++) dH[j] *= f; }

    for (let j = 0; j < HID; j++) {
      if (Math.abs(dH[j]) < 1e-9) continue;
      this.b1[j] += dH[j];
      const base = j*IN;
      for (let i = 0; i < IN; i++) this.W1[base+i] += dH[j] * inp[i];
    }
    return true;
  }

  trainGame(reward) {
    const buf = this._gameBuffer;
    if (!buf.length) { console.log('[PolicyNet] Kein Buffer — kein Training.'); return; }
    const baseline = this.gamesPlayed > 0 ? (2 * this.wins / this.gamesPlayed - 1) : 0;
    const advantage = reward - baseline;
    let gelernt = 0, verworfen = 0;
    for (const {inp, probs, hidden, moveIdx} of buf) {
      if (this._backward(inp, hidden, probs, moveIdx, advantage)) gelernt++;
      else verworfen++;
    }

    const wd = PARAMS.netWeightDecay;
    if (wd > 0 && wd < 1 && gelernt) {
      const keep = Math.pow(1 - wd, gelernt);
      if (keep > 0 && keep < 1)
        for (const a of [this.W1, this.b1, this.W2, this.b2])
          for (let i = 0; i < a.length; i++) a[i] *= keep;
    }

    const mn = PARAMS.netMaxNorm;
    if (mn > 0) {
      const v1 = this._projectLayer(this.W1, this.b1, mn * this._normRef1);
      const v2 = this._projectLayer(this.W2, this.b2, mn * this._normRef2);
      if (v1 || v2)
        console.warn('[PolicyNet] Max-Norm griff — Schicht(en) zurückskaliert: '
          + (v1 ? `‖W1‖ ${v1.toExponential(2)} → ${(mn*this._normRef1).toExponential(2)} ` : '')
          + (v2 ? `‖W2‖ ${v2.toExponential(2)} → ${(mn*this._normRef2).toExponential(2)}` : ''));
    }

    const bad = this._badWeight();
    if (bad) {
      this._divergences++;
      this._diag(`Training divergiert (${bad.name}[${bad.i}] = ${bad.v}) — Partie verworfen.`,
        {advantage, zuege: buf.length, gelernt, verworfen, divergenzen: this._divergences});
      this._gameBuffer = [];
      if (this._divergences < 3 && this.load()) {
        this._healthy = true;
        console.warn('[PolicyNet] Letzter gültiger Stand wiederhergestellt '
          + `(${this.gamesPlayed} Spiele).`);
        this.dashUpdate();
      } else {
        console.warn('[PolicyNet] Kein gültiger Stand verfügbar — Netz wird zurückgesetzt.');
        this.reset();
      }
      return;
    }

    this._divergences = 0;
    this.gamesPlayed++;
    if (reward > 0) this.wins++;
    this.lastResult  = reward;
    this._gameBuffer = [];
    this.save();
    this.dashUpdate();
    const wr = Math.round(this.wins/this.gamesPlayed*100);
    console.log(`[PolicyNet] Spiel ${this.gamesPlayed}: ${reward>0?'Sieg ✓':'Niederlage ✗'} | Siege: ${wr}% | Blend: ${(this.blendWeight*100).toFixed(0)}%`
      + (verworfen ? ` | ${verworfen} von ${buf.length} Zügen ohne verwertbares Signal` : ''));
  }

  save() {
    const bad = this._badWeight();
    if (bad) {
      this._diag(`Speichern abgelehnt: ${bad.name}[${bad.i}] = ${bad.v}`);
      return false;
    }
    try {
      const enc = a => {
        const u = new Uint8Array(a.buffer); let s = '';
        for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
        return btoa(s);
      };
      localStorage.setItem('go_pnet', JSON.stringify({
        W1:enc(this.W1), b1:enc(this.b1),
        W2:enc(this.W2), b2:enc(this.b2),
        games:this.gamesPlayed, wins:this.wins
      }));
      return true;
    } catch(e) { console.warn('[PolicyNet] Speichern fehlgeschlagen:', e); return false; }
  }

  load() {
    try {
      const raw = localStorage.getItem('go_pnet');
      if (!raw) return false;
      const d = JSON.parse(raw);
      const dec = (s,C) => {
        const r=atob(s), b=new Uint8Array(r.length);
        for(let i=0;i<r.length;i++) b[i]=r.charCodeAt(i);
        return new C(b.buffer);
      };
      const w1=dec(d.W1,Float32Array), w2=dec(d.W2,Float32Array);
      if (w1.length !== this.HID*this.IN || w2.length !== this.OUT*this.HID) {
        console.log('[PolicyNet] Gespeicherte Gewichte haben andere Dimension — starte neu.');
        return false;
      }
      const b1=dec(d.b1,Float32Array), b2=dec(d.b2,Float32Array);
      if (b1.length !== this.HID || b2.length !== this.OUT) {
        console.log('[PolicyNet] Gespeicherte Biases haben andere Dimension — starte neu.');
        return false;
      }
      for (const [nm, a] of [['W1',w1], ['b1',b1], ['W2',w2], ['b2',b2]]) {
        const i = PolicyNet._firstBad(a);
        if (i >= 0) {
          console.warn(`[PolicyNet] Gespeicherte Gewichte enthalten NaN/Infinity `
            + `(${nm}[${i}] = ${a[i]}) — verworfen, Netz startet mit frischen Gewichten.`);
          return false;
        }
      }
      this.W1=w1; this.b1=b1;
      this.W2=w2; this.b2=b2;
      this.gamesPlayed=d.games||0; this.wins=d.wins||0;
      this._healthy=true;
      return true;
    } catch(e) { return false; }
  }

  reset() {
    localStorage.removeItem('go_pnet');
    const he = n => Math.sqrt(2/n);
    this.W1=this._rand(this.HID*this.IN, he(this.IN));
    this.b1=new Float32Array(this.HID);
    this.W2=this._rand(this.OUT*this.HID, he(this.HID));
    this.b2=new Float32Array(this.OUT);
    this.gamesPlayed=0; this.wins=0; this.lastResult=null;
    this._gameBuffer=[]; this._trained=false;
    this._healthy=true; this._divergences=0;
    this.save(); this.dashUpdate();
    console.log('[PolicyNet] Zurückgesetzt.');
  }

  dashUpdate() {
    const el = id => document.getElementById(id);
    if (!el('pn-games')) return;
    el('pn-games').textContent = this.gamesPlayed;
    const wr = this.gamesPlayed > 0 ? Math.round(this.wins/this.gamesPlayed*100) : 0;
    el('pn-wins').textContent  = `${this.wins} (${wr}%)`;
    el('pn-blend').textContent = `${(this.blendWeight*100).toFixed(0)}%`;
    const res = el('pn-result');
    res.textContent = this.lastResult===null ? '—' : this.lastResult>0 ? '✓ Sieg' : '✗ Niederlage';
    res.style.color = this.lastResult===null ? '' : this.lastResult>0 ? 'var(--green)' : 'var(--red)';
    const hp = el('pn-health');
    if (hp) {
      hp.textContent  = this._healthy ? 'ok' : '⚠ divergiert (steuert nicht)';
      hp.style.color  = this._healthy ? '' : 'var(--red)';
    }
    const bar = el('pn-warmup-bar');
    if (bar) bar.style.width = Math.min(100, (this.gamesPlayed/Math.max(1,PARAMS.netWarmup))*100)+'%';
  }
}

globalThis.policyNet = new PolicyNet();
</script>

        endAreaGain:      25,
      }
    },
    standard: {
      label: '↺ Standard',
      desc: 'Alle Werte auf Original zurücksetzen.',
      values: null
    }
  };

  window.dashApplyPreset = function(name) {
    const preset = PRESETS[name];
    if (!preset) return;
    if (preset.values === null) {
      dashReset();
    } else {
      Object.assign(PARAMS, PARAMS_DEFAULT, preset.values);
      dashSyncInputs();
    }
    document.querySelectorAll('.pd-preset-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('pd-preset-' + name)?.classList.add('active');
    dashRefreshPhase();
  };

  function dashSyncInputs() {
    for (const key of Object.keys(PARAMS_DEFAULT)) {
      const inp = document.getElementById('pd-' + key);
      if (!inp) continue;
      inp.value = PARAMS[key];
      inp.classList.toggle('changed', Math.abs(PARAMS[key] - PARAMS_DEFAULT[key]) > 1e-9);
    }
  }

  window.dashToggle = function() {
    const body = document.getElementById('pdash-body');
    const arrow = document.getElementById('pdash-arrow');
    const open = body.classList.toggle('open');
    arrow.textContent = open ? '▾' : '▸';
    if (open) dashRefreshPhase();
  };

  window.dashSecToggle = function(id) {
    const rows = document.getElementById('pdsec-' + id);
    const arr  = document.getElementById('pdarr-' + id);
    const c = rows.classList.toggle('collapsed');
    arr.textContent = c ? '▸' : '▾';
  };

  window.dashCrdUpdate = function(key, input) {
    const raw = parseInt(input.value.replace(',','.'), 10);
    if (isNaN(raw) || raw <= 0) return;
    PARAMS[key] = raw;
    input.classList.toggle('changed', raw !== PARAMS_DEFAULT[key]);
  };

  window.dashTipToggle = function(tipId, btn) {
    const el = document.getElementById(tipId);
    if (!el) return;
    const show = el.classList.toggle('show');
    btn.classList.toggle('active', show);
  };

  window.dashHintToggle = function(hintId) {
    const el = document.getElementById(hintId);
    if (el) el.classList.toggle('show');
  };

  window.dashUpdate = function(key, input, isFloat) {
    const valStr = input.value.replace(',', '.');
    let raw = isFloat ? parseFloat(valStr) : parseInt(valStr, 10);
    if (isNaN(raw)) return;
    const mn = input.min !== '' ? parseFloat(input.min) : -Infinity;
    const mx = input.max !== '' ? parseFloat(input.max) : Infinity;
    raw = Math.min(mx, Math.max(mn, raw));
    PARAMS[key] = raw;
    const changed = Math.abs(raw - PARAMS_DEFAULT[key]) > 1e-9;
    input.classList.toggle('changed', changed);
    if (key === 'rolloutWeight' || key === 'scoreWeight') {
      const clamped = Math.min(1, Math.max(0, raw));
      const other = key === 'rolloutWeight' ? 'scoreWeight' : 'rolloutWeight';
      PARAMS[key] = clamped;
      input.value = clamped;
      PARAMS[other] = parseFloat((1 - clamped).toFixed(4));
      const otherInput = document.getElementById('pd-' + other);
      if (otherInput) {
        otherInput.value = PARAMS[other];
        otherInput.classList.toggle('changed', Math.abs(PARAMS[other] - PARAMS_DEFAULT[other]) > 1e-9);
      }
    }
    dashRefreshPhase();
  };

  window.dashRefreshPhase = function() {
    const badge = document.getElementById('pd-phase-badge');
    if (!badge || typeof state === 'undefined') return;
    const mc = state.moveCount;
    const empty = 361 - Array.from(state.board).filter(v=>v>0).length;
    const {wOpen, wMid, wEnd} = phaseWeights(mc, empty);
    const phase = (wEnd >= wOpen && wEnd >= wMid) ? 'Endspiel'
                : (wOpen >= wMid) ? 'Eröffnung' : 'Mittelspiel';
    const parts = [];
    if (wOpen > 0.02) parts.push(`Ö ${Math.round(wOpen*100)}%`);
    if (wMid  > 0.02) parts.push(`M ${Math.round(wMid*100)}%`);
    if (wEnd  > 0.02) parts.push(`E ${Math.round(wEnd*100)}%`);
    badge.textContent = (parts.length > 1 ? parts.join(' · ') : phase) + ' (Zug ' + mc + ')';
    const col = phase==='Eröffnung'?'rgba(39,174,96,.15)':phase==='Mittelspiel'?'rgba(200,160,90,.12)':'rgba(192,57,43,.12)';
    const brd = phase==='Eröffnung'?'rgba(39,174,96,.3)':phase==='Mittelspiel'?'rgba(200,160,90,.3)':'rgba(192,57,43,.3)';
    const txt = phase==='Eröffnung'?'var(--green)':phase==='Mittelspiel'?'var(--wood-light)':'var(--red)';
    badge.style.cssText=`display:inline-block;padding:1px 6px;border-radius:2px;margin-left:4px;font-size:.55rem;background:${col};color:${txt};border:1px solid ${brd}`;
    if (window.policyNet) policyNet.dashUpdate();
  };

  function dashAbweichungen() {
    const a = {};
    for (const k of Object.keys(PARAMS_DEFAULT))
      if (typeof PARAMS[k] === 'number' && Math.abs(PARAMS[k] - PARAMS_DEFAULT[k]) > 1e-12) a[k] = PARAMS[k];
    return a;
  }
  window.dashSave = function() {
    let ok = true;
    try { localStorage.setItem(PD_STORE, JSON.stringify({version: PD_VERSION, abweichungen: dashAbweichungen()})); }
    catch (e) { console.warn('[Dashboard] Speichern fehlgeschlagen:', e); ok = false; }
    const btn = document.getElementById('pd-save-btn');
    const orig = '💾 Speichern';
    btn.textContent = ok ? '✓ Gespeichert' : '✗ Fehler';
    btn.style.color = ok ? 'var(--green)' : 'var(--red)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1500);
  };

  function dashLoadSaved() {
    let raw;
    try { raw = localStorage.getItem(PD_STORE); }
    catch (e) { console.warn('[Dashboard] localStorage nicht lesbar:', e); return 0; }
    if (!raw) return 0;
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { console.warn('[Dashboard] Gespeicherte Konfig unlesbar, ignoriert'); return 0; }
    if (!obj || obj.version !== PD_VERSION || typeof obj.abweichungen !== 'object' || !obj.abweichungen) {
      try { localStorage.removeItem(PD_STORE); } catch (e) {}
      const hinweis = 'Gespeicherte Einstellungen im alten Format verworfen (sie hielten alte Defaults fest). Eigene Änderungen bitte neu speichern.';
      console.warn('[Dashboard] ' + hinweis);
      if (typeof state !== 'undefined' && state.log) state.log.push('! ' + hinweis);
      return 0;
    }
    let n = 0;
    for (const k of Object.keys(PARAMS_DEFAULT)) {
      const v = obj.abweichungen[k];
      if (typeof v === 'number' && Number.isFinite(v)) { PARAMS[k] = v; n++; }
    }
    if (n) console.log(`[Dashboard] ${n} gespeicherte Parameter geladen`);
    return n;
  }

  window.dashReset = function() {
    try { localStorage.removeItem(PD_STORE); } catch (e) {}
    Object.assign(PARAMS, PARAMS_DEFAULT);
    for (const key of Object.keys(PARAMS_DEFAULT)) {
      const inp = document.getElementById('pd-' + key);
      if (inp) { inp.value = PARAMS[key]; inp.classList.remove('changed'); }
    }
    for (const sec of SECTIONS)
      if (sec.params) for (const p of sec.params) {
        const inp = document.getElementById('pd-' + p.key);
        if (inp) { inp.value = PARAMS[p.key]; inp.classList.remove('changed'); }
      }
    document.querySelectorAll('.pd-preset-btn').forEach(b=>b.classList.remove('active'));
    dashRefreshPhase();
  };

  window.dashExport = function() {
    const lines = [
      '// Go KI — Parameter-Snapshot',
      `// Stand: Zug ${typeof state!=='undefined'?state.moveCount:0}`,
      '// Haupthebel: endAreaGain (×30), passGainThreshold, aiTimeBudget',
      'globalThis.PARAMS = {'
    ];
    for (const [k,v] of Object.entries(PARAMS)) lines.push(`  ${k}: ${v},`);
    lines.push('};');
    copyWithFeedback(lines.join('\n'), 'pd-export-btn', '⬇ Export');
  };

  const origUpdateUI = window.updateUI;
  if (typeof origUpdateUI === 'function') {
    window.updateUI = function(...args) { origUpdateUI(...args); dashRefreshPhase(); };
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('[PWA] Service Worker nicht registriert:', e));
  });
}
</script>
