    let gz = PARAMS.gebietZug * (tbBilanzNach(lsAktiv() ? lsNach(nb, i, color) : nb) - (lsAktiv() ? lsBasis(color) : _tbBilanz)) * (color === 1 ? 1 : -1);
    /* Gebiet nach Freiheiten (PARAMS.gebietFreiheit): der Gewinn einer
       schwachen neuen Kette zaehlt nur anteilig. */
    if (PARAMS.gebietFreiheit > 0 && gz > 0) {
      const lib = countLiberties(nb, i, 4);
      if (lib < 4) gz *= GEBIET_FREIHEIT[lib];
    }
    sPhase += gz;
  }
  if (PARAMS.raumZug > 0 && _raumValid)
    sPhase += PARAMS.raumZug * PARAMS.captureWeight * raumZugGewinn(board, i, color);
  if ((PARAMS.influenceInvade > 0 || PARAMS.influenceOwn > 0) && _infValid) {
    const zone = influenceZone(i, color);
    if (zone < 0) sPhase += PARAMS.influenceInvade;
    else if (zone > 0) sPhase -= PARAMS.influenceOwn;
  }
  const wCrisis = getCrisisWeight(i);
  if (wCrisis === 0) return sPhase;
  const sCrisis = evalTsumego(board, i, color, mc);
  return (1 - wCrisis) * sPhase + wCrisis * sCrisis;
}

function quickEval(board, i, color) {
  const opp = color === 1 ? 2 : 1;
  let score = 0, free = 0, oppN = 0, ownN = 0, schwach = 0;
  /* countLiberties mit Cap statt floodFill: läuft pro Rollout-Kandidat und
     pro MCTS-Expansions-Kind — die Arrays hier waren der heißeste Müll. */
  for (const n of NEIGHBORS[i]) {
    const c = board[n];
    if (c === 0) free++;
    else if (c === opp) { oppN++; if (countLiberties(board, n, 2) === 1) score += 200; }
    else { ownN++; if (countLiberties(board, n, 3) <= 2) schwach++; }
  }
  _quickScratch.set(board);
  _quickScratch[i] = color;
  const cap = removeDeadGroups(_quickScratch, opp, i);
  score += cap * 500;
  const selfLib = countLiberties(_quickScratch, i, PARAMS.quickRettung > 0 ? 3 : 2);
  if (selfLib === 1 && cap === 0) score -= 300;
  /* +80 je Nachbarstein einer eigenen Kette mit höchstens zwei Freiheiten.
     quickRettung: nur, wenn die Kette danach mindestens drei hat. */
  if (schwach && (PARAMS.quickRettung <= 0 || selfLib >= 3)) score += 80 * schwach;
  return score + free*40 + oppN*20 + ownN*15 + Math.random()*5;
}

/* Fix #3 + Perf-Refactor: evaluateBoard läuft einmal pro MCTS-Simulation
   (tausende Male pro Zug). Statt floodFill pro Gruppe (zwei Arrays pro
   Aufruf!) jetzt ein einziger BFS-Durchlauf, der nur ZÄHLT: Gruppengröße
   direkt, Freiheiten dedupliziert über eine Epochen-Markierung pro Gruppe.
   Null Allokationen, identisches Ergebnis. */
/* Sterbe-Rampe für deathDiscount, Index = Freiheiten der Gruppe. Index 0 ist
   nur Absicherung (eine Gruppe ohne Freiheiten steht nie auf dem Brett), ab
   vier Freiheiten kein Abschlag. Siehe den Kommentar an deathDiscount. */
const STERBE_RAMPE = [1, 1, 0.5, 0.25];

let _deckelRufe = 0, _deckelGriff = 0;
/* Waechter fuer den Gefangenen-Deckel: wie oft wurde evaluateBoard mit
   eingeschaltetem Deckel gerufen, und wie oft hat er tatsaechlich
   zugeschnitten. Bleibt der Anteil bei 0, ist der Deckel zu hoch gesetzt
   und ein Nullergebnis bedeutungslos. */
function leseDeckelWaechter(reset) {
  const v = {rufe: _deckelRufe, griff: _deckelGriff};
  if (reset) { _deckelRufe = 0; _deckelGriff = 0; }
  return v;
}

/* Eigener Epochenzaehler fuer _evalBoardSeen, NICHT _nextFfEpoch.
   evaluateBoard haelt seenEpoch ueber die ganze Schleife und holt darin
   pro Gruppe eine Freiheiten-Epoche aus _nextFfEpoch. Hing _evalBoardSeen
   am selben Zaehler, loeschte dessen Ueberlauf (rund alle neun Partien im
   Harness) mitten in der Schleife alle Gesehen-Marken: jede schon gezaehlte
   Gruppe mit einem Stein hinter der aktuellen Position wurde ein zweites
   Mal gezaehlt. Ob das passierte, hing nur am Zaehlerstand seit
   Prozessstart -- deshalb spielte ein Harness-Prozess, der bei Partie 1
   begann, Partie 151 anders als einer, der spaeter einsetzte
   (docs/endspielgrenze.md, §8 und §9). Dieser Zaehler laeuft nur am Anfang
   von evaluateBoard ueber, vor jeder Marke dieses Aufrufs. */
const _evalBoardSeen = new Int32Array(BOARD_SIZE);
let _evalSeenEpoch = 0;
function _nextEvalSeenEpoch() {
  if (++_evalSeenEpoch >= 0x7fffffff) {
    _evalSeenEpoch = 1;
    _evalBoardSeen.fill(0);
  }
  return _evalSeenEpoch;
}

/* TRANSFER-WAECHTER. Zaehlt, was die Uebertragung (deathTransfer) in
   evaluateBoard tatsaechlich anrichtet. Alle Zaehler werden nur beschrieben,
   wenn PARAMS.transferTelemetrie > 0 ist.

   capAbs/gesamtAbs werden als Betragssummen gefuehrt, nicht als Verhaeltnis
   je Aufruf: |s| kann beliebig nahe an 0 liegen, ein Quotient je Aufruf
   explodiert dort und der Mittelwert waere Muell. Die Summe der Betraege
   ist stabil und beantwortet dieselbe Frage -- wie viel des Bewertungs-
   betrags kommt aus dem Gefangenen-Term. */
let _trRufe = 0, _trGruppen = 0, _trSumme = 0, _trMax = 0, _trUeber = 0;
let _trEigen = 0, _trFremd = 0, _trCapAbs = 0, _trGesamtAbs = 0;

/* Wie oft der Raumrisiko-Abschlag greift (Ketten je Bewertung, summiert). */
let _raumGriff = 0;
function leseRaumWaechter(reset) { const v = _raumGriff; if (reset) _raumGriff = 0; return v; }

function leseTransferWaechter(reset) {
  const v = {rufe: _trRufe, gruppen: _trGruppen, summe: _trSumme, max: _trMax,
             ueber: _trUeber, eigen: _trEigen, fremd: _trFremd,
             capAbs: _trCapAbs, gesamtAbs: _trGesamtAbs};
  if (reset) {
    _trRufe = 0; _trGruppen = 0; _trSumme = 0; _trMax = 0; _trUeber = 0;
    _trEigen = 0; _trFremd = 0; _trCapAbs = 0; _trGesamtAbs = 0;
  }
  return v;
}

function evaluateBoard(board, color, captures) {
  const opp = color === 1 ? 2 : 1;
  let gefangen = ((captures[color]||0) - (captures[opp]||0)) * PARAMS.captureWeight;
  /* Deckel gegen die Q-Saettigung. 0 = aus, dann steht hier bitgenau der alte
     Ausdruck und es wird nichts gerechnet. Siehe den Kommentar an captureCap. */
  if (PARAMS.captureCap > 0) {
    if (gefangen >  PARAMS.captureCap) { gefangen =  PARAMS.captureCap; _deckelGriff++; }
    else if (gefangen < -PARAMS.captureCap) { gefangen = -PARAMS.captureCap; _deckelGriff++; }
    _deckelRufe++;
  }
  let s = gefangen;
  /* Benson-Ebene: beweisbar tote Gruppen zählen 0 statt Größe×5+Frei×3 —
     genau der Term, der im Spätspiel den Q-Kollaps produziert, wenn tote
     Klumpen als lebendiges Material gewertet werden. Gate über die Zahl
     freier Felder: früh gibt es ohnehin keine pass-alive-Ketten, und die
     Analyse pro Simulation soll den Perf-Refactor nicht wieder auffressen. */
  let bEpoch = -1;
  if (PARAMS.bensonEval >= 1) {
    let empt = 0;
    for (let i = 0; i < BOARD_SIZE; i++) if (!board[i]) empt++;
    if (empt <= PARAMS.bensonEvalMaxEmpty) bEpoch = bensonClassify(board);
  }
  const seenEpoch = _nextEvalSeenEpoch();
  const raum = PARAMS.raumGewicht > 0 && _raumValid;
  for (let i = 0; i < BOARD_SIZE; i++) {
    const c = board[i]; if (!c || _evalBoardSeen[i] === seenEpoch) continue;
    if (bEpoch >= 0 && _bnDead[i] === bEpoch) {
      /* Ganze Kette beweisbar tot → zählt als Material 0; nur als gesehen
         markieren. Die Größe wird dabei mitgezählt, weil bensonDeathTransfer
         sie braucht — ohne den Parameter kostet das nur das Hochzählen. */
      let head = 0, tail = 0, groesse = 0;
      _groupQueue[tail++] = i; _evalBoardSeen[i] = seenEpoch;
      while (head < tail) {
        const g = _groupQueue[head++]; groesse++;
        for (const n of NEIGHBORS[g])
          if (board[n] === c && _evalBoardSeen[n] !== seenEpoch) { _evalBoardSeen[n] = seenEpoch; _groupQueue[tail++] = n; }
      }
      /* Übertragung für den BEWIESENEN Tod. Siehe den Kommentar an
         bensonDeathTransfer: ohne ihn bekommt die stärkste Evidenz die
         schwächste Buchung. Bei 0 wird s nicht angefasst — bitgenau der
         Zustand vor dieser Änderung, deshalb steht die Prüfung vor der
         Arithmetik und nicht in ihr. */
      if (PARAMS.bensonDeathTransfer > 0) {
        const _bt = PARAMS.bensonDeathTransfer * groesse * PARAMS.captureWeight;
        s += (c === color) ? -_bt : _bt;
      }
      continue;
    }
    const libEpoch = _nextFfEpoch();
    let head = 0, tail = 0, size = 0, libs = 0, k3 = -1;
    _groupQueue[tail++] = i; _evalBoardSeen[i] = seenEpoch;
    while (head < tail) {
      const g = _groupQueue[head++]; size++;
      if (raum && board[g] === _raumBrett[g] && _raumK3[g] > k3) k3 = _raumK3[g];
      for (const n of NEIGHBORS[g]) {
        const cc = board[n];
        if (cc === c) {
          if (_evalBoardSeen[n] !== seenEpoch) { _evalBoardSeen[n] = seenEpoch; _groupQueue[tail++] = n; }
        } else if (cc === 0 && _ffVisited[n] !== libEpoch) {
          _ffVisited[n] = libEpoch; libs++;
        }
      }
    }
    let v = size * 5 + libs * 3;
    /* Benson-lebende Kette (PARAMS.bensonAliveExempt): bewiesen nicht zu
       fangen, also ohne Sterbe-Abschlag. Bei 0 ist das immer false. */
    const lebend = PARAMS.bensonAliveExempt >= 1 && bEpoch >= 0 && _bnAlive[i] === bEpoch;
    /* Vor der Vorzeichenzuweisung, damit Abschlag und Übertragung für eigene
       und fremde Gruppen gleich gelten. Bei deathDiscount 0 und
       deathTransfer 0 wird kein Zweig betreten und v bleibt bitgenau der
       alte Ausdruck. */
    if (libs < STERBE_RAMPE.length && size >= PARAMS.deathDiscountSize && !lebend) {
      const anteil = STERBE_RAMPE[libs];
      if (PARAMS.deathDiscount > 0) v *= 1 - PARAMS.deathDiscount * anteil;
      /* Übertragung: die Gruppe gilt anteilig als bereits geschlagen, also
         bekommt der Gegner die Gefangenen gutgeschrieben — dieselbe Größe,
         die captures[] beim echten Schlagen bekäme. Das ist die Hälfte der
         Bewertungslücke, die der reine Abschlag prinzipiell nicht erreicht.
         Siehe den Kommentar an deathTransfer. */
      if (PARAMS.deathTransfer > 0) {
        /* In eine Konstante gehoben, damit der Waechter denselben Wert
           sieht, der abgezogen wird -- derselbe Ausdruck, dieselbe
           Reihenfolge, also bitgenau dasselbe Ergebnis wie vorher. */
        const _dt = PARAMS.deathTransfer * anteil * size * PARAMS.captureWeight;
        if (PARAMS.transferTelemetrie > 0) {
          _trGruppen++;
          _trSumme += _dt;
          if (_dt > _trMax) _trMax = _dt;
          /* Ueberkompensation: der Abzug uebersteigt den Gruppenwert, die
             Gruppe zaehlt danach NEGATIV, obwohl sie noch auf dem Brett
             steht. Vor dem Abzug pruefen, sonst misst man sich selbst. */
          if (_dt > v) _trUeber++;
          if (c === color) _trEigen += _dt; else _trFremd += _dt;
        }
        v -= _dt;
      }
    }
    /* Raumrisiko: nur 4-7 Freiheiten und nur Ketten mit mindestens einem
       Wurzelstein (k3 >= 0); neue Steine allein tragen kein K3. */
    if (raum && libs >= 4 && libs <= 7 && k3 >= 0 && size >= PARAMS.deathDiscountSize && !lebend) {
      const r = RAUM_RISIKO[libs - 4][k3 === 0 ? 0 : k3 <= 4 ? 1 : k3 <= 14 ? 2 : 3];
      if (r > 0) { v -= PARAMS.raumGewicht * r * size * PARAMS.captureWeight; _raumGriff++; }
    }
    s += (c === color) ? v : -v;
  }
  /* Gebiet: nach allen Kettentermen, vor der Telemetrie. Bei 0 kein Zweig. */
  if (PARAMS.gebietGewicht > 0) {
    const g = gebietBilanz(board);
    s += PARAMS.gebietGewicht * (color === 1 ? g : -g);
  }
  if (PARAMS.transferTelemetrie > 0) {
    _trRufe++;
    /* gefangen ist der Wert, der WIRKLICH in s eingeht -- also nach dem
       captureCap-Deckel, falls einer gesetzt ist. Den Rohwert zu zaehlen
       waere die ehrlichere Klage, aber die falsche Antwort auf die Frage
       "wie sehr beherrscht der Term die Bewertung". */
    _trCapAbs += Math.abs(gefangen);
    _trGesamtAbs += Math.abs(s);
  }
  return s;
}

const _emptyHashes = new Set();

/* PERF: Rollouts brauchen keine vollständige Zugliste — eine zufällige
   Stichprobe legaler Züge reicht für die Playout-Policy und spart pro
   Ply ~85% der Legalitätsprüfungen. Iteriert geshuffelt weiter, falls
   die ersten Kandidaten illegal sind → Pass-Erkennung bleibt korrekt.
   PARAMS.rolloutSample = 0 stellt das alte Verhalten wieder her. */
function sampleLegalMoves(board, color, S, koPoint, hardDeadline) {
  const empties = [];
  for (let i = 0; i < BOARD_SIZE; i++) if (board[i] === 0) empties.push(i);
  if (!empties.length) return [];
  const opp = color === 1 ? 2 : 1;
  const moves = [];
  const limit = Math.min(S, empties.length);
  const hasKo = koPoint !== null && koPoint !== undefined;
  _legalScratch.set(board);
  for (let j = 0; j < empties.length && moves.length < limit; j++) {
    /* Sicherheitsbremse in der heißen Schleife, s. getLegalMoves */
    if (hardDeadline !== undefined && (j & 15) === 15 && Date.now() > hardDeadline) break;
    const r = j + Math.floor(Math.random() * (empties.length - j));
    const t = empties[j]; empties[j] = empties[r]; empties[r] = t;
    const i = empties[j];
    if (hasKo && i === koPoint) continue;   /* Fix 7 */
    _legalScratch[i] = color;
    const {captured, undo} = removeDeadGroupsUndoable(_legalScratch, opp, i);
    let legal = true;
    if (captured === 0 && countLiberties(_legalScratch, i, 1) === 0) legal = false;
    applyUndo(_legalScratch, undo);
    _legalScratch[i] = 0;
    if (legal) moves.push({x: xOf(i), y: yOf(i), idx: i});
  }
  return moves;
}

/* Ko-Punkt nach einem Zug auf i, der cap Steine geschlagen hat: genau ein
   Stein geschlagen, und der neue Stein steht allein mit einer Freiheit ->
   diese Freiheit ist für den Gegner verboten. Sonst kein Ko. Dieselbe Regel
   wie placeStone, rollout und die Wurzel. */
function koNachZug(board, i, cap) {
  if (cap !== 1) return null;
  const ff = floodFill(board, i);
  return (ff.group.length === 1 && ff.liberties.length === 1) ? ff.liberties[0] : null;
}

function rollout(board, startColor, histHashes, captures, depth, rootColor, koPoint, hardDeadline) {
  _rolloutScratch.set(board);
  const simCap = {1: captures[1]||0, 2: captures[2]||0};
  let color = startColor, passes = 0;
  const S = PARAMS.rolloutSample | 0;
  let currentKo = koPoint;   /* Fix 7: Ko-Punkt wandert durch die Simulation */
  for (let d = 0; d < depth; d++) {
    /* Sicherheitsbremse: getLegalMoves/floodFill werden auf dichten Brettern
       mit großen Gruppen teuer — jeder Ply hier kostet potenziell mehrere
       Kandidaten-floodFills. Ohne diese Prüfung könnte ein einzelner Rollout
       bei einer pathologisch teuren Stellung die gesamte Zeit aufbrauchen,
       bevor mctsPUCT's äußere Schleife überhaupt wieder zum Zug kommt. */
    if (hardDeadline !== undefined && Date.now() > hardDeadline) break;
    const opp = color === 1 ? 2 : 1;
    let legal = (S > 0)
      ? sampleLegalMoves(_rolloutScratch, color, S, currentKo, hardDeadline)
      : getLegalMoves(_rolloutScratch, color, _emptyHashes, currentKo, hardDeadline);
    if (PARAMS.augenSchutz >= 2) legal = legal.filter(m => !fuelltEigenesAuge(_rolloutScratch, m.idx, color));
    if (!legal.length) { if (++passes >= 2) break; color = opp; currentKo = null; continue; }
    passes = 0;
    const scored = legal.map(m => ({m, score: quickEval(_rolloutScratch, m.idx, color)}));
    scored.sort((a,b) => b.score - a.score);
    const K = d < 10 ? 3 : 6;
    const top = scored.slice(0, Math.min(K, scored.length));
    const ch = top[Math.floor(Math.random() * top.length)];
    _rolloutScratch[ch.m.idx] = color;
    const cap = removeDeadGroups(_rolloutScratch, opp, ch.m.idx);
    simCap[color] += cap;
    /* Ko-Punkt für den nächsten Ply aktualisieren — floodFill ist billig,
       läuft nur bei Einzelschlag (cap===1), was in Rollouts selten ist. */
    currentKo = koNachZug(_rolloutScratch, ch.m.idx, cap);
    color = opp;
  }
  return evaluateBoard(_rolloutScratch, rootColor, simCap);
}

/* ═══ MCTS mit PUCT — alternativer Such-Ansatz (PARAMS.useMCTS) ═══
   Statt flacher Kandidaten-Liste + unabhängiger Rollouts: ein Baum,
   der vielversprechende Varianten tiefer verfolgt und schlechte
   früh aufgibt. Auswahl: Q + puctC · P · √N_parent / (1+n).
   Priors rang-basiert (skalenfrei, keine Temperatur nötig):
   Wurzel aus der schweren MoE-Eval (inkl. Net-Blend),
   innere Knoten aus quickEval. Werte via tanh(evaluateBoard/scale),
   immer aus Sicht der KI gespeichert → Gegner-Knoten invertieren. */
const _mctsScratch = new Uint8Array(BOARD_SIZE);
/* Zähler für nicht-finite PUCT-Scores, pro Suche zurückgesetzt. Sie sind
   immer ein Symptom (kaputter Prior oder kaputter Rollout-Wert) und dürfen
   nicht still bleiben — vorher endeten sie in einem TypeError. */
let _mctsNonFinite = 0;

function _mctsKids(list, K) {
  const n = Math.min(K, list.length);
  if (!n) return [];
  const kids = new Array(n);
  let P = null;
  const sharp = PARAMS.mctsPriorSharp;
  if (sharp > 0 && n > 1) {
    /* Score-basierter Prior (Softmax), skalen-invariant über die Spannweite.
       Der alte Rang-Prior (n-r)/sum war bei n=16 fast flach — Top 11.8 %,
       Zweiter 11.0 %, Abstand 0.74 Prozentpunkte — und verwarf die tatsächlichen
       Heuristik-Scores komplett. Gemessener Best-Move-Anteil lag damit bei
       10-15 %, also praktisch auf Prior-Niveau: der Baum verschob nichts,
       die Zugwahl war Rauschen zwischen den Top-Kandidaten.
       Temperatur folgt der Score-Spannweite, damit derselbe Parameter in
       der Eröffnung (~40-95) und im Mittelspiel (~Hunderte) gleich wirkt.

       Nicht-finite Scores werden hier ABGEFANGEN statt weitergereicht.
       Vorher genügte ein einziges NaN in der Liste (aus dem Policy-Net-
       Blend in getAIMove), um über Z = NaN die Priors ALLER Kinder auf NaN
       zu setzen — und damit jeden PUCT-Score dieses Knotens. Spannweite und
       Summe laufen deshalb nur über finite Scores; ein NaN-Kandidat wird auf
       den kleinsten finiten Score gezogen: er bleibt wählbar, bestimmt aber
       nichts mehr. hi/lo werden explizit gesucht statt aus list[0]/list[n-1]
       gelesen — bei NaN in der Liste ist die Sortierung selbst wertlos. */
    let hi = -Infinity, lo = Infinity;
    for (let r = 0; r < n; r++) {
      const v = list[r].score;
      if (!Number.isFinite(v)) continue;
      if (v > hi) hi = v;
      if (v < lo) lo = v;
    }
    if (hi > -Infinity) {
      const T = Math.max(1e-6, (hi - lo) / sharp);
      const w = new Array(n); let Z = 0;
      for (let r = 0; r < n; r++) {
        const v = Number.isFinite(list[r].score) ? list[r].score : lo;
        w[r] = Math.exp((v - hi) / T); Z += w[r];
      }
      /* Z kann trotz finiter Scores entarten (0 durch Unterlauf). Dann
         lieber der Rang-Prior unten als NaN/Infinity im Baum. */
      if (Number.isFinite(Z) && Z > 0) {
        P = new Array(n);
        for (let r = 0; r < n; r++) P[r] = w[r] / Z;
      }
    }
  }
  if (!P) {   /* Rang-Prior: sharp = 0, n = 1 — und jeder entartete Softmax oben */
    const sum = n * (n + 1) / 2;
    P = new Array(n);
    for (let r = 0; r < n; r++) P[r] = (n - r) / sum;
  }
  /* Endspiel-Netz (PARAMS.endspielNetz): nur an der Wurzel, nur wenn
     endspielNetzWurzel die Liste markiert hat */
  if (list.__pNetz && list.__lambda > 0) {
    let z = 0; const q = new Array(n);
    for (let r = 0; r < n; r++) { q[r] = list.__pNetz[list[r].m.idx] || 0; z += q[r]; }
    if (z > 0) for (let r = 0; r < n; r++) P[r] = (1 - list.__lambda) * P[r] + list.__lambda * q[r] / z;
  }
  for (let r = 0; r < n; r++)
    kids[r] = {idx: list[r].m.idx, x: list[r].m.x, y: list[r].m.y,
               P: P[r], N: 0, W: 0, kids: null};
  return kids;
}

/* Modul-Zustand für Tree-Reuse. Lebt im Worker zwischen Zügen (Worker-Pool
   macht das möglich) und verschwindet automatisch bei resetGame, weil der
   gepoolte Worker dann terminiert und beim nächsten Hard-Zug neu gebaut wird —
   kein explizites Invalidieren nötig. */
let _mctsSavedRoot = null;   // {node, board (Zustand NACH unserem Zug), aiColor}

/* Waechter fuer Tree-Reuse und frische Wurzel: Suchen, davon mit
   uebernommenem Teilbaum, und bei wurzelFrisch die Zahl der Wurzelkinder mit
   uebernommener Statistik und der verworfenen alten Kinder. Nur gezaehlt,
   aendert nichts an der Suche. */
let _wurzelSuchen = 0, _wurzelWieder = 0, _wurzelUebernommen = 0, _wurzelVerworfen = 0;
function leseWurzelWaechter(reset) {
  const v = {suchen: _wurzelSuchen, wieder: _wurzelWieder,
             uebernommen: _wurzelUebernommen, verworfen: _wurzelVerworfen};
  if (reset) _wurzelSuchen = _wurzelWieder = _wurzelUebernommen = _wurzelVerworfen = 0;
  return v;
}

/* Wurzel neu aus der Kandidatenliste bilden und die Statistik gleicher Zuege
   aus dem uebernommenen Teilbaum mitnehmen. Siehe PARAMS.wurzelFrisch. */
function _frischeWurzel(alt, rootScored) {
  const kids = _mctsKids(rootScored, PARAMS.mctsRootChildren);
  const vorher = new Map(alt.kids.map(k => [k.idx, k]));
  let N = 0, W = 0;
  for (const k of kids) {
    const o = vorher.get(k.idx);
    if (!o) continue;
    k.N = o.N; k.W = o.W; k.kids = o.kids;
    if (o.amafN !== undefined) { k.amafN = o.amafN; k.amafW = o.amafW; }
    N += o.N; W += o.W;
    vorher.delete(k.idx);
    _wurzelUebernommen++;
  }
  _wurzelVerworfen += vorher.size;
  return {N, W, kids};
}

function _tryReuseSubtree(savedBoard, aiColor, savedNode, currentBoard) {
  if (!savedNode || !savedNode.kids || !savedNode.kids.length) return null;
  const opp = aiColor === 1 ? 2 : 1;
  for (const kid of savedNode.kids) {
    _mctsScratch.set(savedBoard);
    _mctsScratch[kid.idx] = opp;
    removeDeadGroups(_mctsScratch, aiColor, kid.idx);
    let same = true;
    for (let i = 0; i < 361; i++) if (_mctsScratch[i] !== currentBoard[i]) { same = false; break; }
    if (same) return kid;
  }
  return null;   /* Board passt zu keinem Kind → Undo/Pass/Fremdzug → frischer Baum */
}

function mctsPUCT(board, aiColor, captures, rootScored, koPoint) {
  const _simStart = Date.now();
  _mctsNonFinite = 0;
  /* Feste Simulationszahl statt Zeitbudget. Mit einem Zeitbudget haengt die
     Zahl der Simulationen an der Maschinenlast — derselbe Seed verbraucht
     dann unterschiedlich viele Zufallszahlen und die Partien laufen
     auseinander. Gemessen: zwei Laeufe von ab-harness.js mit --seed 2026 und
     identischer Konfiguration endeten 2:0 und 1:1. Die Hilfe des Harness
     behauptete dabei "identischer Seed erzeugt identische Zuege".

     Mit mctsFixedSims > 0 faellt jede Zeitabhaengigkeit aus der Suche: beide
     Deadlines gehen auf Infinity, die Schleife zaehlt Simulationen. Damit
     wird ein A/A-Lauf Zug fuer Zug reproduzierbar, und ein A/B-Lauf misst
     den Parameter statt der Maschinenlast.

     Bei 0 unveraendert: dieselbe deadline, dasselbe Limit 20000. */
  const festeSims = PARAMS.mctsFixedSims | 0;
  const timeBudget = getAdaptiveTimeBudget(rootScored.length);
  const deadline = festeSims > 0 ? Infinity : _simStart + timeBudget;
  /* Sicherheitsbremse: getLegalMoves/floodFill werden auf dichten Spätspiel-
     Brettern mit großen zusammenhängenden Gruppen erheblich teurer (beobachtet:
     86% weniger Sims über 156 Züge in einer echten Partie, da jeder Kandidat
     eine eigene floodFill über potenziell riesige Gruppen auslöst). Die äußere
     while-Schleife prüft die Deadline nur ZWISCHEN Simulationen — eine einzelne
     Simulation konnte dadurch die Zeit weit überschreiten, bevor die Prüfung
     überhaupt griff. hardDeadline begrenzt eine einzelne Simulation hart,
     unabhängig davon wie teuer floodFill auf dem aktuellen Brett gerade ist. */
  const hardDeadline = festeSims > 0 ? Infinity : deadline + timeBudget;
  const scale = PARAMS.mctsValueScale, c = PARAMS.puctC;
  const rave = PARAMS.raveEnabled >= 1, raveK = PARAMS.raveK;

  let root = null;
  if (PARAMS.mctsTreeReuse >= 1 && _mctsSavedRoot && _mctsSavedRoot.aiColor === aiColor) {
    root = _tryReuseSubtree(_mctsSavedRoot.board, aiColor, _mctsSavedRoot.node, board);
    /* Wiederverwendete Wurzeln VALIDIEREN — zwei bewiesene Fallen aus der
       347-Züge-Partie vom 16.7.:
       1. Spielt der Mensch einen Zug, dessen Knoten nie expandiert wurde
          (kids === null — bei wenigen Sims pro Zug häufig), crashte das
          root.kids.length unten mit TypeError. Der Crash tötete erst den
          Worker (workerError) und später denselben Code im Hauptthread-
          Fallback — aiThinking blieb für immer true, die KI hing.
       2. Die Kinder wiederverwendeter Wurzeln wurden im VORHERIGEN Zug
          ohne den aktuellen Ko-/Superko-Kontext expandiert. rootScored
          ist gefiltert, der Reuse-Baum nicht: Zug 270 verbrannte das
          komplette Suchbudget auf den Ko-verbotenen Rückschlag G8 und
          spielte dann einen Notzug (A19). Deshalb: Kinder gegen die
          aktuelle legale Zugliste filtern, Besuche entfernter Kinder aus
          root.N herausrechnen. */
    if (root && (!root.kids || !root.kids.length)) root = null;
    if (root) {
      const legalSet = new Set(rootScored.map(s => s.m.idx));
      const kept = root.kids.filter(k => legalSet.has(k.idx));
      if (kept.length !== root.kids.length) {
        for (const k of root.kids) if (!legalSet.has(k.idx)) root.N -= k.N;
        root.kids = kept;
        if (!kept.length) root = null;
      }
    }
  }
  _wurzelSuchen++;
  if (root) {
    _wurzelWieder++;
    if (PARAMS.wurzelFrisch >= 1) root = _frischeWurzel(root, rootScored);
  }
  if (!root) root = {N: 0, W: 0, kids: _mctsKids(rootScored, PARAMS.mctsRootChildren)};
  if (!root.kids.length) return null;

  let sims = 0;
  const simLimit = festeSims > 0 ? festeSims : 20000;
  while (Date.now() < deadline && sims < simLimit) {
    sims++;
    _mctsScratch.set(board);
    const cap = {1: captures[1]||0, 2: captures[2]||0};
    let node = root, color = aiColor, v = null;
    /* Ko-Punkt der Stellung im Baum. An der Wurzel gilt der echte; danach
       setzt ihn jeder Baumzug neu (koNachZug). Ohne ihn erlaubte die
       Expansion direkte Ko-Rückschläge, und der Rollout am Blatt bekam den
       Ko-Punkt der Wurzel statt den der Blattstellung. */
    let ko = koPoint;
    const path = [];   /* {parentNode, color, kid} je Tiefe — für Standard- und AMAF-Backup */
    for (let depth = 0; depth < PARAMS.mctsMaxDepth; depth++) {
      if (Date.now() > hardDeadline) break;   /* Sicherheitsbremse: teure Expansion abbrechen */
      if (node !== root && node.kids === null) {
        let legal = getLegalMoves(_mctsScratch, color, _emptyHashes, ko, hardDeadline);
        if (PARAMS.augenSchutz >= 2) legal = legal.filter(m => !fuelltEigenesAuge(_mctsScratch, m.idx, color));
        /* Deadline währenddessen gerissen → Liste evtl. abgeschnitten.
           NICHT cachen: kids=[] würde den Knoten dauerhaft als terminal
           markieren (Tree-Reuse trägt ihn in den nächsten Zug!). kids
           bleibt null, der Knoten wird beim nächsten Besuch neu expandiert. */
        if (Date.now() > hardDeadline) break;
        const list = legal.map(m => ({m, score: quickEval(_mctsScratch, m.idx, color)}));
        list.sort((a,b) => b.score - a.score);
        node.kids = _mctsKids(list, PARAMS.mctsChildren);
      }
      if (!node.kids || !node.kids.length) break;   /* terminal */
      const sq = Math.sqrt(Math.max(1, node.N));
      /* FPU aus Sicht des Ziehenden (nicht der KI). A/B 76 gepaarte Stellungen,
         scharfer + flacher Prior: ΔQ ±0,005, Baumform 4,11→7,89 Kinder/Knoten.
         Semantikfix, kein Stärkeeffekt — Explorationsterm überdeckt ±0,45 ab
         ~40 Elternbesuchen. Nicht erneut A/B-testen. */
      const persp = color === aiColor ? 1 : -1;
      let best = null, bs = -Infinity;
      for (const k of node.kids) {
        /* Fix #5: First-Play-Urgency. Unbesuchte Knoten bekamen bisher
           q=0 (neutral) — nach der ersten Simulation mit negativem Wert
           wurden Geschwister nie exploriert. FPU gibt ihnen einen
           optimistischen Startwert und erzwingt so breitere Exploration.
           W und amafW liegen immer aus KI-Sicht vor, werden also gespiegelt;
           die FPU-Konstante NICHT — sie ist bereits die Sicht des Ziehenden. */
        const q = k.N ? (k.W / k.N) * persp : PARAMS.mctsFPU;
        let blended = q;
        if (rave && k.amafN) {
          const beta = Math.sqrt(raveK / (3 * node.N + raveK));
          blended = (1 - beta) * q + beta * (k.amafW / k.amafN) * persp;
        }
        const s = blended + c * k.P * sq / (1 + k.N);
        /* NaN > -Infinity ist false: war EIN Score nicht-finit, blieb best
           schlicht auf null stehen — waren es alle (ein NaN-Prior vergiftet
           über die Softmax den ganzen Knoten), knallte eine Zeile später
           best.idx. Der Crash tötete erst den Worker und danach denselben
           Code im synchronen Fallback, also jeden KI-Zug. Nicht-finite
           Scores werden jetzt übersprungen statt verglichen. */
        if (Number.isFinite(s) && s > bs) { bs = s; best = k; }
      }
      if (!best) {
        /* Kein einziger vergleichbarer Score. Suche geht mit dem ersten
           Kind weiter, das wenigstens einen brauchbaren Prior hat — die
           Ursache meldet der Zähler unten, statt sie zu verschlucken. */
        for (const k of node.kids) if (Number.isFinite(k.P)) { best = k; break; }
        if (!best) best = node.kids[0];
        _mctsNonFinite++;
      }
      const opp = color === 1 ? 2 : 1;
      _mctsScratch[best.idx] = color;
      const geschlagen = removeDeadGroups(_mctsScratch, opp, best.idx);
      cap[color] += geschlagen;
      ko = koNachZug(_mctsScratch, best.idx, geschlagen);
      path.push({parentNode: node, color, kid: best});
      const firstVisit = best.N === 0;
      color = opp; node = best;
      if (firstVisit) {   /* Blatt: kurzer Rollout als Wert-Schätzung */
        v = Math.tanh(rollout(_mctsScratch, color, null, cap, PARAMS.mctsRolloutDepth, aiColor, ko, hardDeadline) / scale);
        break;
      }
    }
    if (v === null) v = Math.tanh(evaluateBoard(_mctsScratch, aiColor, cap) / scale);
    root.N++;
    for (const step of path) { step.kid.N++; step.kid.W += v; }

    /* AMAF/RAVE-Backup: für jeden Entscheidungspunkt entlang des Pfads
       bekommen ALLE Kinder (nicht nur das gewählte) einen Bonus, wenn ihr
       Zugindex später im selben Pfad von derselben Farbe gespielt wurde. */
    if (rave && path.length) {
      const movesByColor = {1: null, 2: null};
      for (const step of path) {
        if (!movesByColor[step.color]) movesByColor[step.color] = new Set();
        movesByColor[step.color].add(step.kid.idx);
      }
      for (const step of path) {
        const kids = step.parentNode.kids;
        if (!kids) continue;
        const mv = movesByColor[step.color];
        for (const kid of kids) {
          if (mv.has(kid.idx)) {
            if (kid.amafN === undefined) { kid.amafN = 0; kid.amafW = 0; }
            kid.amafN++; kid.amafW += v;
          }
        }
      }
    }
  }
  let bm = root.kids[0], bn = -1;
  for (const k of root.kids) if (k.N > bn) { bn = k.N; bm = k; }

  /* Feedback für den nächsten Zug: tatsächliche ms/Sim messen, unabhängig
     davon was die Kosten verursacht hat (Randkampf, große Gruppen, egal). */
  if (sims > 0) _lastMsPerSim = (Date.now() - _simStart) / sims;

  /* Teilbaum unter unserem gewählten Zug für den nächsten Aufruf sichern */
  if (PARAMS.mctsTreeReuse >= 1) {
    const opp = aiColor === 1 ? 2 : 1;
    const postBoard = new Uint8Array(board);
    postBoard[bm.idx] = aiColor;
    removeDeadGroups(postBoard, opp, bm.idx);
    _mctsSavedRoot = {node: bm, board: postBoard, aiColor};
  }

  if (_mctsNonFinite)
    console.warn(`[MCTS] ${_mctsNonFinite} von ${sims} Auswahlschritten hatten keinen `
      + `finiten PUCT-Score (Fallback: erstes Kind). Ursache liegt vor der Suche — `
      + `Prior oder Rollout-Wert ist NaN/Infinity.`);

  return {m: {x: bm.x, y: bm.y, idx: bm.idx}, sims,
          share: root.N ? Math.round(bm.N / root.N * 100) : 0,
          q: bm.N ? bm.W / bm.N : 0};
}

/* Sagt die Gebietsschätzung dasselbe wie Q — nämlich verloren?

   Bewusst als eigene Funktion, nicht inline: so ist das Kriterium einzeln
   testbar, ohne eine ganze Suche fahren zu müssen. */
/* Waechter fuer die resignAreaMargin-Dosisreihe: wie oft hat Q die Schwelle
   gerissen, und wie oft hat AUSGERECHNET das Gebietskriterium die Aufgabe
   dann blockiert? Ohne diese zweite Zahl ist eine Dosisreihe wertlos -- sie
   misst sonst einen Arm, der vielleicht nie greift. Reine Zaehler, kein
   Einfluss aufs Spiel. */
let _aufgabeQRufe = 0, _aufgabeGebietBlock = 0, _aufgabeMaxLuecke = 0;

function leseAufgabeWaechter(reset) {
  const v = {qRufe: _aufgabeQRufe, block: _aufgabeGebietBlock,
             maxLuecke: _aufgabeMaxLuecke};
  if (reset) { _aufgabeQRufe = 0; _aufgabeGebietBlock = 0; _aufgabeMaxLuecke = 0; }
  return v;
}

/* Flaeche fuer die Aufgabe-Meldung -- NUR Anzeige, entscheidet nichts.
   Die Meldung zeigte frueher estimateArea [roh]. Das zaehlt tote, aber noch
   stehende Ketten als lebendig, und die Meldung sah dann aus wie eine
   Aufgabe aus der Fuehrung. Gemeldet am 03.10. aus einer echten Partie:
   "Gebiet 132:123" fuer Weiss, obwohl 46 weisse Steine Benson-tot waren;
   ohne sie stand es 86:184, Schwarz rund 90 Punkte vorn (die Aufgabe war
   richtig). Hier werden die BEWIESEN toten Ketten entfernt und dann wie in
   finalAreaScore gezaehlt: Steine plus Regionen mit nur einer Randfarbe.
   Komi geht nicht ein, die Engine ist komi-blind. */
function aufgabeGebiet(board, aiColor) {
  const b = new Uint8Array(board);
  const opp = aiColor === 1 ? 2 : 1;
  const ep = bensonClassify(b);
  const tot = {1: 0, 2: 0};
  for (let i = 0; i < BOARD_SIZE; i++)
    if (b[i] && _bnDead[i] === ep) { tot[b[i]]++; b[i] = 0; }
  const flaeche = {1: 0, 2: 0}, gesehen = new Uint8Array(BOARD_SIZE);
  for (let i = 0; i < BOARD_SIZE; i++) if (b[i]) flaeche[b[i]]++;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (b[i] || gesehen[i]) continue;
    const q = [i]; gesehen[i] = 1;
    let kopf = 0, rand = 0;
    while (kopf < q.length) {
      const c = q[kopf++];
      for (const n of NEIGHBORS[c]) {
        if (!b[n]) { if (!gesehen[n]) { gesehen[n] = 1; q.push(n); } }
        else rand |= b[n];
      }
    }
    if (rand === 1 || rand === 2) flaeche[rand] += q.length;
  }
  return {eigen: flaeche[aiColor], fremd: flaeche[opp],
          totEigen: tot[aiColor], totFremd: tot[opp]};
}

function gebietSagtVerloren(board, aiColor) {
  /* Massstab: [roh] -- estimateArea, ohne Totsteinbereinigung. Das ist hier
     eine bewusste Wahl (pro Zug bezahlbar), aber es bedeutet, dass das
     Kriterium die Seite mit den todgeweihten Gruppen systematisch zu gut
     sieht. Der Anlass, aus dem dieser Parameter entstand, war genau dieser
     Fehler -- siehe den Kasten an resignAreaMargin. */
  const marge = PARAMS.resignAreaMargin;
  /* VOR dem Kurzschluss zaehlen: sonst meldet ausgerechnet der
     abgeschaltete Arm 0 Rufe und saehe wie "nicht verdrahtet" aus. */
  _aufgabeQRufe++;
  if (marge < 0) return true;              /* Kriterium abgeschaltet */
  const opp = aiColor === 1 ? 2 : 1;
  /* Gefangene gehen NICHT ein: der Default-Zählmodus ist Area (chinesisch),
     dort zählen Steine auf dem Brett plus umschlossenes Gebiet. */
  const eigen = estimateArea(board, aiColor), fremd = estimateArea(board, opp);
  const verloren = eigen < fremd - marge;
  /* Aufgerufen wird nur, wenn Q die Schwelle schon gerissen hat -- die
     Reihenfolge im && ist Absicht. Jeder Ruf ist also ein Q-Ruf. */
  if (!verloren) {
    _aufgabeGebietBlock++;
    const luecke = fremd - eigen;          /* > 0 heisst: KI liegt zurueck */
    if (luecke > _aufgabeMaxLuecke) _aufgabeMaxLuecke = luecke;
  }
  return verloren;
}

/* ═══ Taktischer Leser: kann eine Kette gefangen werden? ═══════════════
   Kleine Tiefensuche Angriff gegen Verteidigung fuer Ketten mit hoechstens
   drei Freiheiten (Atari, Leiter, einfaches Netz). Ab vier Freiheiten gilt
   eine Kette als nicht fangbar. Ko wird nicht beachtet. Siehe
   docs/laufkampf-lesen.md.

   leseAngriff(board, a)     Angreifer am Zug: faengt er die Kette auf a?
   leseVerteidigung(board, a) Verteidiger am Zug: kann er sie retten?
   Ein Zug m des Verteidigers rettet, wenn danach leseAngriff nein sagt.
   Beide liefern {ja, offen}: offen = Budget erschoepft, Antwort ungesichert
   (dann ja = false bei Angriff, ja = true bei Verteidigung, also
   vorsichtig). Budget = Zahl der Knoten, Tiefe in Halbzuegen. */
const LESE_TIEFE = 40, LESE_BUDGET = 4000;

function _leseZug(b, i, f) {
  if (b[i]) return null;
  const nb = new Uint8Array(b);
  nb[i] = f;
  removeDeadGroups(nb, 3 - f, i);
  if (countLiberties(nb, i, 1) === 0) return null;   /* Selbstmord */
  return nb;
}

/* Angriffskandidaten: die Freiheiten; bei zwei Freiheiten zusaetzlich die
   leeren Nachbarn der Freiheiten (Netz). */
function _angriffsZuege(b, L) {
  const z = new Set(L);
  if (L.length === 2) for (const l of L) for (const n of NEIGHBORS[l]) if (!b[n]) z.add(n);
  return [...z];
}

/* Verteidigungskandidaten: die Freiheiten und die Freiheiten angrenzender
   gegnerischer Ketten mit hoechstens zwei Freiheiten (schlagen, Atari). */
function _verteidigungsZuege(b, group, L) {
  const f = b[group[0]], opp = 3 - f, z = new Set(L), ges = new Set();
  for (const g of group) for (const n of NEIGHBORS[g]) {
    if (b[n] !== opp || ges.has(n)) continue;
    const k = floodFill(b, n);
    for (const x of k.group) ges.add(x);
    if (k.liberties.length <= 2) for (const l of k.liberties) z.add(l);
  }
  return [...z];
}

/* ebene = Halbzuege seit der Wurzel. Drei Freiheiten werden nur an der
   Wurzel angegriffen; danach gilt eine Kette mit drei Freiheiten als
   entkommen (Leiter-Annahme). Netzzuege nur in den ersten beiden Ebenen. */
function _angriff(b, a, ebene, z) {
  if (++z.n > z.budget) { z.offen = true; return false; }
  const f = b[a];
  if (!f) return true;
  const {liberties: L} = floodFill(b, a);
  if (L.length === 1) return true;
  if (L.length > (ebene === 0 ? 3 : 2)) return false;
  if (ebene >= z.tiefe) { z.offen = true; return false; }
  const kand = ebene <= 2 ? _angriffsZuege(b, L) : L;
  for (const m of kand) {
    const nb = _leseZug(b, m, 3 - f);
    if (!nb) continue;
    if (!nb[a] || !_verteidigung(nb, a, ebene + 1, z)) return true;
  }
  return false;
}

function _verteidigung(b, a, ebene, z) {
  if (++z.n > z.budget) { z.offen = true; return true; }
  const f = b[a];
  if (!f) return false;
  const {group, liberties: L} = floodFill(b, a);
  if (ebene > 0 && L.length >= 3) return true;
  if (ebene >= z.tiefe) { z.offen = true; return true; }
  /* Schon sicher, wenn der Angreifer am Zug sie nicht faengt. */
  if (ebene === 0 && !_angriff(b, a, 0, z)) return true;
  for (const m of _verteidigungsZuege(b, group, L)) {
    const nb = _leseZug(b, m, f);
    if (!nb || !nb[a]) continue;
    if (!_angriff(nb, a, ebene + 1, z)) return true;
  }
  return false;
}

function leseAngriff(board, a, budget = LESE_BUDGET, tiefe = LESE_TIEFE) {
  const z = {n: 0, budget, tiefe, offen: false};
  const ja = _angriff(board, a, 0, z);
  return {ja, offen: z.offen, knoten: z.n};
}

/* Verteidiger am Zug. Mit zug: rettet genau dieser Zug die Kette? */
function leseVerteidigung(board, a, budget = LESE_BUDGET, tiefe = LESE_TIEFE) {
  const z = {n: 0, budget, tiefe, offen: false};
  const ja = _verteidigung(board, a, 0, z);
  return {ja, offen: z.offen, knoten: z.n};
}

/* Waere ein Zug von color auf i vergeblich? Er schlaegt nichts, gibt kein
   Atari, und der Leser faengt die Kette des neuen Steins mit dem Gegner am
   Zug. Siehe PARAMS.leseVerzicht. Mit PARAMS.atariVerzicht auch ein Atari,
   wenn jedes Ziel entkommt. */
const _vzScratch = new Uint8Array(BOARD_SIZE);
function vergeblicherZug(board, i, color) {
  const opp = color === 1 ? 2 : 1, nb = _vzScratch;
  nb.set(board); nb[i] = color;
  if (removeDeadGroups(nb, opp, i) > 0) return false;
  const ziele = [];
  for (const n of NEIGHBORS[i]) if (nb[n] === opp && countLiberties(nb, n, 2) === 1) {
    if (PARAMS.atariVerzicht <= 0) return false;
    ziele.push(n);
  }
  if (countLiberties(nb, i, 4) > 3) return false;
  const kopie = new Uint8Array(nb);
  if (!leseAngriff(kopie, i).ja) return false;
  for (const n of ziele) if (!leseVerteidigung(kopie, n).ja) return false;
  return true;
}

/* Fuellt ein Zug von color auf i ein eigenes echtes Auge? Alle
   orthogonalen Nachbarn eigene Steine, Diagonalen nach _diagIsTrueEye, und
   keine angrenzende eigene Kette im Atari (dann ist der Punkt kein Auge,
   sondern die letzte Freiheit, und das Fuellen verbindet). Siehe
   PARAMS.augenSchutz. */
function fuelltEigenesAuge(board, i, color) {
  for (const n of NEIGHBORS[i]) if (board[n] !== color) return false;
  if (!_diagIsTrueEye(board, i, color)) return false;
  for (const n of NEIGHBORS[i]) if (countLiberties(board, n, 2) < 2) return false;
  return true;
}

/* Bleibt der beste Gegnerzug gross, egal was wir spielen? Geprueft werden
   unsere besten passUnabwendbarK Kandidaten und die Punkte der drei besten
   Gegnerzuege (selbst dort zu spielen ist die naheliegende Abwehr). Nach
   jedem Kandidaten werden die drei Gegnerzuege neu bewertet. Bringt einer
   der Kandidaten alle drei unter die Schwelle, ist der Gegnerzug abwendbar.
   Die Caches (Krisenkarte, Flaeche, Bouzy) werden je Brett neu gefuellt;
   der Aufrufer stellt sie danach fuer das Ausgangsbrett wieder her. */

function gegnerzugUnabwendbar(board, aiColor, scored, oppTop, mc, schwelle, leer) {
  const opp = aiColor === 1 ? 2 : 1;
  const legalUns = new Set(scored.map(s => s.m.idx));
  const kand = scored.slice(0, PASS_UNABWENDBAR_K).map(s => s.m.idx);
  for (const o of oppTop) if (legalUns.has(o.idx) && !kand.includes(o.idx)) kand.push(o.idx);
  for (const c of kand) {
    _puBrett.set(board);
    _puBrett[c] = aiColor;
    removeDeadGroups(_puBrett, opp, c);
    buildCrisisMap(_puBrett, opp);
    primeAreaCache(_puBrett, opp);
    if (PARAMS.endTieBreak > 0 || PARAMS.gebietZug > 0) primeEndTieBreak(_puBrett);
    let groesster = -Infinity;
    for (const o of oppTop) {
      if (_puBrett[o.idx]) continue;
      /* Selbstmord fuer den Gegner? Dann ist der Zug nach c weg. */
      _puProbe.set(_puBrett); _puProbe[o.idx] = opp;
      if (removeDeadGroups(_puProbe, aiColor, o.idx) === 0 && countLiberties(_puProbe, o.idx, 1) === 0) continue;
      const sc = evaluateMove(_puBrett, o.idx, opp, mc, leer);
      if (sc > groesster) groesster = sc;
    }

    if (groesster <= schwelle) return false;

}

function _enLade() {
  if (_enNetz || !ENDSPIEL_NETZ) return _enNetz;
  const roh = typeof atob === 'function' ? atob(ENDSPIEL_NETZ.daten)
    : Buffer.from(ENDSPIEL_NETZ.daten, 'base64').toString('binary');
  const bytes = new Uint8Array(roh.length);
  for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);

/* Eingabeebenen wie auswertung/lerner-merkmale.js (28 × 361, 0/1) */
function _enEbenen(b, c, letzt, vorletzt, ko, k, aus) {
  const N = BOARD_SIZE, o = 3 - c, setze = (e, i) => { aus[e * N + i] = 1; };
  aus.fill(0);
  const id = new Int32Array(N).fill(-1), farbe = [], groesse = [], frei = [], merk = new Int32Array(N).fill(-1);
  for (let i = 0; i < N; i++) {
    if (!b[i] || id[i] >= 0) continue;
    const kk = farbe.length, q = [i], fr = [];
    id[i] = kk;
    for (let j = 0; j < q.length; j++) for (const n of NEIGHBORS[q[j]]) {

      else if (b[n] === b[i] && id[n] < 0) { id[n] = kk; q.push(n); }
    }
    farbe.push(b[i]); groesse.push(q.length); frei.push(fr);
  }
  for (let i = 0; i < N; i++) {
    setze(26, i);
    if (k >= 160) setze(27, i);
    if (!b[i]) { setze(2, i); continue; }
    const eigen = b[i] === c, f = Math.min(frei[id[i]].length, 4);
    setze(eigen ? 0 : 1, i);
    setze((eigen ? 2 : 6) + f, i);
  }

      if (gesehen[kk] === i) continue;
      gesehen[kk] = i;

      else for (const p of fr) if (p !== i) freiSet.add(p);

    setze(14, i);

    if (geschlagen >= 3) setze(16, i);

/* Faltung mit Null-Auffüllung wie auswertung/lerner-netz.js */
function _enFalte(ein, cin, s, cout) {
  const G = 19, N = 361, k = s.k, r = k >> 1, aus = new Float64Array(cout * N);
  for (let o = 0; o < cout; o++) {

      const ec = c * N, wb = (o * cin + c) * k * k;
      for (let dy = 0; dy < k; dy++) for (let dx = 0; dx < k; dx++) {
        const w = s.w[wb + dy * k + dx];

        for (let y = y0; y < y1; y++) {
