globalThis.PARAMS_DEFAULT = Object.freeze({...PARAMS});

/* Modul-Zustand: letzte gemessene ms/Sim, lebt im Worker zwischen Zügen
   (Worker-Pool macht's möglich) — dieselbe Technik wie _mctsSavedRoot.
   ACHTUNG Desync-Falle: worker-ai läuft als eigenständiges Script sowohl
   im Hauptthread als auch im Worker — zwei getrennte JS-Umgebungen mit
   eigenen Kopien dieser Variable. Der Worker misst, aber der Hauptthread-
   Watchdog (triggerAIMove) rechnete für immer mit null. Deshalb meldet
   der Worker seinen Messwert bei jeder Antwort zurück (lastMsPerSim im
   postMessage), und attachWorkerHandlers übernimmt ihn in die
   Hauptthread-Kopie — beide Seiten rechnen mit denselben Daten. */
let _lastMsPerSim = null;
let _lastMoveIdx  = -1;   /* letzter gegnerischer Zug, für Lokalitätsterm */
let _hopelessStreak = 0;  /* aufeinanderfolgende KI-Züge mit Q ≤ -resignQ (für Aufgabe) */
let _allDeadStreak  = 0;  /* aufeinanderfolgende Züge, in denen JEDER legale Zug todgeboren wäre */

/* Stufenlose Zeitbudget-Skalierung nach freien Feldern ALS BASIS, plus
   Feedback-Korrektur aus der tatsächlich gemessenen letzten Simulation.
   Läuft in worker-ai, also sowohl im Worker als auch im Hauptthread
   aufrufbar (triggerAIMove nutzt dieselbe Funktion für den Watchdog —
   Fix C aus Tins Review). */
function getAdaptiveTimeBudget(emptyCount) {
  if (PARAMS.adaptiveBudgetEnabled < 1) return PARAMS.aiTimeBudget;
  const ref = PARAMS.adaptiveBudgetRefEmpty;
  let budget = PARAMS.aiTimeBudget;
  let _faktor = 1;
  if (emptyCount < ref) {
    const t = 1 - Math.max(0, emptyCount) / ref;              // 0 bei ref, →1 bei leer
    const factor = 1 + t * (PARAMS.adaptiveBudgetMaxFactor - 1);
    budget = PARAMS.aiTimeBudget * factor;
    _faktor = factor;
  }
  /* Diagnose: Skalierungsfaktor und sein Argument festhalten. Ein A/B über
     maxFactor ist ohne diese Zahl nicht deutbar — bliebe der Faktor konstant
     1, wäre Arm B in Wahrheit identisch zu Arm A und ein Nullergebnis hätte
     nichts mit dem Hebel zu tun. Das Argument wird mitgeführt, weil es NICHT
     die Zahl der freien Felder ist: mctsPUCT übergibt rootScored.length, also
     die Kandidatenzahl. Verändert keinen Rückgabewert. */
  _letzterFaktor = _faktor;
  _letztesArgument = emptyCount;
  /* Feedback: falls die letzte Simulation langsamer war als die freie-
     Felder-Schätzung erwarten ließ, direkt nachkorrigieren — das greift
     unabhängig davon, WAS die Verlangsamung verursacht (Randkampf,
     große Gruppen, Ko-Ketten, egal). */
  if (_lastMsPerSim !== null) {
    const neededForTarget = _lastMsPerSim * PARAMS.adaptiveBudgetTargetMinSims;
    const cap = PARAMS.aiTimeBudget * PARAMS.adaptiveBudgetMaxFactor;
    const erhoeht = Math.max(budget, Math.min(neededForTarget, cap));
    /* Zähler, rein diagnostisch: hat der Min-Sims-Boden das Budget wirklich
       angehoben? Ein A/B über die ZEITVERTEILUNG ist ohne diese Zahl nicht
       deutbar — ein Nullergebnis könnte heißen "hilft nicht" oder "hat nie
       gegriffen". Muss HIER stehen und nicht im Harness: der Aufrufer kennt
       das Argument nicht, mit dem die Funktion tatsächlich gerufen wird
       (mctsPUCT übergibt die Kandidatenzahl, nicht die freien Felder).
       Verändert keinen Rückgabewert. */
    if (erhoeht > budget) _bodenGriff++;
    budget = erhoeht;
  }
  return Math.round(budget);
}

/* Diagnosezähler zu getAdaptiveTimeBudget. Nur lesen und zurücksetzen. */
let _bodenGriff = 0;
function leseBodenGriff(reset) { const v = _bodenGriff; if (reset) _bodenGriff = 0; return v; }
let _letzterFaktor = null, _letztesArgument = -1;
/* Verbrauchend lesen. Sonst liefert ein Zug, der die Funktion gar nicht ruft
   (Pass, Aufgabe, Pfade ohne MCTS), den Wert der VORIGEN Farbe zurueck — im
   A/B wandert damit der Faktor des einen Arms in die Statistik des anderen.
   Gemessen: Arm A meldete max 2.11 bei maxFactor 1.0, wo nur exakt 1 moeglich
   ist. Null heisst "dieser Zug hat nicht skaliert" und wird nicht gezaehlt. */
function leseFaktor() {
  const v = {faktor: _letzterFaktor, arg: _letztesArgument};
  _letzterFaktor = null; _letztesArgument = -1;
  return v;
}

/* ── Globale Scratchpads (einmalig alloziert, nie GC'd) ──── */
const _legalScratch   = new Uint8Array(BOARD_SIZE);
const _evalScratch    = new Uint8Array(BOARD_SIZE);
const _quickScratch   = new Uint8Array(BOARD_SIZE);
const _rolloutScratch = new Uint8Array(BOARD_SIZE);
const _simScratch     = new Uint8Array(BOARD_SIZE);
const _tsumegoScratch = new Uint8Array(BOARD_SIZE);

function removeDeadGroupsUndoable(board, color, nearIdx) {
  const epoch = _nextFfEpoch();
  let captured = 0;
  const undo = [];
  if (nearIdx !== undefined) {
    /* Heißer Pfad (jede Legalitätsprüfung in getLegalMoves/sampleLegalMoves):
       lebende Gruppen kosten nur den Early-Exit-Scan, s. removeDeadGroups.
       Tote Gruppen werden per BFS entfernt — das undo-Array dient dabei
       gleich als Queue, weil die Einträge in BFS-Reihenfolge anfallen und
       board[g]=0 als Besucht-Marker wirkt. */
    for (const nb of NEIGHBORS[nearIdx]) {
      if (board[nb] !== color || _rdgChecked[nb] === epoch) continue;
      _rdgChecked[nb] = epoch;
      if (countLiberties(board, nb, 1) > 0) continue;
      let head = undo.length;
      undo.push({idx: nb, oldColor: color}); board[nb] = 0; captured++;
      while (head < undo.length) {
        const g = undo[head++].idx;
        for (const n of NEIGHBORS[g])
          if (board[n] === color) { undo.push({idx: n, oldColor: color}); board[n] = 0; captured++; }
      }
    }
  } else {
    for (let i = 0; i < BOARD_SIZE; i++) {
      if (board[i] !== color || _rdgChecked[i] === epoch) continue;
      const {group, liberties} = floodFill(board, i);
      for (const g of group) _rdgChecked[g] = epoch;
      if (liberties.length === 0)
        for (const g of group) { undo.push({idx:g, oldColor:board[g]}); board[g] = 0; captured++; }
    }
  }
  return {captured, undo};
}

function applyUndo(board, undo) {
  for (let i = undo.length - 1; i >= 0; i--) board[undo[i].idx] = undo[i].oldColor;
}

function getLegalMoves(board, color, historyHashes, koPoint, hardDeadline) {
  const opp = color === 1 ? 2 : 1;
  const moves = [];
  /* PERF: Rollouts übergeben ein leeres Hash-Set — dann den teuren
     Zobrist-Scan (361 Zellen pro Kandidat!) komplett überspringen.
     Verhalten identisch, aber die Hard-KI spart Millionen Operationen. */
  const checkSuperko = historyHashes && historyHashes.size > 0;
  const hasKo = koPoint !== null && koPoint !== undefined;
  _legalScratch.set(board);
  /* hardDeadline: Sicherheitsbremse IN der Kandidatenschleife. Bisher wurde
     die Deadline nur zwischen Plies/Simulationen geprüft — ein einzelner
     Scan über 300+ Kandidaten mit floodFill über riesige Gruppen konnte
     diese Lücke komplett überspringen. Alle 16 Kandidaten prüfen; eine
     abgeschnittene Liste ist für Rollouts/Expansion okay (heuristisch),
     Root-Aufrufe übergeben KEINE Deadline und bleiben vollständig. */
  let _checked = 0;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] !== 0) continue;
    if (hasKo && i === koPoint) continue;   /* Fix 7: 1-Ply-Ko, billig */
    if (hardDeadline !== undefined && (++_checked & 15) === 0 && Date.now() > hardDeadline) break;
    _legalScratch[i] = color;
    const {captured, undo} = removeDeadGroupsUndoable(_legalScratch, opp, i);
    let legal = true;
    if (captured === 0 && countLiberties(_legalScratch, i, 1) === 0) legal = false;
    if (legal && (!checkSuperko || !historyHashes.has(computeZobrist(_legalScratch))))
      moves.push({x: xOf(i), y: yOf(i), idx: i});
    applyUndo(_legalScratch, undo);
    _legalScratch[i] = 0;
  }
  return moves;
}

/* Linienabstufung für evalOpening, Index = dte (0-basiert, 0 = erste Linie).
   Erste und zweite Linie sind in der Eröffnung schlecht, dritte und vierte
   gut, fünfte neutral. Wirkt nur mit openLineWeight > 0. */
const OPEN_LINIE = [-1, -0.5, 1, 1, 0];

function evalOpening(board, i, color, mc) {
  let s = 0;
  const x = xOf(i), y = yOf(i);
  const dte = Math.min(x, y, SIZE-1-x, SIZE-1-y);
  if (dte <= 4) {
    s += PARAMS.openEdge3;
    /* dte ist 0-basiert: 0 = erste Linie. Siehe openLineWeight. */
    if (PARAMS.openLineWeight > 0) s += PARAMS.openLineWeight * OPEN_LINIE[dte];
  }
  else if (x <= 4 || x >= 14 || y <= 4 || y >= 14) s += PARAMS.openEdge5;
  else s += PARAMS.openCenter;
  if (HOSHI_IDX.has(i) && mc < 15) s += PARAMS.openHoshiBonus;
  const cornerDist = Math.min(x, SIZE-1-x);
  const sideDist = Math.min(y, SIZE-1-y);
  if (cornerDist >= 2 && cornerDist <= 4 && sideDist >= 2 && sideDist <= 4) s += PARAMS.openCornerBonus;
  const opp = color === 1 ? 2 : 1;
  _evalScratch.set(board);
  _evalScratch[i] = color;
  const cap = removeDeadGroups(_evalScratch, opp, i);
  if (cap === 0) {
    const lib = countLiberties(_evalScratch, i, 2);
    if (lib === 0) s -= 10000;
    else if (lib === 1) s -= 200;
  } else s += cap * PARAMS.openCapBonus;
  let ownNbr = 0;
  for (const n of NEIGHBORS[i]) if (board[n] === color) ownNbr++;
  s += ownNbr * PARAMS.openNeighborBonus;
  /* Kontaktantwort — siehe openContactResponse bei den PARAMS. Feuert nur,
     wenn der Kandidat an einen eigenen Stein grenzt, den der letzte Gegnerzug
     berührt hat. Einmal pro Zug, nicht je Nachbar. */
  if (PARAMS.openContactResponse > 0 && _lastMoveIdx >= 0 && board[_lastMoveIdx] === opp) {
    /* Nur wenn der letzte Gegnerzug ueberhaupt einen eigenen Stein beruehrt —
       sonst ist es kein Kontakt, sondern nur Naehe. */
    let kontakt = false;
    for (const n of NEIGHBORS[_lastMoveIdx]) if (board[n] === color) { kontakt = true; break; }
    if (kontakt) {
      /* Beide Seiten des Kontakts belohnen: Zuege neben dem gegnerischen
         Stein (Hane/Gegenkontakt) UND neben dem beruehrten eigenen Stein
         (Verstaerken). Die erste Fassung kannte nur die zweite Menge und hob
         damit genau die Zuege NICHT, deren niedriger Rang den Befund ausloeste. */
      let trifft = NEIGHBORS[i].indexOf(_lastMoveIdx) >= 0;
      if (!trifft) for (const n of NEIGHBORS[i]) {
        if (board[n] !== color) continue;
        if (NEIGHBORS[n].indexOf(_lastMoveIdx) >= 0) { trifft = true; break; }
      }
      if (trifft) s += PARAMS.openContactResponse;
    }
  }
  return s + Math.random() * 3;
}

/* Gewichtung der Gruppenfreiheiten für evalMidgame. Zwei Regler, beide
   standardmäßig aus, in dieser Reihenfolge angewandt: weiche Sättigung
   (midLibSoft, Kniestelle) und danach harter Deckel (midLibCap). Bei den
   Defaults 0 und 999 gibt die Funktion lib unverändert zurück — bitgenau,
   ohne Fließkomma-Umweg, weil der weiche Zweig gar nicht betreten wird.
   Siehe die Kommentare an beiden Parametern für die Messlage. */
/* Linienabschlag für evalMidgame, Index = dte (0-basiert, 0 = erste Linie).
   Erste Linie voll, zweite halb, ab der dritten neutral — dte reicht auf 19x19
   bis 9 (Brettmitte). Wirkt nur mit midLineWeight > 0; die Abfrage steht vor
   der Koordinatenrechnung, damit der Default nicht einmal xOf/yOf kostet.
   evalMidgame läuft pro Kandidat und Zug. */
const MID_LINIE = [-1, -0.5, 0, 0, 0, 0, 0, 0, 0, 0];

function libGewicht(lib) {
  const k = PARAMS.midLibSoft;
  let v = lib;
  if (k > 0 && lib > k) {
    const d = lib - k;
    v = k + d / (1 + d / k);
  }
  /* Math.min statt Ternär: bei einem nicht-finiten v gibt Math.min NaN
     zurück, ein Ternär stillschweigend den Deckel. In diesem Repo ist das
     kein akademischer Unterschied — die Herkunft dieses Branches ist ein
     NaN, das genau so unsichtbar durch eine Vergleichskette gerutscht ist. */
  return Math.min(v, PARAMS.midLibCap);
}

/* Faktor für die Selbst-Atari-Strafe. Bei ausgeschalteter Skalierung wird
   exakt 1 zurückgegeben und KEIN Gruppen-Walk ausgelöst — x * 1 ist für jede
   endliche Gleitkommazahl bitgleich x, der Default-Pfad ist also weder
   verhaltens- noch laufzeitseitig berührt.

   `groesse` wird übergeben, wo sie beim Aufrufer schon vorliegt (evalMidgame
   hat sie aus floodFill), sonst selbst gelaufen. Ein Aufrufer, der sie hat,
   soll sie nicht zweimal bezahlen — und die Zählung soll trotzdem an EINER
   Stelle sitzen, nicht in zwei Zweigen nebenher. */
let _atariRufe = 0, _atariGross = 0, _atariMaxGroesse = 0;
let _druckRufe = 0, _druckGross = 0, _druckMaxGroesse = 0;

function _atariGewicht(board, i, groesse) {
  const w = PARAMS.atariSizeWeight;
  if (w <= 0) return 1;
  const n = (groesse === undefined) ? countGroupSize(board, i) : groesse;
  _atariRufe++;
  if (n >= 6) _atariGross++;
  if (n > _atariMaxGroesse) _atariMaxGroesse = n;
  return 1 + w * (n - 1);
}

/* Wächter für den A/B-Harness: greift die Skalierung überhaupt, und an wie
   großen Gruppen? Ein Arm, in dem _atariRufe 0 bleibt, ist nicht verdrahtet;
   einer, in dem die größte Gruppe 1 ist, skaliert nichts. Verbrauchend zu
   lesen wäre hier falsch — anders als beim Faktor-Wächter ist das ein
   Summenzähler über viele Züge, kein Zustand eines einzelnen Zuges. */
function leseAtariWaechter(reset) {
  const v = {rufe: _atariRufe, gross: _atariGross, maxGroesse: _atariMaxGroesse};
  if (reset) { _atariRufe = 0; _atariGross = 0; _atariMaxGroesse = 0; }
  return v;
}

/* Derselbe Waechter fuer den Freiheitsdruck. Getrennt gefuehrt, weil die
   beiden Terme an verschiedenen Freiheitszahlen greifen und eine gemeinsame
   Zaehlung nicht sagen koennte, welcher von beiden gefeuert hat. */
function leseDruckWaechter(reset) {
  const v = {rufe: _druckRufe, gross: _druckGross, maxGroesse: _druckMaxGroesse};
  if (reset) { _druckRufe = 0; _druckGross = 0; _druckMaxGroesse = 0; }
  return v;
}

function evalMidgame(board, i, color, mc) {
  let s = 0;
  const opp = color === 1 ? 2 : 1;
  _evalScratch.set(board);
  _evalScratch[i] = color;
  const cap = removeDeadGroups(_evalScratch, opp, i);
  s += cap * PARAMS.midCapBonus;
  const own = floodFill(_evalScratch, i);
  const lib = own.liberties.length;
  s += libGewicht(lib) * PARAMS.midLibBonus;
  if (PARAMS.midLineWeight > 0) {
    const x = xOf(i), y = yOf(i);
    s += PARAMS.midLineWeight * MID_LINIE[Math.min(x, y, SIZE-1-x, SIZE-1-y)];
  }
  if (!lib) s -= 10000;
  /* Mittelspiel braucht keinen zweiten Walk: own.group liegt aus dem
     floodFill oben bereits vor und wird durchgereicht. */
  if (lib === 1 && !cap) s -= PARAMS.midAtariPenalty * _atariGewicht(null, 0, own.group.length);
  if (lib === 2 && !cap) s -= PARAMS.mid2LibPenalty;
  let on = 0;
  for (const n of NEIGHBORS[i]) {
    const c = board[n];
    if (c === color) {
      on++;
      const l = countLiberties(board, n, 3);
      if (l === 1) s += PARAMS.midRescueAtari;
      if (l === 2) s += PARAMS.midRescue2Lib;
    } else if (c === opp) {
      const l = countLiberties(board, n, 4);
      if (l === 1) s += PARAMS.midOppAtari;
      if (l === 2) s += PARAMS.midOpp2Lib;
      if (l === 3) s += PARAMS.midOpp3Lib;
    } else s += PARAMS.midEmptyNeighbor;
  }
  s += on * PARAMS.midOwnNeighborBonus; if (on >= 2) s += PARAMS.midOwnGroup2; if (on >= 3) s += PARAMS.midOwnGroup3;
  let ext = 0;
  for (const g of own.group) for (const n of NEIGHBORS[g]) if (_evalScratch[n] === 0) ext++;
  s += Math.min(ext, 12) * PARAMS.midExtBonus;
  for (const n of NEIGHBORS[i]) {
    if (board[n] !== 0) continue;
    let sec = true;
    for (const nn of NEIGHBORS[n]) if (_evalScratch[nn] && _evalScratch[nn] !== color) { sec = false; break; }
    if (sec) s += PARAMS.midSafeBonus;
  }
  for (const n of NEIGHBORS[i])
    if (_evalScratch[n] === opp && countLiberties(_evalScratch, n, 2) === 1) s += PARAMS.midOppAtariNear;
  return s + Math.random() * 4;
}

const _areaVisited = new Int32Array(BOARD_SIZE);
let   _areaEpoch   = 0;

/* Zweiter Epochen-Zähler mit demselben 32-Bit-Problem wie _ffEpoch
   (siehe Kommentar dort). _areaEpoch wird von estimateArea erhöht —
   im Endspiel-Experten pro Kandidatenzug ein Aufruf, kumuliert über
   Partien in derselben JS-Umgebung. Der _ffEpoch-Guard deckt diesen
   Zähler NICHT ab, da er ein eigenes Marker-Array (_areaVisited)
   benutzt. Ohne eigenen Guard bliebe die Regionsmarkierung nach dem
   Überlauf lautlos wirkungslos: jedes Feld gälte als unbesucht,
   estimateArea würde dieselbe Region mehrfach zählen und das
   Gebiets-Scoring im Endspiel systematisch verfälschen. */
function _nextAreaEpoch() {
  if (++_areaEpoch >= 0x7fffffff) {
    _areaEpoch = 1;
    _areaVisited.fill(0);
  }
  return _areaEpoch;
}

/* Perf-Refactor: Regionen werden nur noch GEZÄHLT (size), nicht mehr als
   Array gesammelt — die queue-/region-Allokationen pro Region entfallen.
   _groupQueue aus shared-go-logic ist hier frei (keine Verschachtelung
   mit countLiberties/_removeDeadGroup — estimateArea ruft nichts davon). */
function estimateArea(board, color) {
  const opp = color === 1 ? 2 : 1;
  let area = 0;
  const epoch = _nextAreaEpoch();
  for (let i = 0; i < BOARD_SIZE; i++) {
    const c = board[i];
    if (c === color) { area++; continue; }
    if (c === opp)   continue;
    if (_areaVisited[i] === epoch) continue;
    let head = 0, tail = 0, size = 0;
    _groupQueue[tail++] = i; _areaVisited[i] = epoch;
    let touchesOwn = false, touchesOpp = false;
    while (head < tail) {
      const cur = _groupQueue[head++]; size++;
      for (const n of NEIGHBORS[cur]) {
        const cc = board[n];
        if (cc === 0) {
          if (_areaVisited[n] !== epoch) { _areaVisited[n] = epoch; _groupQueue[tail++] = n; }
        } else if (cc === color) touchesOwn = true;
        else touchesOpp = true;
      }
    }
    if (touchesOwn && !touchesOpp) area += size;
  }
  return area;
}

let _areaCacheValid = false;
let _areaCacheOwn = 0, _areaCacheOpp = 0, _areaCacheColor = 0;

function primeAreaCache(board, color) {
  const opp = color === 1 ? 2 : 1;
  _areaCacheOwn = estimateArea(board, color);
  _areaCacheOpp = estimateArea(board, opp);
  _areaCacheColor = color;
  _areaCacheValid = true;
}

/* ── Einflusskarte (Bouzy) ───────────────────────────────────────────────
   Jeder Stein startet mit +-128 (Schwarz positiv, Weiss negativ, in ABSOLUTEN
   Farben, damit dieselbe Karte fuer beide Seiten taugt). INFLUENCE_DILATE
   Dilatationen lassen den Einfluss auf die Nachbarfelder ausstrahlen, danach
   nimmt INFLUENCE_ERODE Erosionen den schwachen Rand wieder weg. Was uebrig
   bleibt, ist die Zone, in der eine Farbe klar vorne liegt; 0 = umstritten
   oder neutral. Werte 5/21 sind die klassischen aus der Literatur fuer 19x19,
   fuer diese Engine NICHT abgestimmt.

   Kosten: (5 + 21) Durchlaeufe ueber 361 Felder mit je bis zu 4 Nachbarn, also
   grob 40 000 Schritte -- einmal pro Zug an der Wurzel vertretbar, pro
   Simulation nicht. Deshalb nur ueber primeInfluenceCache, nie aus
   evaluateBoard. Keine Allokation: zwei feste Puffer, die sich abwechseln. */
const INFLUENCE_DILATE = 5, INFLUENCE_ERODE = 21;
const _infA = new Int32Array(BOARD_SIZE), _infB = new Int32Array(BOARD_SIZE);
let _infMap = _infA, _infValid = false;

function primeInfluenceCache(board) {
  _infMap = bouzyKarte(board, _infA, _infB);
  _infValid = true;
}

/* Rechnet die Karte in den Puffern z/w und gibt den zurueck, der das
   Ergebnis haelt. Die Puffer gehoeren dem Aufrufer. */
function bouzyKarte(board, z, w) {
  for (let i = 0; i < BOARD_SIZE; i++)
    z[i] = board[i] === 1 ? 128 : board[i] === 2 ? -128 : 0;
  for (let k = 0; k < INFLUENCE_DILATE; k++) {
    for (let i = 0; i < BOARD_SIZE; i++) {
      let pos = 0, neg = 0;
      for (const n of NEIGHBORS[i]) { const q = z[n]; if (q > 0) pos++; else if (q < 0) neg++; }
      const v = z[i];
      /* Bouzy: wachsen darf nur, wer keinen Nachbarn der Gegenfarbe hat.
         Ein leeres Feld zwischen beiden Farben bleibt 0 -- umstritten. */
      w[i] = (v >= 0 && neg === 0) ? v + pos
           : (v <= 0 && pos === 0) ? v - neg : v;
    }
    const t = z; z = w; w = t;
  }
  for (let k = 0; k < INFLUENCE_ERODE; k++) {
    for (let i = 0; i < BOARD_SIZE; i++) {
      let nichtPos = 0, nichtNeg = 0;
      for (const n of NEIGHBORS[i]) { const q = z[n]; if (q <= 0) nichtPos++; if (q >= 0) nichtNeg++; }
      const v = z[i];
      w[i] = v > 0 ? Math.max(0, v - nichtPos) : v < 0 ? Math.min(0, v + nichtNeg) : 0;
    }
    const t = z; z = w; w = t;
  }
  return z;
}

/* Gleichstandsbrecher (endTieBreak): Bilanz der Karte in absoluten Farben,
   Felder der schwarzen Zone minus Felder der weissen. Eigene Puffer, damit
   _infMap der Einflusszonen-Terme unberuehrt bleibt. */
const _tbA = new Int32Array(BOARD_SIZE), _tbB = new Int32Array(BOARD_SIZE);
let _tbBilanz = 0, _tbValid = false;
function bouzyBilanz(board) {
  const z = bouzyKarte(board, _tbA, _tbB);
  let s = 0;
  for (let i = 0; i < BOARD_SIZE; i++) s += z[i] > 0 ? 1 : z[i] < 0 ? -1 : 0;
  return s;
}

/* Dasselbe Ergebnis, aber inkrementell. primeEndTieBreak hebt alle 27
   Zwischenstaende der Wurzelkarte auf (Ebene 0 = Startwerte, dann 5
   Dilatationen und 21 Erosionen). Fuer einen Kandidaten wird je Ebene nur
   neu gerechnet, was sich gegenueber der Wurzel geaendert hat, plus dessen
   Nachbarn: jedes Feld haengt nur von sich und seinen Nachbarn auf der
   Ebene davor ab, alles andere ist zwangslaeufig gleich. Damit bitgenau
   dieselbe Bilanz wie bouzyBilanz (tests/endspiel-gleichstand.js prueft
   das), bei einem Bruchteil der Kosten: ein Stein aendert meist nur
   rund 20 Felder je Ebene. Besuchte Felder sind per Stempel markiert,
   damit nichts pro Kandidat zurueckgesetzt werden muss. */
const BOUZY_EBENEN = INFLUENCE_DILATE + INFLUENCE_ERODE;
const _tbEbenen = new Int32Array((BOUZY_EBENEN + 1) * BOARD_SIZE);
const _tbBrett = new Uint8Array(BOARD_SIZE);
const _tbAkt = new Int32Array(BOARD_SIZE);
const _tbListe = [new Int32Array(BOARD_SIZE), new Int32Array(BOARD_SIZE)];
const _tbWert = [new Int32Array(BOARD_SIZE), new Int32Array(BOARD_SIZE)];
const _tbBesucht = new Int32Array(BOARD_SIZE);
let _tbStempel = 0;

/* Gebiet mit Sicherheit (PARAMS.gebietSicher): ein Lebensurteil fuer die
   Bouzy-Karte von gebietZug, endTieBreak und gegnerGebiet. Das Urteil gilt
   fuer die Stellung an der Wurzel und kommt von aussen
   (setzeLebensurteil), bisher nur von GNU Go in gnugo-duell.js --orakel;
   ohne Urteil oder bei 0 aendert sich nichts.
     tot:  Uint8Array, Farbe des Steins, wenn er zu einer toten Gruppe
           gehoert, sonst 0; toteSteine: die Indizes dazu.
     krit: [{farbe, steine, angriff, verteidigung}], kritische Gruppen.
   Tote Steine zaehlen in der Karte als Steine des Gegners, an der Wurzel
   wie nach jedem Kandidaten: Ihre Flaeche gehoert ihm. (Nur weglassen
   hinterliesse ein Vakuum, in dem jeder eigene Zug scheinbar Gebiet
   gewinnt, docs/gebiet-sicher.md §7.)
   Kritisch heisst: Wer zuerst zieht, entscheidet. Nach dem Zug des
   Ziehenden ist der Gegner dran; die eigene kritische Gruppe zaehlt also
   nur, wenn der Zug ihr Verteidigungspunkt ist, die fremde nur dann nicht,
   wenn der Zug ihr Angriffspunkt ist; sonst zaehlt sie wie eine tote.
   Haengt der neue Stein an solchen Steinen, zaehlt seine Kette mit. */
let _lebensUrteil = null;
function setzeLebensurteil(u) { _lebensUrteil = u; }
const _lsWurzel = new Uint8Array(BOARD_SIZE), _lsNb = new Uint8Array(BOARD_SIZE);
function lsAktiv() { return PARAMS.gebietSicher > 0 && _lebensUrteil !== null; }
function lsOhneTote(board) {
  const u = _lebensUrteil;
  _lsWurzel.set(board);
  for (const s of u.toteSteine) if (_lsWurzel[s] === u.tot[s]) _lsWurzel[s] = 3 - u.tot[s];
  return _lsWurzel;
}
/* nb: Brett nach dem Zug i von color (Schlaege schon ausgefuehrt). Gibt
   eine Kopie zurueck, nb bleibt unberuehrt. */
function lsNach(nb, i, color) {
  const u = _lebensUrteil, b = _lsNb;
  b.set(nb);
  if (PARAMS.gebietSicher !== 2) for (const s of u.toteSteine) if (b[s] === u.tot[s]) b[s] = 3 - u.tot[s];
  for (const k of u.krit) {
    if (k.farbe === color ? i >= 0 && i === k.verteidigung : !(i >= 0 && i === k.angriff)) continue;
    for (const s of k.steine) if (b[s] === k.farbe) b[s] = 3 - k.farbe;
  }
  if (i >= 0 && b[i] === color) {
    let haengt = false;
    for (const n of NEIGHBORS[i]) if (nb[n] === color && b[n] !== color) haengt = true;
    if (haengt) for (const s of floodFill(b, i).group) b[s] = 3 - color;
  }
  return b;
}
/* Bezug fuer die Bilanzaenderung mit Urteil: die Wurzel, als haette color
   gepasst (eigene kritische Gruppen weg, fremde da). Gegen die Wurzel
   selbst sackten sonst alle Zuege ausser dem Verteidigungspunkt um den Wert
   der Gruppe ab, und die Pass-Pruefung sah nur noch schlechte Zuege
   (docs/gebiet-sicher.md §7). Je Farbe einmal nach primeEndTieBreak. */
const _lsBasis = [0, 0, 0], _lsBasisOk = [false, false, false];
function lsBasis(color) {
  if (!_lsBasisOk[color]) { _lsBasis[color] = tbBilanzNach(lsNach(_tbBrett, -1, color)); _lsBasisOk[color] = true; }
  return _lsBasis[color];
}

function primeEndTieBreak(board) {
  const N = BOARD_SIZE, L = _tbEbenen;
  _lsBasisOk[1] = _lsBasisOk[2] = false;
  if (lsAktiv() && PARAMS.gebietSicher !== 2) board = lsOhneTote(board);
  _tbBrett.set(board);
  for (let i = 0; i < N; i++) L[i] = board[i] === 1 ? 128 : board[i] === 2 ? -128 : 0;
  for (let k = 1; k <= BOUZY_EBENEN; k++) {
    const alt = (k - 1) * N, neu = k * N;
    for (let i = 0; i < N; i++) {
      const v = L[alt + i];
      if (k <= INFLUENCE_DILATE) {
        let pos = 0, neg = 0;
        for (const n of NEIGHBORS[i]) { const q = L[alt + n]; if (q > 0) pos++; else if (q < 0) neg++; }
        L[neu + i] = (v >= 0 && neg === 0) ? v + pos : (v <= 0 && pos === 0) ? v - neg : v;
      } else {
        let nichtPos = 0, nichtNeg = 0;
        for (const n of NEIGHBORS[i]) { const q = L[alt + n]; if (q <= 0) nichtPos++; if (q >= 0) nichtNeg++; }
        L[neu + i] = v > 0 ? Math.max(0, v - nichtPos) : v < 0 ? Math.min(0, v + nichtNeg) : 0;
      }
    }
  }
  let s = 0;
  for (let i = 0, o = BOUZY_EBENEN * N; i < N; i++) s += L[o + i] > 0 ? 1 : L[o + i] < 0 ? -1 : 0;
  _tbBilanz = s;
  if (_tbStempel > 2e9) {   /* Stempel laufen nie ueber */
    _tbStempel = 0;
    _tbBesucht.fill(0);
  }
  _tbValid = true;
}

/* Gebiet (gebietGewicht): Bilanz der Bouzy-Karte in absoluten Farben,
   schwarze Zone minus weisse, Steine eingeschlossen. Eigene Puffer. */
const _geA = new Int32Array(BOARD_SIZE), _geB = new Int32Array(BOARD_SIZE);
const _gzScratch = new Uint8Array(BOARD_SIZE);
function gebietBilanz(board) {
  const z = bouzyKarte(board, _geA, _geB);
  let s = 0;
  for (let i = 0; i < BOARD_SIZE; i++) s += z[i] > 0 ? 1 : z[i] < 0 ? -1 : 0;
  return s;
}

/* Raumrisiko (raumGewicht): Anteil, mit dem eine Kette mit 4-7 Freiheiten
   als geschlagen gilt, nach Freiheiten (Zeile 4..7) und K3-Stufe
   (Spalte: 0 | 1-4 | 5-14 | ab 15). Grundlage: Sterberate binnen 40
   Halbzuegen, Ketten ab 6 Steinen, Entwicklungsdaten (docs/laufkampf.md,
   §7.1). Gerundet, bis 0,5 % als 0, und bei 4 Freiheiten auf 0,25 gedeckelt:
   STERBE_RAMPE gibt bei 3 Freiheiten 0,25, sonst lohnte es, eine eigene
   Kette von 4 auf 3 Freiheiten zu bringen. In beiden Richtungen fallend. */
const RAUM_RISIKO = [
  [0.25, 0.25, 0.17, 0],
  [0.18, 0.10, 0.06, 0],
  [0.18, 0.07, 0.02, 0],
  [0.08, 0.02, 0,    0],
];
const _raumK3 = new Int32Array(BOARD_SIZE);
const _raumBrett = new Uint8Array(BOARD_SIZE);
const _raA = new Int32Array(BOARD_SIZE), _raB = new Int32Array(BOARD_SIZE);
let _raumValid = false;

const _raInKette = new Uint8Array(BOARD_SIZE), _raGesehen = new Uint8Array(BOARD_SIZE);
const _raScratch = new Uint8Array(BOARD_SIZE);
let _raumKetten = [];   /* Wurzelketten mit 4-7 Freiheiten, fuer raumZug */

/* K3 einer Kette (group) auf der Karte z: Felder der eigenen Zone, ueber
   eigene Zonenfelder mit der Kette zusammenhaengend, ohne die Kette selbst
   -- wie auswertung/einschliessung.js. */
function _raumK3Von(z, group, c) {
  _raInKette.fill(0); _raGesehen.fill(0);
  for (const g of group) _raInKette[g] = 1;
  const eigen = c === 1 ? (v => v > 0) : (v => v < 0);
  const q = [];
  for (const g of group) for (const n of NEIGHBORS[g])
    if (!_raInKette[n] && !_raGesehen[n] && eigen(z[n])) { _raGesehen[n] = 1; q.push(n); }
  for (let k = 0; k < q.length; k++)
    for (const n of NEIGHBORS[q[k]])
      if (!_raInKette[n] && !_raGesehen[n] && eigen(z[n])) { _raGesehen[n] = 1; q.push(n); }
  return q.length;
}

/* Risiko einer Kette nach Freiheiten und K3: geschlagen 1, bis 3 Freiheiten
   STERBE_RAMPE, 4-7 RAUM_RISIKO, darueber 0. */
function raumRisiko(libs, k3) {
  if (libs < STERBE_RAMPE.length) return STERBE_RAMPE[libs];
  if (libs > 7) return 0;
  return RAUM_RISIKO[libs - 4][k3 === 0 ? 0 : k3 <= 4 ? 1 : k3 <= 14 ? 2 : 3];
}

/* Einmal je Zug an der Wurzel: K3 je Stein, dazu die Ketten fuer raumZug. */
function primeRaum(board) {
  const z = bouzyKarte(board, _raA, _raB);
  _raumBrett.set(board);
  _raumK3.fill(-1);
  _raumKetten = [];
  for (let i = 0; i < BOARD_SIZE; i++) {
    const c = board[i];
    if (!c || _raumK3[i] >= 0) continue;
    const {group, liberties} = floodFill(board, i);
    const k3 = _raumK3Von(z, group, c);
    for (const g of group) _raumK3[g] = k3;
    const fr = liberties.length;
    if (fr >= 4 && fr <= 7 && group.length >= PARAMS.deathDiscountSize)
      _raumKetten.push({anker: i, farbe: c, groesse: group.length, risiko: raumRisiko(fr, k3)});
  }
  _raumValid = true;
}

/* raumZug: Risikoaenderung der Wurzelketten durch den Zug i von color, in
   Steinen; positiv = gut fuer color. Eine volle Bouzy-Karte je Kandidat,
   nur an der Wurzel und nur, wenn es solche Ketten gibt. */
function raumZugGewinn(board, i, color) {
  if (!_raumKetten.length) return 0;
  const nb = _raScratch;
  nb.set(board); nb[i] = color;
  removeDeadGroups(nb, color === 1 ? 2 : 1, i);
  const z = bouzyKarte(nb, _raA, _raB);
  let g = 0;
  for (const k of _raumKetten) {
    let nachher = 1;
    if (nb[k.anker] === k.farbe) {
      const {group, liberties} = floodFill(nb, k.anker);
      nachher = raumRisiko(liberties.length, _raumK3Von(z, group, k.farbe));
    }
    const sicherer = k.risiko - nachher;
    g += (k.farbe === color ? sicherer : -sicherer) * k.groesse;
  }
  return g;
}

/* Bilanz der Karte nach dem Zug (nb), aus den Wurzelebenen. Je Ebene wird
   _tbAkt zur vollen Vorebene des Kandidaten: Wurzelebene kopiert, die
   geaenderten Felder darueber. Die Kopie kostet 361 Werte, der Zugriff
   danach ist ohne Verzweigung. */
function tbBilanzNach(nb) {
  const N = BOARD_SIZE, L = _tbEbenen, C = _tbAkt;
  let p = 0, anz = 0;
  for (let i = 0; i < N; i++) {
    if (nb[i] === _tbBrett[i]) continue;
    const v = nb[i] === 1 ? 128 : nb[i] === 2 ? -128 : 0;
    if (v !== L[i]) { _tbListe[0][anz] = i; _tbWert[0][anz++] = v; }
  }
  for (let k = 1; k <= BOUZY_EBENEN && anz > 0; k++) {
    const alt = (k - 1) * N, neu = k * N, q = 1 - p;
    const lP = _tbListe[p], wP = _tbWert[p], lN = _tbListe[q], wN = _tbWert[q];
    C.set(L.subarray(alt, alt + N));
    for (let j = 0; j < anz; j++) C[lP[j]] = wP[j];
    const besuch = ++_tbStempel;
    let anzN = 0;
    for (let j = 0; j < anz; j++) {
      const d = lP[j], nd = NEIGHBORS[d];
      for (let r = -1; r < nd.length; r++) {
        const c = r < 0 ? d : nd[r];
        if (_tbBesucht[c] === besuch) continue;
        _tbBesucht[c] = besuch;
        const v = C[c], nc = NEIGHBORS[c];
        let w;
        if (k <= INFLUENCE_DILATE) {
          let pos = 0, neg = 0;
          for (let m = 0; m < nc.length; m++) { const x = C[nc[m]]; if (x > 0) pos++; else if (x < 0) neg++; }
          w = (v >= 0 && neg === 0) ? v + pos : (v <= 0 && pos === 0) ? v - neg : v;
        } else {
          let nichtPos = 0, nichtNeg = 0;
          for (let m = 0; m < nc.length; m++) { const x = C[nc[m]]; if (x <= 0) nichtPos++; if (x >= 0) nichtNeg++; }
          w = v > 0 ? Math.max(0, v - nichtPos) : v < 0 ? Math.min(0, v + nichtNeg) : 0;
        }
        if (w !== L[neu + c]) { lN[anzN] = c; wN[anzN++] = w; }
      }
    }
    p = q; anz = anzN;
  }
  /* anz > 0 nur, wenn die Aenderung bis zur letzten Ebene reicht; dann
     haelt Liste p genau die Felder, die sich in der Endkarte unterscheiden. */
  let s = _tbBilanz;
  const o = BOUZY_EBENEN * N, lE = _tbListe[p], wE = _tbWert[p];
  for (let j = 0; j < anz; j++) {
    const a = L[o + lE[j]], b = wE[j];
    s += (b > 0 ? 1 : b < 0 ? -1 : 0) - (a > 0 ? 1 : a < 0 ? -1 : 0);
  }
  return s;
}

/* +1 = Feld liegt in der eigenen Zone von `color`, -1 = in der des Gegners,
   0 = umstritten/neutral (oder keine Karte). */
function influenceZone(i, color) {
  if (!_infValid) return 0;
  const v = _infMap[i];
  if (v === 0) return 0;
  return ((v > 0) === (color === 1)) ? 1 : -1;
}

function evalEndgame(board, i, color, mc) {
  const opp = color === 1 ? 2 : 1;
  let areaBefore, oppBefore;
  if (_areaCacheValid && _areaCacheColor === color) {
    areaBefore = _areaCacheOwn; oppBefore = _areaCacheOpp;
  } else {
    areaBefore = estimateArea(board, color);
    oppBefore  = estimateArea(board, opp);
  }
  _evalScratch.set(board);
  _evalScratch[i] = color;
  const cap = removeDeadGroups(_evalScratch, opp, i);
  /* Der Deckel bleibt bei 2, solange der Freiheitsterm aus ist: countLiberties
     bricht beim Deckel ab, ein hoeherer kostet also Laufzeit. Bei lib 0 und 1
     liefern beide Deckel denselben Wert, die bestehenden Vergleiche unten
     sind davon nicht beruehrt. */
  const lib = countLiberties(_evalScratch, i, PARAMS.endLibPressure > 0 ? 4 : 2);
  if (lib === 0 && cap === 0) return -10000 + Math.random();
  const areaAfter = estimateArea(_evalScratch, color);
  const oppAfter  = estimateArea(_evalScratch, opp);
  const myGain  = areaAfter - areaBefore;
  const oppLoss = oppBefore  - oppAfter;
  let s = (myGain + oppLoss) * PARAMS.endAreaGain;
  s += cap * PARAMS.endCapBonus;
  if (lib === 1 && cap === 0) s -= PARAMS.endAtariPenalty * _atariGewicht(_evalScratch, i);
  /* Freiheitsdruck oberhalb von Atari. Die Atari-Strafe oben springt erst bei
     genau einer Freiheit; der Weg dorthin war bis hierher gratis. Der Term
     ist proportional zur Gruppengroesse geteilt durch die Freiheiten: was auf
     dem Spiel steht, mal wie nah es daran ist. Ab vier Freiheiten null. */
  if (PARAMS.endLibPressure > 0 && cap === 0 && lib >= 2 && lib <= 3) {
    const n = countGroupSize(_evalScratch, i);
    _druckRufe++; if (n >= 6) _druckGross++;
    if (n > _druckMaxGroesse) _druckMaxGroesse = n;
    s -= PARAMS.endLibPressure * n / lib;
  }
  for (const n of NEIGHBORS[i]) {
    if (board[n] === opp && countLiberties(board, n, 2) === 1) s += PARAMS.endOppAtari;
  }
  if (PARAMS.endTieBreak > 0 && _tbValid) {
    const d = (tbBilanzNach(lsAktiv() ? lsNach(_evalScratch, i, color) : _evalScratch) - (lsAktiv() ? lsBasis(color) : _tbBilanz)) * (color === 1 ? 1 : -1);
    s += PARAMS.endTieBreak * Math.max(-1, Math.min(1, d / 20));
  }
  return s + Math.random() * 0.5;
}

const _crisisOwn = new Uint8Array(BOARD_SIZE);
const _crisisOpp = new Uint8Array(BOARD_SIZE);

function buildCrisisMap(board, color) {
  _crisisOwn.fill(0);
  _crisisOpp.fill(0);
  const opp = color === 1 ? 2 : 1;
  const seen = new Uint8Array(BOARD_SIZE);
  for (let i = 0; i < BOARD_SIZE; i++) {
    const c = board[i];
    if (!c || seen[i]) continue;
    const {group, liberties} = floodFill(board, i);
    for (const g of group) seen[g] = 1;
    const libs = liberties.length;
    const size = group.length;
    let w = 0;
    if      (libs === 1)                                           w = PARAMS.crisisAtari;
    else if (libs === 2 && size >= PARAMS.crisisLargeSize)  w = PARAMS.crisisLarge2Lib;
    else if (libs === 3 && size >= PARAMS.crisisDragonSize) w = PARAMS.crisisDragon3Lib;
    if (w > 0) {
      const target = c === color ? _crisisOwn : _crisisOpp;
      for (const lib of liberties) if (target[lib] < w) target[lib] = w;
    }
  }
}

/* Wie lange steckt die Gruppe, zu der ein Punkt gehört, schon in der
   Krise? Zähler JE BRETTPUNKT, nicht je Gruppe: eine Gruppe wächst, schrumpft
   und verschmilzt, eine Gruppen-ID über Züge hinweg wäre entweder fragil
   (kleinster Index wandert beim Verschmelzen) oder teuer. Der Punktzähler
   überlebt beides — eine wachsende Gruppe erbt die hohen Zähler ihrer alten
   Steine, und "wie lange schon in der Krise" ist dann das Maximum über ihre
   Steine.

   Fortgeschrieben wird EINMAL PRO ECHTEM ZUG auf dem echten Brett, nicht in
   der Suche: innerhalb einer Suche triggert dieselbe Bedingung tausendfach,
   "dritter Zug in Folge" wäre dort bedeutungslos. */
const _krisenDauer = new Uint8Array(BOARD_SIZE);
/* Eigene Scratch-Felder statt eines geliehenen: _evalBoardSeen gehoert
   evaluateBoard, und geteilte Scratch-Puffer sind in diesem Repo schon
   dreimal die Ursache stiller Fehler gewesen. Einmal je Zug allokieren
   waere ebenfalls billig, aber dann haette der Zaehler eine andere
   Lebensdauer als die Funktion, die ihn fuellt. */
const _krisenFlag = new Uint8Array(BOARD_SIZE);
const _krisenGesehen = new Uint8Array(BOARD_SIZE);

function aktualisiereKrisenDauer(board, color) {
  const inKrise = _krisenFlag;
  inKrise.fill(0);
  const gesehen = _krisenGesehen;
  gesehen.fill(0);
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] !== color || gesehen[i]) continue;
    const {group, liberties} = floodFill(board, i);
    for (const g of group) gesehen[g] = 1;
    /* Genau die beiden Bedingungen, die buildCrisisMap als GROSSGRUPPEN-Krise
       behandelt. Atari (eine Freiheit) bleibt bewusst draussen: das ist eine
       akute Lage, keine chronische — der Term hier zielt auf "wird zum
       dritten Mal gerettet und hat immer noch keine Form". */
    const k = (liberties.length === 2 && group.length >= PARAMS.crisisLargeSize)
           || (liberties.length === 3 && group.length >= PARAMS.crisisDragonSize);
    if (k) for (const g of group) inKrise[g] = 1;
  }
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (inKrise[i]) { if (_krisenDauer[i] < 255) _krisenDauer[i]++; }
    else _krisenDauer[i] = 0;
  }
}

/* Fuer den A/B-Harness: die beiden Arme spielen abwechselnd, der Zaehler ist
   Zustand EINER Partie einer Farbe und muss zwischen ihnen getauscht werden —
   sonst leckt er wie der Faktor-Waechter und _lastMsPerSim vor ihm. */
function leseKrisenDauer() { return _krisenDauer.slice(); }
function setzeKrisenDauer(a) { if (a) _krisenDauer.set(a); else _krisenDauer.fill(0); }

let _augenRufe = 0, _augenOffen = 0;
/* Waechter: wie viele der gezaehlten Augenpunkte sind offen, also solche, die
   der Ueberzaehler faelschlich mitnimmt. Bleibt der Anteil bei 0, gibt es
   nichts abzuwerten und ein Nullergebnis waere bedeutungslos. */
function leseAugenWaechter(reset) {
  const v = {rufe: _augenRufe, offen: _augenOffen};
  if (reset) { _augenRufe = 0; _augenOffen = 0; }
  return v;
}

let _sunkRufe = 0, _sunkGriff = 0, _sunkMaxDauer = 0;
function leseSunkWaechter(reset) {
  const v = {rufe: _sunkRufe, griff: _sunkGriff, maxDauer: _sunkMaxDauer};
  if (reset) { _sunkRufe = 0; _sunkGriff = 0; _sunkMaxDauer = 0; }
  return v;
}

function getCrisisWeight(i) {
  return Math.max(_crisisOwn[i], _crisisOpp[i]) / 100;
}

function isTsumegoSituation(i) {
  return _crisisOwn[i] > 0 || _crisisOpp[i] > 0;
}

function evalNakade(boardBefore, boardAfter, i, opp) {
  let bonus = 0;
  const seen = new Set();
  for (const n of NEIGHBORS[i]) {
    if (boardBefore[n] !== opp || seen.has(n)) continue;
    const before = floodFill(boardBefore, n);
    for (const g of before.group) seen.add(g);
    if (!before.liberties.includes(i)) continue;
    const libsBefore = before.liberties.length;
    if (boardAfter[n] !== opp) { bonus += 1200; continue; }
    const libsAfter = countLiberties(boardAfter, n, 3);
    if      (libsAfter === 0)                          bonus += 1200;
    else if (libsAfter === 1)                          bonus += 700;
    else if (libsAfter === 2 && libsBefore <= 3)       bonus += 250;
  }
  return bonus;
}

function evalTsumego(board, i, color, mc) {
  let s = 0;
  const opp = color === 1 ? 2 : 1;
  _tsumegoScratch.set(board);
  _tsumegoScratch[i] = color;
  const cap = removeDeadGroups(_tsumegoScratch, opp, i);
  const own = floodFill(_tsumegoScratch, i);
  const lib = own.liberties.length;
  if (lib === 0 && cap === 0) return -10000 + Math.random();
  const safetyMul = (lib === 1 && cap === 0) ? PARAMS.tsumegoSafetyMul : 1.0;
  s += cap * PARAMS.tsumegoCapBonus;
  for (const n of NEIGHBORS[i]) {
    if (_tsumegoScratch[n] !== opp) continue;
    const l = countLiberties(_tsumegoScratch, n, 3);
    if (l === 1) s += PARAMS.tsumegoAtariSet;
    else if (l === 2) s += PARAMS.tsumego2Lib;
  }
  for (const n of NEIGHBORS[i]) {
    if (board[n] !== color) continue;
    const before = countLiberties(board, n, 3);
    if (before <= 2) {
      const after = countLiberties(_tsumegoScratch, n, 3);
      if (before === 1) {
        if      (after >= 3) s += PARAMS.tsumegoRescue3;
        else if (after === 2) s += PARAMS.tsumegoRescue2;
        else if (after === 1) s += PARAMS.tsumegoRescue1;
      } else if (before === 2 && after >= 3) {
        s += PARAMS.tsumegoRescue2to3;
      }
    }
  }
  s += lib * PARAMS.tsumegoLibBonus;
  if (lib === 2 && cap === 0) s -= PARAMS.tsumego2LibPenalty;
  const seenCands = new Uint8Array(BOARD_SIZE);
  let eyeBonus = 0;
  for (const g of own.group) {
    for (const n of NEIGHBORS[g]) {
      if (_tsumegoScratch[n] !== 0 || seenCands[n]) continue;
      seenCands[n] = 1;
      let potEye = true;
      let ownAdj = 0;
      for (const nn of NEIGHBORS[n]) {
        const c = _tsumegoScratch[nn];
        if (c === opp) { potEye = false; break; }
        if (c === color) ownAdj++;
      }
      const nx = xOf(n), ny = yOf(n);
      const edge   = nx===0||nx===SIZE-1||ny===0||ny===SIZE-1;
      const corner = (nx===0||nx===SIZE-1)&&(ny===0||ny===SIZE-1);
      const minOwn = corner ? 1 : edge ? 2 : 3;
      if (potEye && ownAdj >= minOwn) {
        /* Offene Punkte abwerten. Die Schwelle minOwn laesst ueberall genau
           einen leeren Nachbarn zu (Rand 2 von 3, Mitte 3 von 4, Ecke 1 von
           2) — ein Punkt, durch den der Gegner noch hineinlaufen kann, zaehlt
           also voll. tsumegoEyeOpenPenalty zieht je fehlendem Nachbarn ab;
           bei 0 steht hier bitgenau der alte Ausdruck. Mehr als ein Nachbar
           kann nie fehlen, die Schwellen lassen nur einen zu — die Dosis sagt
           damit genau: was ist ein OFFENER Augenpunkt noch wert. */
        if (PARAMS.tsumegoEyeOpenPenalty > 0) {
          const offen = NEIGHBORS[n].length - ownAdj;
          _augenRufe++;
          if (offen > 0) {
            _augenOffen++;
            const w = PARAMS.tsumegoEyeBonus - PARAMS.tsumegoEyeOpenPenalty * offen;
            /* Bei 0 gekappt statt negativ: ein "Auge" soll hoechstens
               wertlos sein, nicht zur Strafe werden — sonst haengt am selben
               Knopf ein zweiter Effekt und die Dosisreihe waere mehrdeutig. */
            if (w > 0) eyeBonus += w;
          } else eyeBonus += PARAMS.tsumegoEyeBonus;
        } else eyeBonus += PARAMS.tsumegoEyeBonus;
      }
    }
  }
  s += Math.min(eyeBonus, PARAMS.tsumegoEyeMax);
  s += evalNakade(board, _tsumegoScratch, i, opp) * PARAMS.tsumegoNakade;
  for (const n of NEIGHBORS[i]) {
    if (board[n] !== color) continue;
    const before = countLiberties(board, n, 2);
    const after  = countLiberties(_tsumegoScratch, n, 2);
    if (after === 1 && before > 1) s -= PARAMS.tsumegoWeaken;
  }
  /* Versenkte Kosten: steckt diese Gruppe seit mehreren Zuegen in derselben
     Krise, ohne herauszukommen, wird jede weitere Rettung teurer. Das Maximum
     ueber die Steine, weil eine gewachsene Gruppe die Dauer ihrer alten
     Steine erbt. */
  if (PARAMS.tsumegoSunkCost > 0) {
    let dauer = 0;
    for (const g of own.group) if (_krisenDauer[g] > dauer) dauer = _krisenDauer[g];
    _sunkRufe++;
    if (dauer > _sunkMaxDauer) _sunkMaxDauer = dauer;
    if (dauer >= PARAMS.tsumegoSunkStreak) { s -= PARAMS.tsumegoSunkCost; _sunkGriff++; }
  }
  return s * safetyMul + Math.random() * 3;
}

/* ═══ MoE Soft-Gating ════════════════════════════════════════
   Bisher: harte if/else-Umschaltung → Zug 19→20 bewertet plötzlich
   komplett anders (Diskontinuität, sichtbare Stilbrüche).
   Jetzt: smoothstep-Rampen über ±phaseBlendWidth Züge; in der
   Übergangszone laufen zwei Experten und werden gewichtet gemischt.
   phaseBlendWidth = 0 stellt exakt das alte Verhalten wieder her. */
/* Referenz-Entscheidungsspannen der Experten (p95−p50), gemessen als Median
   über je 10 zufällige Bretter passender Dichte. Nur für phaseNormalize; sie
   sind Messwerte, keine Stellschrauben. */
const PHASE_SPAN = {open: 15.8, mid: 160.2, end: 158.0};

function smoothstep01(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }

function phaseWeights(mc, emptyFields) {
  const W = PARAMS.phaseBlendWidth;
  if (W <= 0) {
    if (mc > PARAMS.endgameMoves || emptyFields < PARAMS.endgameEmpty) return {wOpen:0, wMid:0, wEnd:1};
    if (mc < PARAMS.openingMoves) return {wOpen:1, wMid:0, wEnd:0};
    return {wOpen:0, wMid:1, wEnd:0};
  }
  const eMoves = smoothstep01((mc - PARAMS.endgameMoves) / (2*W) + 0.5);
  const eEmpty = smoothstep01((PARAMS.endgameEmpty - emptyFields) / (4*W) + 0.5);
  const wEnd   = Math.max(eMoves, eEmpty);       /* ODER-Logik wie bisher */
  const wOpen  = smoothstep01((PARAMS.openingMoves - mc) / (2*W) + 0.5) * (1 - wEnd);
  return {wOpen, wMid: 1 - wEnd - wOpen, wEnd};
}

    nb.set(board); nb[i] = color;
