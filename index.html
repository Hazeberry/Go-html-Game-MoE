<script id="shared-go-logic">
const SIZE = 19;
const BOARD_SIZE = SIZE * SIZE;
const COL_LETTERS = 'ABCDEFGHJKLMNOPQRST';
/* Alle NEUN Sternpunkte. [15,9] (= Q10) fehlte — dadurch war der rechte
   mittlere Punkt auf dem Brett unsichtbar UND bekam in evalOpening nie den
   openHoshiBonus, den seine drei Spiegelpunkte D10/K10/Q4 bekamen. */
const HOSHI_XY = [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]];
const HOSHI_IDX = new Set(HOSHI_XY.map(([x,y]) => y * SIZE + x));

function idx(x, y) { return y * SIZE + x; }
function xOf(i) { return i % SIZE; }
function yOf(i) { return (i / SIZE) | 0; }

const NEIGHBORS = (() => {
  const t = new Array(BOARD_SIZE);
  for (let i = 0; i < BOARD_SIZE; i++) {
    const x = xOf(i), y = yOf(i), n = [];
    if (x > 0)      n.push(i - 1);
    if (x < SIZE-1) n.push(i + 1);
    if (y > 0)      n.push(i - SIZE);
    if (y < SIZE-1) n.push(i + SIZE);
    t[i] = n;
  }
  return t;
})();

function createBoard() { return new Uint8Array(BOARD_SIZE); }
function cloneBoard(b) { return new Uint8Array(b); }

/* FIX: XOR arbeitet in JS nur auf 32 Bit — die alte Float64-Tabelle wurde
   dadurch stillschweigend auf 32-Bit-Hashes gestutzt. Jetzt zwei getrennte
   32-Bit-Ebenen, kombiniert zu einem exakten 53-Bit-Integer → praktisch
   keine Superko-Hash-Kollisionen mehr. */
const ZOBRIST_LO = new Uint32Array(BOARD_SIZE * 3);
const ZOBRIST_HI = new Uint32Array(BOARD_SIZE * 3);
(() => {
  let s = 123456789;
  const r = () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return s >>> 0; };
  for (let i = 0; i < ZOBRIST_LO.length; i++) { ZOBRIST_LO[i] = r(); ZOBRIST_HI[i] = r(); }
})();

function computeZobrist(board) {
  let lo = 0, hi = 0;
  for (let i = 0; i < BOARD_SIZE; i++)
    if (board[i]) {
      const k = i * 3 + (board[i] - 1);
      lo ^= ZOBRIST_LO[k]; hi ^= ZOBRIST_HI[k];
    }
  return hi * 0x200000 + (lo >>> 11);   /* 32 + 21 = 53 Bit, exakt in Number */
}

const _ffVisited = new Int32Array(BOARD_SIZE);
let   _ffEpoch   = 0;

/* 32-Bit-Überlauf-Wache für das Epochen-Marking (Fund durch den
   A/B-Harness: Partie 3 crashte mit "NEIGHBORS[g] is not iterable").
   _ffEpoch wird pro countLiberties-/floodFill-/removeDeadGroups-/
   evaluateBoard-Aufruf erhöht — auf Schwer sind das gemessen
   ~6 Mio. pro Zug. Die Marker-Arrays (_ffVisited, _rdgChecked,
   früher auch _evalBoardSeen) sind Int32Array: Überschreitet der Zähler 2^31,
   kippt der gespeicherte Wert negativ, der Vergleich mit der echten
   Epoche schlägt ab dann IMMER fehl — die Besucht-Markierung ist
   lautlos tot. Folge: Gruppen-Queues laufen über → Crash in
   evaluateBoard/countLiberties bzw. Endlosschleife mit OOM in
   floodFill (im Browser: Worker-Hänger → Watchdog). Der Zähler
   kumuliert über Partien in derselben JS-Umgebung (Worker lebt
   zwischen Zügen, Hauptthread zwischen Spielen — resetGame setzt
   ihn nicht zurück); der Überlauf tritt nach grob 300–350
   Schwer-Zügen Summe auf. Fix: kurz vor 2^31 alle Marker nullen
   und bei 1 neu starten — Markierungen gelten ohnehin nur
   innerhalb eines Aufrufs, nichts geht verloren. */
/* Nur fuer Tests (tests/epochen.js): Zaehler kurz vor den Ueberlauf setzen,
   um ihn an einer bestimmten Stelle auszuloesen. 2^31 echte Aufrufe waeren
   in einem Test nicht bezahlbar. */
function setzeFfEpoche(n) { _ffEpoch = n; }

function _nextFfEpoch() {
  if (++_ffEpoch >= 0x7fffffff) {
    _ffEpoch = 1;
    _ffVisited.fill(0);
    _rdgChecked.fill(0);
  }
  return _ffEpoch;
}

function floodFill(board, startIdx) {
  const color = board[startIdx];
  const group = [], liberties = [];
  const epoch = _nextFfEpoch();
  const queue = [startIdx];
  let head = 0;
  _ffVisited[startIdx] = epoch;
  while (head < queue.length) {
    const i = queue[head++];
    const cell = board[i];
    if (cell === 0) { liberties.push(i); continue; }
    if (cell !== color) continue;
    group.push(i);
    for (const n of NEIGHBORS[i])
      if (_ffVisited[n] !== epoch) { _ffVisited[n] = epoch; queue.push(n); }
  }
  return { group, liberties };
}

/* ═══ estimateArea-Perf-Refactor: allokationsfreie Gruppen-Primitiven ═══
   Messung (Partie vom 16.7., 205 Züge nachgespielt): ms/Sim stieg vom
   frühen Spiel bis Zug 205 um ×11,7 — auf Desktop-CPU genauso wie auf dem
   Telefon, also Code, nicht Hardware. Ursache: floodFill baut bei JEDEM
   Aufruf group- und liberties-Arrays, aber fast alle heißen Aufrufer
   (Legalitätsprüfung, quickEval, evaluateBoard) brauchen nur eine ZAHL —
   meist nur »hat die Gruppe überhaupt eine Freiheit?«. Bei den großen
   zusammenhängenden Spätspiel-Gruppen heißt das: kompletter Gruppen-Walk
   plus zwei Array-Allokationen pro Kandidat, wo ein Abbruch bei der
   ersten gefundenen Freiheit reichen würde.

   countLiberties zählt Freiheiten ohne jede Allokation und bricht ab,
   sobald `cap` Freiheiten gefunden sind: cap=1 → »lebt?«, cap=2 → »Atari?«,
   cap=3 → »≤2 Freiheiten?«. floodFill bleibt für die Aufrufer bestehen,
   die wirklich die Zellenlisten brauchen (buildCrisisMap, findEyes, UI). */
const _groupQueue = new Int32Array(BOARD_SIZE);

function countLiberties(board, startIdx, cap) {
  const color = board[startIdx];
  const limit = cap === undefined ? 0x7fffffff : cap;
  const epoch = _nextFfEpoch();
  let head = 0, tail = 0, libs = 0;
  _groupQueue[tail++] = startIdx;
  _ffVisited[startIdx] = epoch;
  while (head < tail) {
    const i = _groupQueue[head++];
    for (const n of NEIGHBORS[i]) {
      if (_ffVisited[n] === epoch) continue;
      _ffVisited[n] = epoch;
      const c = board[n];
      if (c === 0) { if (++libs >= limit) return libs; }
      else if (c === color) _groupQueue[tail++] = n;
    }
  }
  return libs;
}

/* Gruppengröße ohne Allokation, nach demselben Muster wie countLiberties.
   Gebraucht von der größenskalierten Atari-Strafe: dort steht schon fest,
   dass die Gruppe im Atari ist, gefragt ist nur noch WIE VIEL auf dem Spiel
   steht. Ein eigener Lauf statt einer Rückgabe aus countLiberties, weil der
   Abbruch bei `cap` dort den Gruppen-Walk gerade NICHT zu Ende führt — eine
   dort mitgezählte Größe wäre je nach cap falsch und stillschweigend falsch.
   Der Lauf kostet nur auf dem Atari-Pfad, und nur wenn die Skalierung an
   ist; siehe _atariGewicht. */
function countGroupSize(board, startIdx) {
  const color = board[startIdx];
  const epoch = _nextFfEpoch();
  let head = 0, tail = 0;
  _groupQueue[tail++] = startIdx;
  _ffVisited[startIdx] = epoch;
  while (head < tail) {
    const i = _groupQueue[head++];
    for (const n of NEIGHBORS[i]) {
      if (_ffVisited[n] === epoch) continue;
      _ffVisited[n] = epoch;          /* auch Fremdfelder markieren, sonst */
      if (board[n] !== color) continue; /* prüft man sie je Nachbarstein neu */
      _groupQueue[tail++] = n;
    }
  }
  return tail;
}

/* Entfernt eine als tot ERKANNTE Gruppe (0 Freiheiten, vom Aufrufer
   geprüft). board[g]=0 dient dabei selbst als Besucht-Marker. */
function _removeDeadGroup(board, startIdx) {
  const color = board[startIdx];
  let head = 0, tail = 0, removed = 1;
  _groupQueue[tail++] = startIdx; board[startIdx] = 0;
  while (head < tail) {
    const g = _groupQueue[head++];
    for (const n of NEIGHBORS[g])
      if (board[n] === color) { board[n] = 0; _groupQueue[tail++] = n; removed++; }
  }
  return removed;
}

const _rdgChecked = new Int32Array(BOARD_SIZE);

function removeDeadGroups(board, color, nearIdx) {
  const epoch = _nextFfEpoch();
  let captured = 0;
  if (nearIdx !== undefined) {
    /* Heißer Pfad (pro Kandidat/Rollout-Ply): lebende Nachbargruppen kosten
       nur noch einen Early-Exit-Scan, keine Arrays. Das _rdgChecked-Dedupe
       markiert nur den Startstein — trifft ein zweiter Nachbar dieselbe
       lebende Gruppe, kostet das einen weiteren billigen Scan, mehr nicht. */
    for (const n of NEIGHBORS[nearIdx]) {
      if (board[n] !== color || _rdgChecked[n] === epoch) continue;
      _rdgChecked[n] = epoch;
      if (countLiberties(board, n, 1) > 0) continue;
      captured += _removeDeadGroup(board, n);
    }
  } else {
    /* Ganzes-Brett-Variante (selten: Scoring/UI): floodFill markiert die
       komplette Gruppe als geprüft — sonst würde jeder Stein einer großen
       lebenden Gruppe einen eigenen Scan auslösen (O(Gruppe²)). */
    for (let i = 0; i < BOARD_SIZE; i++) {
      if (board[i] !== color || _rdgChecked[i] === epoch) continue;
      const {group, liberties} = floodFill(board, i);
      for (const g of group) _rdgChecked[g] = epoch;
      if (liberties.length === 0)
        for (const g of group) { board[g] = 0; captured++; }
    }
  }
  return captured;
}

/* Fix #8 (GLM): Diagonal-Prüfung gegen False Eyes. Ein Punkt kann orthogonal
   komplett von eigenen Steinen umgeben sein und trotzdem kein echtes Auge —
   wenn der Gegner genug Diagonalen kontrolliert, sind die umgebenden Steine
   verbindungslos und fangbar. Standard-Go-Regel: im Zentrum ist max. 1
   gegnerische Diagonale erlaubt, am Rand/in der Ecke keine. Ohne diese
   Prüfung markierte resolveLifeAndDeath tote Gruppen als lebendig →
   falscher Endstand. */
function _diagIsTrueEye(board, candIdx, color) {
  const x = xOf(candIdx), y = yOf(candIdx);
  const opp = color === 1 ? 2 : 1;
  let oppDiag = 0;
  const corners = [[x-1,y-1],[x+1,y-1],[x-1,y+1],[x+1,y+1]];
  for (const [cx, cy] of corners) {
    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) continue;  /* außerhalb zählt nicht als Gegner */
    if (board[cy * SIZE + cx] === opp) oppDiag++;
  }
  const edge = x===0||x===SIZE-1||y===0||y===SIZE-1;
  return oppDiag <= (edge ? 0 : 1);   /* Ecke ist Teilmenge von edge */
}

function findEyes(board, group, color) {
  const eyes = [], candidates = new Map();
  for (const g of group)
    for (const n of NEIGHBORS[g])
      if (board[n] === 0 && !candidates.has(n)) candidates.set(n, n);
  for (const candIdx of candidates.keys()) {
    let isEye = true, own = 0;
    for (const n of NEIGHBORS[candIdx]) {
      const cell = board[n];
      if (cell === color || (cell === 0 && candidates.has(n))) own++;
      else { isEye = false; break; }
    }
    const x = xOf(candIdx), y = yOf(candIdx);
    const edge = x===0||x===SIZE-1||y===0||y===SIZE-1;
    const corner = (x===0||x===SIZE-1)&&(y===0||y===SIZE-1);
    if (isEye && own >= (corner?2:edge?3:4) && _diagIsTrueEye(board, candIdx, color))
      eyes.push(candIdx);
  }
  return eyes;
}

/* ═══ Benson-Analyse: bewiesenes Leben, bewiesener Tod ═══════════════
   Benson (1976): Eine Menge von Ketten ist bedingungslos lebendig
   (pass-alive) — unfangbar, selbst wenn der Besitzer nie wieder zieht —
   genau dann, wenn jede Kette mindestens zwei »vitale« Regionen hat.
   Eine Region (maximal zusammenhängende Nicht-color-Punkte) ist vital
   für Kette k, wenn JEDER leere Punkt der Region Freiheit von k ist.
   Iteration bis zum Fixpunkt: Ketten mit <2 vitalen Regionen fliegen
   raus, Regionen mit rausgeflogenen Randketten ebenfalls.

   WICHTIG: Benson beweist nur EINE Richtung. Was übrig bleibt, ist
   nicht »tot«, sondern UNKLAR — eine Gruppe kann quicklebendig sein,
   ohne pass-alive zu sein. Daraus folgt die dreiwertige Klassifikation:
     · pass-alive                     → bewiesen lebendig
     · Gegner in kleiner Region, die  → bewiesen tot (kann nie ein Auge
       nur an pass-alive-Ketten grenzt  bilden: jeder leere Punkt grenzt
                                        dauerhaft an einen unfangbaren Stein)
     · alles andere                   → unklar, Heuristik entscheidet
   Grundsatz wie beim Ladder-Solver: niemals raten — Bewiesenes exakt,
   der Rest bleibt bei der bestehenden Heuristik. Klassifiziert werden
   GRUPPEN (Ketten), nicht Punkte; die Punkt-Arrays unten sind nur die
   Ablage des Ketten-Status.

   bensonClassify(board) stempelt epochenbasiert (kein fill nötig):
     _bnAlive[i] === Rückgabe-Epoche → Stein i gehört zu pass-alive-Kette
     _bnDead[i]  === Rückgabe-Epoche → Stein i ist beweisbar tot        */
const _bnChainId   = new Int32Array(BOARD_SIZE);
const _bnRegionId  = new Int32Array(BOARD_SIZE);
const _bnChainMark = new Int32Array(BOARD_SIZE);
const _bnAlive     = new Int32Array(BOARD_SIZE);
const _bnDead      = new Int32Array(BOARD_SIZE);
/* Todgeboren-Stempel für LEERE Punkte, indiziert nach der Farbe des
   hypothetischen Steins: _bnBornDead[c][i] === Epoche → ein Stein der
   Farbe c auf Punkt i wäre beweisbar tot (Punkt liegt in einer kleinen
   Region, die nur an gegnerische pass-alive-Ketten grenzt — dort kann
   nie ein Auge entstehen, und schlagen kann der Zug auch nichts, weil
   pass-alive-Ketten immer ≥2 Freiheiten haben). */
const _bnBornDead  = [null, new Int32Array(BOARD_SIZE), new Int32Array(BOARD_SIZE)];
const _bnAdjTmp    = [0, 0, 0, 0];
let _bnEpoch = 0;

function _bensonForColor(board, color, epoch) {
  const opp = color === 1 ? 2 : 1;
  _bnChainId.fill(-1);
  _bnRegionId.fill(-1);
  _bnChainMark.fill(-1);

  /* 1. Ketten der Farbe labeln */
  let chainCount = 0;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] !== color || _bnChainId[i] !== -1) continue;
    let head = 0, tail = 0;
    _groupQueue[tail++] = i; _bnChainId[i] = chainCount;
    while (head < tail) {
      const g = _groupQueue[head++];
      for (const n of NEIGHBORS[g])
        if (board[n] === color && _bnChainId[n] === -1) { _bnChainId[n] = chainCount; _groupQueue[tail++] = n; }
    }
    chainCount++;
  }
  if (!chainCount) return;

  /* 2. Regionen labeln + Metadaten in einem Durchlauf:
     vitalChains  = Schnittmenge der angrenzenden Ketten über alle LEEREN
                    Punkte (≤4 Kandidaten nach dem ersten Punkt → billig)
     borderChains = alle angrenzenden Ketten (dedupliziert via _bnChainMark)
     small        = jeder leere Punkt grenzt an mindestens eine Kette     */
  const vitalChains = [], borderChains = [], regionSmall = [];
  let regionCount = 0;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] === color || _bnRegionId[i] !== -1) continue;
    const r = regionCount++;
    let head = 0, tail = 0;
    _groupQueue[tail++] = i; _bnRegionId[i] = r;
    let vital = null;                 /* null = noch kein leerer Punkt gesehen */
    const border = [];
    let small = true, hasEmpty = false;
    while (head < tail) {
      const p = _groupQueue[head++];
      let adjCount = 0;
      for (const n of NEIGHBORS[p]) {
        const c = board[n];
        if (c === color) {
          const k = _bnChainId[n];
          _bnAdjTmp[adjCount++] = k;
          if (_bnChainMark[k] !== r) { _bnChainMark[k] = r; border.push(k); }
        } else if (_bnRegionId[n] === -1) {
          _bnRegionId[n] = r; _groupQueue[tail++] = n;
        }
      }
      if (board[p] === 0) {
        hasEmpty = true;
        if (adjCount === 0) { small = false; vital = []; }   /* leerer Punkt ohne Ketten-Nachbar → für niemanden vital */
        else if (vital === null) {
          vital = [];
          for (let a = 0; a < adjCount; a++) if (vital.indexOf(_bnAdjTmp[a]) < 0) vital.push(_bnAdjTmp[a]);
        } else if (vital.length) {
          for (let v = vital.length - 1; v >= 0; v--) {
            let found = false;
            for (let a = 0; a < adjCount; a++) if (_bnAdjTmp[a] === vital[v]) { found = true; break; }
            if (!found) vital.splice(v, 1);
          }
        }
      }
    }
    vitalChains.push(hasEmpty && vital ? vital : []);
    borderChains.push(border);
    regionSmall.push(small && hasEmpty);
  }

  /* 3. Benson-Fixpunkt als Kill-Kaskade: Kette stirbt → ihre Randregionen
     werden ungültig → deren Vitalitäts-Zählungen sinken → weitere Ketten
     sterben. Äquivalent zur iterativen Formulierung, aber ein Durchlauf. */
  const vitalCount  = new Int32Array(chainCount);
  const chainAlive  = new Uint8Array(chainCount).fill(1);
  const regionAlive = new Uint8Array(regionCount).fill(1);
  const borderOf = new Array(chainCount);
  for (let k = 0; k < chainCount; k++) borderOf[k] = [];
  for (let r = 0; r < regionCount; r++) {
    for (const k of vitalChains[r]) vitalCount[k]++;
    for (const k of borderChains[r]) borderOf[k].push(r);
  }
  const killQ = [];
  for (let k = 0; k < chainCount; k++) if (vitalCount[k] < 2) { chainAlive[k] = 0; killQ.push(k); }
  while (killQ.length) {
    const k = killQ.pop();
    for (const r of borderOf[k]) {
      if (!regionAlive[r]) continue;
      regionAlive[r] = 0;
      for (const j of vitalChains[r])
        if (chainAlive[j] && --vitalCount[j] < 2) { chainAlive[j] = 0; killQ.push(j); }
    }
  }

  /* 4. Ergebnis stempeln. Tot = Gegnerstein in einer KLEINEN Region, die
     überlebt hat (alle Randketten pass-alive): dort kann nie ein Auge
     entstehen, weil jeder leere Punkt dauerhaft an einem unfangbaren
     Stein liegt. Regionen ohne Randketten (offene Fläche) zählen nie. */
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (board[i] === color) {
      if (chainAlive[_bnChainId[i]]) _bnAlive[i] = epoch;
    } else {
      const r = _bnRegionId[i];
      if (regionAlive[r] && regionSmall[r] && borderChains[r].length) {
        if (board[i] === opp) _bnDead[i] = epoch;
        else _bnBornDead[opp][i] = epoch;   /* leerer Punkt: opp-Stein hier wäre todgeboren */
      }
    }
  }
}

/* Dritter Epochen-Zähler, gleiches 32-Bit-Problem wie _ffEpoch/_areaEpoch.
   _bnEpoch markiert _bnAlive/_bnDead/_bnBornDead (alles Int32Array) und
   wird pro bensonClassify-Aufruf erhöht. Anders als _bnChainId/_bnRegionId/
   _bnChainMark werden diese Arrays NICHT pro Aufruf mit fill() genullt —
   sie leben bewusst über Aufrufe hinweg und werden per Epoche-Vergleich
   gelesen (_bnAlive[i] === epoch). Nach einem Überlauf kippt der
   gespeicherte Wert negativ, der Vergleich schlägt dauerhaft fehl:
   pass-alive-Gruppen würden als nicht-lebendig gelesen — Benson wäre
   lautlos wirkungslos, ohne dass irgendetwas abstürzt. */
function bensonClassify(board) {
  if (++_bnEpoch >= 0x7fffffff) {
    _bnEpoch = 1;
    _bnAlive.fill(0);
    _bnDead.fill(0);
    _bnBornDead[1].fill(0);
    _bnBornDead[2].fill(0);
  }
  const epoch = _bnEpoch;
  _bensonForColor(board, 1, epoch);
  _bensonForColor(board, 2, epoch);
  return epoch;
}

/* ═══ Tote Steine am Partieende (für die Auszählung) ═══════════════════
   Gibt ein Uint8Array zurück, 1 = Stein ist tot. Beurteilt GRUPPEN, nicht
   einzelne Ketten: Ketten derselben Farbe, die sich eine Freiheit teilen,
   bilden einen Verband (am Partieende ist so eine Lücke keine Schnitt-
   stelle mehr). Ein Auge ist eine leere Region, die nur an Steine des
   Verbands grenzt -- die Region als Ganzes, nicht jeder ihrer Punkte.
     lebt: eine Kette Benson-lebendig, oder zwei Augen, oder ein Auge mit
           mindestens AUGE_GROSS Punkten oder mit 4 bis 5 Punkten ohne
           Nakade-Form (augeTeilbar), oder der Verband grenzt an eine
           gemischte Region ab OFFEN_GROSS Punkten (dann ist er nicht
           eingeschlossen; das schützt unfertige Stellungen, etwa nach einer
           Aufgabe, in denen kaum eine Region nur an eine Farbe grenzt)
     tot:  Benson-tot; sonst der schwächste übrige Verband (wenigste Augen,
           dann wenigste Freiheiten, dann wenigste Steine), danach wird
           neu gerechnet, bis jeder übrige Verband lebt.
   Einer nach dem anderen, weil tote Steine im eigenen Gebiet dessen
   Regionen an zwei Farben grenzen lassen: Erst wenn der tote Stein weg
   ist, wird das Gebiet zum Auge. Der schwächste ist fast immer der tote
   Eindringling, nicht die große Gruppe drumherum.
   Ersetzt die alte Regel je Kette (≤ 3 Freiheiten ohne Auge, ≤ 2 mit
   einem), die lebende Randsteine entfernte und jeden Punkt eines
   Zwei-Punkte-Auges als eigenes Auge zählte (docs/zaehlung.md).
   Seki erkennt die Regel nicht: Von zwei Gruppen ohne zwei Augen, die
   sich Freiheiten teilen, stirbt die schwächere. */
const AUGE_GROSS = 6, OFFEN_GROSS = 40;
/* Ein Auge mit 4 oder 5 Punkten teilt der Besitzer in zwei, auch wenn der
   Gegner zuerst hineinsetzt -- außer bei den Nakade-Formen: Quadrat und
   Pyramide (4 Punkte), bauchige Fünf und Kreuz (5). Ohne Drehtabellen
   erkennbar: Pyramide und Kreuz haben einen Punkt, der an alle übrigen
   grenzt; Quadrat und bauchige Fünf enthalten einen 2×2-Block.
   Vorher galt ein einzelnes Auge erst ab AUGE_GROSS Punkten als lebendig:
   Eine Gruppe mit einem T-förmigen Fünf-Punkte-Auge starb, die Partie vom
   13.10. (stellungen/auge-479.sgf) zählte W+304,5 statt B+93,5. */
function augeTeilbar(punkte) {
  const n = punkte.length;
  if (n < 4 || n > 5) return false;
  const drin = new Set(punkte);
  for (const p of punkte) {
    let k = 0;
    for (const q of NEIGHBORS[p]) if (drin.has(q)) k++;
    if (k === n - 1) return false;
    const x = p % SIZE, y = (p - x) / SIZE;
    if (x < SIZE - 1 && y < SIZE - 1 && drin.has(p + 1) && drin.has(p + SIZE) && drin.has(p + SIZE + 1)) return false;
  }
  return true;
}
function toteSteineAmEnde(board, augeGross = AUGE_GROSS, offenGross = OFFEN_GROSS) {
  const N = BOARD_SIZE, tot = new Uint8Array(N);
  const ep = bensonClassify(board);
  for (let i = 0; i < N; i++) if (board[i] && _bnDead[i] === ep) tot[i] = 1;
  const b = new Uint8Array(N), kette = new Int32Array(N), reg = new Int32Array(N);
  for (let runde = 0; runde < 200; runde++) {
    for (let i = 0; i < N; i++) b[i] = tot[i] ? 0 : board[i];
    /* Ketten */
    kette.fill(-1);
    const ketten = [];
    for (let i = 0; i < N; i++) {
      if (!b[i] || kette[i] >= 0) continue;
      const ff = floodFill(b, i), id = ketten.length;
      for (const q of ff.group) kette[q] = id;
      ketten.push({steine: ff.group, freiheiten: ff.liberties, benson: _bnAlive[i] === ep});
    }
    /* Leere Regionen: Größe und angrenzende Farben */
    reg.fill(-1);
    const regionen = [];
    for (let i = 0; i < N; i++) {
      if (b[i] || reg[i] >= 0) continue;
      const id = regionen.length, q = [i]; reg[i] = id;
      let rand = 0, k1 = -1, eineKette = true;
      for (let k = 0; k < q.length; k++) for (const n of NEIGHBORS[q[k]]) {
        if (!b[n]) { if (reg[n] < 0) { reg[n] = id; q.push(n); } }
        else {
          rand |= b[n];
          if (k1 < 0) k1 = kette[n]; else if (kette[n] !== k1) eineKette = false;
        }
      }
      regionen.push({groesse: q.length, rand, kette: -1, punkte: q, eineKette, leer: q.every(p => !board[p])});
    }
    /* Verbände: Ketten gleicher Farbe mit gemeinsamer Freiheit oder am
       selben Auge (Region, die nur an diese Farbe grenzt) */
    const vater = ketten.map((_, k) => k);
    const wurzel = k => { while (vater[k] !== k) k = vater[k] = vater[vater[k]]; return k; };
    const eins = (x, y) => { x = wurzel(x); y = wurzel(y); if (x !== y) vater[y] = x; };
    for (let i = 0; i < N; i++) {
      if (b[i]) continue;
      const erste = [-1, -1, -1], r = regionen[reg[i]];
      for (const n of NEIGHBORS[i]) {
        if (!b[n]) continue;
        const k = kette[n], f = b[n];
        if (erste[f] < 0) erste[f] = k; else eins(erste[f], k);
        if (r.rand === f) { if (r.kette < 0) r.kette = k; else eins(r.kette, k); }
      }
    }
    const verb = new Map();
    for (let k = 0; k < ketten.length; k++) {
      const v = wurzel(k);
      if (!verb.has(v)) verb.set(v, {ketten: [], augen: 0, gross: false, offen: false, benson: false, frei: new Set(), steine: 0});
      const V = verb.get(v), K = ketten[k];
      V.ketten.push(k); V.steine += K.steine.length; if (K.benson) V.benson = true;
      for (const l of K.freiheiten) V.frei.add(l);
    }
    /* Offen: grenzt an eine gemischte Region ab offenGross Punkten */
    for (let i = 0; i < N; i++) {
      if (!b[i]) continue;
      for (const n of NEIGHBORS[i]) if (!b[n] && regionen[reg[n]].rand === 3 && regionen[reg[n]].groesse >= offenGross) {
        verb.get(wurzel(kette[i])).offen = true; break;
      }
    }
    for (const r of regionen) {
      if ((r.rand !== 1 && r.rand !== 2) || r.kette < 0) continue;
      const V = verb.get(wurzel(r.kette));
      V.augen++; if (r.groesse >= augeGross || (r.eineKette && r.leer && augeTeilbar(r.punkte))) V.gross = true;
    }
    let schwach = null;
    for (const V of verb.values()) {
      if (V.benson || V.augen >= 2 || V.gross || V.offen) continue;
      if (!schwach || V.augen < schwach.augen
          || (V.augen === schwach.augen && (V.frei.size < schwach.frei.size
              || (V.frei.size === schwach.frei.size && V.steine < schwach.steine)))) schwach = V;
    }
    if (!schwach) break;
    for (const k of schwach.ketten) for (const q of ketten[k].steine) tot[q] = 1;
  }
  return tot;
}

function coordToLabel(x, y) { return `${COL_LETTERS[x]}${SIZE-y}`; }

  /* Pass-Schwellen. wantsToPass (getAIMove) ist eine ODER-Verknüpfung: Zug > 40
     und bester Kandidatenwert < passMinMc40, oder Zug > 80 und < passMinMc80,
     oder Zug > 120 und < passMinMc120, oder Zug > 150 und < passMinMc150. Mit
     −50 / 20 / 8 / 10 sind 120 und 150 wirkungslos: Was sie auslösen, löst die
     Stufe bei 80 schon aus (8 und 10 liegen unter 20). Belegt durch eine
     Negativkontrolle, beide auf −1000: 30 von 30 Partien Zug für Zug gleich.
     Die Werte stammen aus einer Zeit mit Zugwerten in den Zehnern. Heute liegt
     der beste Kandidat nach Zug 80 im Median bei 906 und fällt nur im letzten
     Zug einer Partie unter 20 (auswertung/pass-sonde.js).
     GEMESSEN, 240 Paare gegen GNU Go (docs/parameter-reihe.md): die Stufe bei
     80 auf 300 −1,6 [−3,8; +0,6], alle Schwellen auf −50 +0,2 [−0,6; +1,0].
     Die Höhe ändert den Endstand nicht, nur wann die KI aufhört (28 Züge
     kürzer bzw. 14 länger). Bleibt, wie sie ist. */
  passMinMc40:      -50,
  passMinMc80:       20,
  passMinMc120:       8,
  passMinMc150:      10,
  /* Augenschutz: kein Zug auf einen Punkt, der ein eigenes echtes Auge ist
     (alle orthogonalen Nachbarn eigene Steine, Diagonalen wie
     _diagIsTrueEye), ausser eine angrenzende eigene Kette steht im Atari.
     1 = an der Wurzel (alle Stufen), 2 = zusaetzlich in MCTS-Knoten und
     Rollouts. 0 = aus. Anlass: gegen GNU Go fuellte die KI nach dessen Pass
     ihre eigenen Augen, bis jede Gruppe nur noch eines hatte (W+370,5);
     im Selbstspiel fuellt sie in rund 40 % der Partien ein echtes Auge.
     Siehe docs/endspiel-augen.md. GEMESSEN (§6): mit passUnabwendbar 1
     gegen GNU Go Endstand +217 Punkte (p = 3e-17), im Selbstspiel 53,9 %

  augenSchutz:        2,
  /* Pass trotz grossem Gegnerzug: Die Pass-Pruefung verweigert den Pass,
     wenn der beste Gegnerzug mehr als passGainThreshold bringt -- auch dann,
     wenn kein eigener Zug ihn verhindern kann (Schlag einer toten Gruppe).
     1 = vorher pruefen, ob einer der besten eigenen Zuege (oder der Punkt
     des Gegnerzugs selbst) den Gegnerzug unter die Schwelle drueckt; wenn

  passUnabwendbar:    1,
  /* Gegnerwert: Jeder Kandidat bekommt gegnerWert x den Wert, den derselbe

     Gegner genau den Punkt nahm, den GNU Go fuer die KI vorschlug.
     Die Pass-Pruefung sieht die Werte ohne diesen Aufschlag. 0 = aus.

  gegnerWert:         0,
  /* Nur der Gebietsanteil davon: gegnerGebiet x gebietZug x Bouzy-Gewinn des

  gegnerGebiet:       0,
  /* Krisenkandidaten: Rettung aus dem Atari und Schlaege bekommen mindestens
     den Wert des besten Kandidaten. 0 = aus. Siehe docs/gegnerwert.md. */
  krisenKandidaten:   0,
  /* Taktischer Leser in der Zugwahl: 1 = Rettung eigener fangbarer Ketten
     (2+ Steine, bis 3 Freiheiten) an die Spitze, 2 = zusaetzlich Fang
     gegnerischer. 0 = aus. Gemessen: Selbstspiel 62,8 % und 58,1 %, gegen
     GNU Go -30,5 und (ausgespielt) -6,3 Punkte. Die Ketten leben danach
     nicht laenger, eine taktische Rettung schafft keine Augen. Kein

  leseRettung:        0,
  /* Lese-Verzicht: kein eigener Zug, nach dem der taktische Leser die

     +56,1 Punkte im Endstand ueber 60 Paare (p = 0,00007), im Selbstspiel
     72,8 % ueber 360 Partien (p = 5e-18). Default 1. 0 = altes Verhalten. */
  leseVerzicht:       1,
  /* Atari-Verzicht: Auch ein Zug, der Atari gibt, faellt unter den
     Lese-Verzicht, wenn der Leser die eigene Kette danach faengt und jedes
     Ziel des Ataris entkommt (leseVerteidigung). Ein Einwurf, dessen Ziel
     danach gefangen ist (Snapback), bleibt erlaubt. Anlass: Gegen GNU Go
     setzen 4,5 Atari-Zuege je Partie ab Zug 100 einen Stein, dessen Kette
     der Leser danach faengt; 98 % davon sind verschenkt
     (docs/atari-verschenkt.md). Wirkt nur mit leseVerzicht. Gemessen:
     gegen GNU Go +2,4 Punkte (p = 0,78), im Selbstspiel 50,6 % (p = 0,83);
     kein Default. 0 = aus, bitgenau. */
  atariVerzicht:      0,
  aiTimeBudget:    1800,
  rolloutWeight:    0.65,
  scoreWeight:      0.35,
  rolloutSample:     32,
  /* Compute-Budget (Hard-KI) — FIX Bug 3: war komplett vergessen */
  candOpen: 8, rollOpen: 3, depthOpen: 10,
  candMid: 5, rollMid: 3, depthMid: 12,
  candMidMax: 12, rollMidMin: 2, depthMidMax: 30,
  candEnd: 8, rollEndMin: 4, rollEnd: 6, depthEnd: 20, depthEndMax: 50,
  crisisCand: 4, crisisRoll: 5, crisisDepth: 20,
  /* MoE Soft-Gating: Experten überblenden statt hart umschalten.
     GEMESSEN, 240 Paare gegen GNU Go (docs/parameter-reihe.md): 0 (harte

  phaseBlendWidth:    8,
  /* MCTS-PUCT (Schwer-KI) — alternativer Such-Ansatz, A/B via useMCTS */
  useMCTS:            1,
  puctC:            1.4,
  mctsRootChildren:  16,
  mctsChildren:       8,
  mctsRolloutDepth:  24,
  /* Feste Simulationszahl je Zug statt Zeitbudget. 0 = aus, dann entscheidet

     Nur fuer Messungen. Mit einem Zeitbudget ist die Suche NICHT
     reproduzierbar: die Zahl der Simulationen haengt an der Maschinenlast,
     also verbraucht derselbe Seed unterschiedlich viele Zufallszahlen und die

     zweimal dieselbe Konfiguration: einmal 2:0, einmal 1:1.

     Damit war jede Identitaetskontrolle unmoeglich -- also genau die
     Kontrolle, mit der ein Dosisreihen-Arm belegt, dass er die unveraenderte
     Engine spielt. Mit festen Sims stimmen zwei Laeufe Zug fuer Zug ueberein.

     Im Spielbetrieb bleibt 0 richtig: ein Mensch wartet Sekunden, keine
     Simulationen, und auf langsamen Geraeten wuerde eine feste Zahl die
     Bedenkzeit unkontrolliert dehnen. Wirkt nur im MCTS-Zweig (useMCTS >= 1);
     der alte Kandidaten-Pfad behaelt sein Zeitbudget. */
  mctsFixedSims:      0,
  /* Robustheitsparameter, KEINE Wertebereichs-Skalierung — trotz des Namens.
     v = tanh(evaluateBoard / scale) staucht große Beträge; das dämpft einzelne
     Ausreißer-Rollouts, bevor sie den Knotenmittelwert dominieren (Winsorizing).
     Kleiner = stärkere Dämpfung, aber irgendwann sättigt alles und "klar
     gewonnen" ist nicht mehr von "knapp vorn" unterscheidbar. Daher ein Optimum.
     Gemessene Kurve (Kandidat gegen 350, je 40 gepaarte Partien):
       100 → 45 % · 150 → 67.5 % · 200 → 62.5 % · 250 → 60 %
       300 → 52.5 % · 500 → 45 % · 1000 → 32 % (100 Partien, p = 0.0004)
     Plateau 150–250, Abfall zu beiden Seiten. Gewählt wurde die Mitte des
     Plateaus, nicht der höchste Einzelpunkt (Winner's Curse). Bestätigungslauf
     mit frischem Seed: 40:20 (66.7 %, p = 0.013), Komi-0 44:16 (73.3 %),
     zusammen mit dem Erstlauf 65:35 über 100 Partien (65 %, p = 0.0035).
     Kopplung an resignQ — GEPRÜFT, siehe dort: Die kleinere Skala erzeugt
     größere |Q| und lässt die Aufgabeschwelle früher greifen (in Brettpunkten
     von −641 auf −366). Gemessen: kostet nichts. */
  mctsValueScale:   200,
  mctsMaxDepth:      60,
  /* RAVE/AMAF + Tree-Reuse — Statistik-Hebel ohne Training.
     GEMESSEN, 240 Paare gegen GNU Go bei 120 Simulationen (docs/parameter-
     reihe.md): raveK 30 −1,4 [−9,8; +7,0], 3000 −0,4 [−8,1; +7,2]; RAVE ganz
     aus (raveEnabled 0) +3,6 [−4,6; +11,7]. Kein Hebel; RAVE nützt hier
     höchstens rund 5 Punkte. */
  raveEnabled:         1,    // 0 = aus, reines PUCT wie vorher
  raveK:             300,    // AMAF-Einfluss; höher = länger stark gewichtet
  mctsTreeReuse:       1,    // 0 = aus, immer frischer Baum
  /* Frische Wurzel bei Tree-Reuse: Uebernimmt die Suche den Teilbaum des
     vorigen Zuges, stammen dessen Wurzelkinder aus quickEval (mctsChildren
     Stueck, im vorigen Zug expandiert). Die Kandidatenliste von getAIMove
     filtert sie dann nur noch nach Legalitaet. Mit 1 werden die
     Wurzelkinder neu aus der Kandidatenliste gebildet (mctsRootChildren,
     Prior aus evaluateMove); Besuche, Werte, Teilbaeume und AMAF-Zahlen
     gleicher Zuege werden aus dem alten Baum uebernommen. Anlass:
     docs/verschenkt-warum.md. Gemessen (docs/wurzel-frisch.md): gegen GNU Go
     +25,7 Punkte im Endstand ueber 60 Paare (p = 0,021), im Selbstspiel
     55,3 % ueber 360 Partien (p = 0,045). Default 1. 0 = altes Verhalten. */
  wurzelFrisch:        1,
  /* Rettungsbonus in quickEval: +80 je Nachbarstein einer eigenen Kette mit
     hoechstens zwei Freiheiten. quickEval waehlt die Zuege der Rollouts und
     die Kinder innerer Knoten; mit dem Bonus verlaengern beide Seiten dort
     schwache Ketten, auch wenn die Kette danach so schwach bleibt
     (docs/verschenkt-warum.md). 1 = Bonus nur, wenn die Kette nach dem Zug
     mindestens drei Freiheiten hat. 0 = aus, bitgenau. Gemessen
     (docs/quick-rettung.md): gegen GNU Go -14,9 Punkte (p = 0,13), im
     Selbstspiel 51,9 % (p = 0,46); kein Default. */
  quickRettung:        0,
  /* PolicyNet — FIX Bug 5: wurde referenziert aber nie definiert.
     netMaxBlend steht auf 0: das Netz lernt mit, steuert aber nicht.
     Grund ist nicht Vorsicht, sondern eine Messung. Der Netzbeitrag ist
     blendWeight · p · netScoreScale und phasenUNabhängig groß; die
     Entscheidungsspanne von evaluateMove ist es nicht (Eröffnung ≈ 15.8,
     Mittelspiel ≈ 160). Mit ungelernten, fast flachen Priors
     (1.36e-3 … 5.15e-3 gegen 2.77e-3 bei Gleichverteilung) überschreibt
     der Prior in der Eröffnung deshalb die Heuristik — in einer
     gemessenen Stellung fiel der bisherige beste Zug auf Rang 221.
     Vorher war der Wert 0.30, wirkte aber nie, weil das Netz durch den
     oben beschriebenen Kreis nie über gamesPlayed = 0 hinauskam. Ihn zu
     reparieren, ohne den Wert zu senken, hätte die Eröffnung ab der
     zweiten Partie mit Zufallsgewichten verrauscht. Hochsetzen, sobald
     ein A/B mit trainierten Gewichten einen Gewinn belegt — im
     Dashboard jederzeit möglich. */
  netMaxBlend:      0.00,
  netWarmup:         10,
  netLR:           0.001,
  netScoreScale:   5000,
  /* Trainings-Stabilisierung. Ohne sie divergiert dieses REINFORCE
     zuverlässig: bei negativem Advantage maximiert der Schritt −log p(a),
     und das ist nach unten unbeschränkt. Daraus wird eine Rückkopplung —
     größeres W1 → größere Aktivierungen → größere W2-Updates (dL·hidden)
     → größeres dH → größeres W1. Gemessen an einem Repro über diesen
     Block (400 Züge/Partie, netMaxBlend 0.09): in 5 von 6 Läufen
     nicht-finite Float32-Gewichte binnen 30 Partien, |W2| zuletzt Faktor
     ~10 pro Partie. Über save() landeten die NaN-Gewichte in localStorage
     und infizierten von dort jede weitere Sitzung.
     netGradClip deckelt jeden Layer-Schritt elementweise UND in der Norm
     (0 = aus). Die gemessene gesunde Update-Norm liegt bei 1e-2 bis
     3,5e-2, der Deckel greift also nur im Runaway und ändert normales
     Lernen nicht. netWeightDecay ist L2 pro Zug, einmal pro Partie als
     (1−wd)^Züge angewendet (0 = aus). */
  netGradClip:      1.00,
  netWeightDecay: 0.00001,
  /* Max-Norm-Projektion je Schicht, als Vielfaches der Initialisierungs-
     norm (0 = aus). Der Deckel oben begrenzt einen SCHRITT, diese Grenze
     den ZUSTAND — und erst das macht nicht-finite Gewichte strukturell
     unmöglich statt nur unwahrscheinlich: ‖W1‖ ≤ 4·9,2 begrenzt hidden,
     hidden begrenzt die Logits, und begrenzte Logits können in der Softmax
     kein Inf−Inf = NaN mehr erzeugen. Rechnerisch bleiben rund 30
     Zehnerpotenzen Abstand zur Float32-Grenze.
     4× ist reichlich: über 60 gemessene Trainingspartien bleibt eine
     gesunde Schicht unter 1,4× — die Projektion greift also nur im
     Runaway und verändert normales Lernen nicht. Sie skaliert eine Schicht
     nur, sie dreht sie nicht: die gelernte Richtung bleibt erhalten. */
  netMaxNorm:       4.00,
  /* First-Play-Urgency: Startwert für unbesuchte MCTS-Knoten (Fix #5) */
  mctsFPU:         0.45,
  /* Schärfe des PUCT-Priors. 0 = alter Rang-Prior (fast flach, verwirft Scores).
     Höher = Softmax über die tatsächlichen Heuristik-Scores.
     GEMESSEN, 240 Paare gegen GNU Go (docs/parameter-reihe.md): 0 −58,6, 1
     −42,2 und 9 +7,3 [+0,2; +14,5] gegen den Default 3; Siege 72, 100, 149
     (Default), 189 von 240. Der Prior trägt, und schärfer ist besser. 9 ist
     nach der vorab festgelegten Regel nur ein Hinweis (Endstand p = 0,045;
     Siege McNemar p = 5 · 10⁻⁶, sekundär).
     NACHGEMESSEN (docs/prior-nachmessung.md §8, Seed 212, 480 Paare): 9 gegen 3
     +7,3 [+2,1; +12,5], p = 0,0064, Siege 365 gegen 304. Im Selbstspiel
     gewinnt 9 aber nur 25,6 % (213 der 268 Niederlagen sind eigene
     Aufgaben). Nach der Regel kein Default, untersuchen; der Default bleibt 3.
     15 lag gegen GNU Go bei +12,7, 30 bei +3,9; 9 erst ab Zug 120 bringt nichts. */
  mctsPriorSharp:    3,
  /* Lokalität: Go ist überwiegend ein Antwortspiel. Ohne diesen Term bewertet
     die Heuristik einen Zug in der leeren Ecke exakt wie eine Antwort auf die
     akute Bedrohung nebenan — im 511-Zug-Log sichtbar als Streuspiel (Weiß
     sprang bei fast jedem Zug in eine andere Ecke, 191:4 Steine verloren).
     MESSUNG (20 Antwortzuege, Heuristik isoliert, Chebyshev-Distanz):
       0 -> 7.7 Ø | 80 -> 9.2 | 200 -> 9.1 | 400 -> 2.7 (18/20 lokal)
     Bis 200 bewegt der Bonus die Rangfolge nicht (Mittelspiel-Scores sind
     groesser), ab 400 dominiert er und die KI laeuft nur noch hinterher.
     Kein brauchbarer Zwischenwert -> additive Konstante ist die falsche Form,
     weil Eroeffnung (~40-95) und Mittelspiel (~Hunderte) andere Skalen haben.
     Default 0 = altes Verhalten, bis der A/B-Harness eine Aussage erlaubt. */
  localityBonus:     0,
  localityRadius:    4,
  /* Einflusskarte (Bouzy-Dilatation/-Erosion), einmal pro Zug an der Wurzel
     berechnet. Anlass: evaluateBoard und die Zugexperten sehen kein Gebiet;
     estimateArea zaehlt nur vollstaendig umschlossene Regionen und ist im
     Mittelspiel nicht angeschlossen. Ein Rahmen mit einer einzigen Luecke
     zaehlt dort nur noch seine Steine (gemessen: 47 statt 169). Die
     Einflusskarte sieht ihn weiter, aber anders: als Band um die Steine,
     nicht als gefuelltes Gebiet -- 69 der 121 Innenfelder, dazu 115 Felder
     ausserhalb des Rings. Die beiden Zahlen sind deshalb nicht vergleichbar.
       influenceInvade  Bonus fuer Zuege in der Einflusszone des GEGNERS
                        (Reduktion/Invasion)
       influenceOwn     Abzug fuer Zuege in der eigenen Zone (Selbstauffuellen)
     Beide additiv wie localityBonus -- dieselbe Skalenwarnung gilt: Eroeffnung

     Gemessen (docs/einflusskarte.md): beide auf 150, 360 Partien gegen 0 —
     45,0 % (p = 0,058), kein Staerkeeffekt, obwohl sich die Zuege in der
     Gegnerzone verdoppeln. Ohne falsche Aufgaben 49,4 % (docs/aufgaben.md).
     Deshalb aus.
     Default 0 = altes Verhalten, bitgenau (kein Zweig, keine Berechnung). */
  influenceInvade:   0,
  influenceOwn:      0,
  /* Gleichstandsbrecher im Endspiel-Experten. Anlass (docs/endspiel-gleichstand.md):
     evalEndgame bewertet Gebiet ueber estimateArea, das nur umschlossene
     Regionen zaehlt. Auf einem offenen Brett aendert ein ruhiger Zug daran
     nichts, alle ruhigen Zuege bekommen genau endAreaGain (30), und welche

     so 18 weisse Zuege in Folge (Zug 88-122) aus einer Gruppe von 140-170
     gleich bewerteten Zuegen.
     Der Term ordnet diese Gruppe: Aenderung der Bouzy-Bilanz (Felder der
     eigenen Zone minus Felder der Gegnerzone) durch den Zug, gegen die
     Wurzelstellung, auf +-1 begrenzt (Bilanz/20) und mit endTieBreak

     verschiedener Endspielwerte in jener Partie (6,7), bricht dort also nur

     nur an der Wurzel und nur bei aktivem Endspiel-Experten. Gemessen
     rund 10 ms je Zug (276 Kandidaten; die volle Karte je Kandidat kostete
     rund 40 ms). Die gehen NICHT
     vom Suchbudget ab (dessen Uhr startet erst in mctsPUCT), sie
     verlaengern nur die Antwortzeit.
     Gemessen (docs/endspiel-gleichstand.md): 1 gegen 0, zweimal 360
     Partien mit fester Simulationszahl — 57,2 % (p = 0,006), Wiederholung

     Nach der vorab festgelegten Regel (§8) deshalb Default 1 — der erste
     Eingriff dieser Messreihe, der die Engine messbar staerker macht.
     Wirkt in allen Stufen, die evaluateMove nutzen (auch Leicht/Mittel),
     gemessen nur fuer Schwer.
     0 = altes Verhalten, bitgenau (kein Zweig, keine Berechnung). */
  endTieBreak:       1,
  /* Raumrisiko im Laufkampf (docs/laufkampf.md). evaluateBoard sieht bei

     dass die Bewertung sank. Gemessen (laufkampf.md, §6): ob eine Kette mit

     Gemessen (laufkampf.md, §8), zusammen mit raumZug = 1, 360 Partien:

  raumGewicht:       0,
  /* Gegenstueck in der Zugbewertung an der Wurzel. raumGewicht allein
     verschiebt die Bewertung, aendert aber kaum die Zugwahl: K3 kommt aus

     der Partie vom 03.10., docs/laufkampf.md §7.2). raumZug bewertet jeden
     Kandidaten nach der Aenderung des Risikos der Ketten, die an der Wurzel
     4-7 Freiheiten haben: Bouzy-Karte und K3 NACH dem Zug, Risiko wie oben
     (ab 3 Freiheiten abwaerts STERBE_RAMPE, geschlagen = 1). Eigene Ketten
     sicherer oder fremde gefaehrdeter = Bonus, in Steinen mal
     captureWeight. In der Partie hob genau ein Zug K3 der Gruppe (M11 bei
     Zug 196, 0 -> 15); den soll die Wurzel kennen.
     Default 0 = altes Verhalten, bitgenau (kein Zweig, keine Berechnung). */
  raumZug:           0,
  /* Gebiet in der Stellungsbewertung (docs/gebiet.md). evaluateBoard kennt

     fuellte eigene Flaechen auf (docs/gnugo.md): eine lange Kette hat viele
     Freiheiten, leeres Gebiet zaehlt nichts. Der Term addiert
     gebietGewicht x (Felder der eigenen Bouzy-Zone - Felder der fremden),

     endTieBreak, hier in jeder Blattbewertung (rund 0,1 ms, gegen 4-8 ms je

     Berechnung). */
  gebietGewicht:     0,
  /* Gebiet in der Zugbewertung an der Wurzel: jeder Kandidat bekommt
     gebietZug x (Aenderung der Bouzy-Bilanz durch den Zug, aus Sicht des
     Ziehenden) -- wie endTieBreak, aber ungedeckelt und in allen Phasen,
