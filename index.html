<!-- Dritter extrahierbarer Block. Der Messrahmen (ab-harness.js) zieht sich
     shared-go-logic, worker-ai und policy-net zur Laufzeit aus dieser Datei;
     ohne id war das Netz im Harness schlicht nicht vorhanden, `globalThis
     .policyNet` blieb undefined und die Blend-Bedingung in getAIMove konnte
     nie feuern — ein A/B über netMaxBlend hätte strukturell 50 % geliefert.
     Der Block ist nicht DOM-frei (localStorage, getElementById); der Harness
     stellt beide Objekte als Schale bereit, statt hier zu verzweigen. -->
<script id="policy-net">
'use strict';

class PolicyNet {
  constructor() {
    this.IN  = 3971;   // 10 Feature-Layer: 2 Steine + 4 Lib + Atari + Ko + LetzterZug + Rand + Territorium
    this.HID = 128;    // mehr Lernkapazität
    this.OUT = 361;

    this.gamesPlayed = 0;
    this.wins        = 0;
    this.lastResult  = null;

    const he = n => Math.sqrt(2/n);
    this.W1 = this._rand(this.HID * this.IN,  he(this.IN));
    this.b1 = new Float32Array(this.HID);
    this.W2 = this._rand(this.OUT * this.HID, he(this.HID));
    this.b2 = new Float32Array(this.OUT);
    /* Referenz für die Max-Norm-Projektion: die erwartete Frobeniusnorm der
       He-Initialisierung, analytisch statt aus der konkreten Ziehung —
       damit die Grenze über Reloads und reset() hinweg dieselbe ist.
       Für Uniform(−s, s) mit n Elementen ist E‖·‖ = s·√(n/3). */
    const ref = (n, s) => s * Math.sqrt(n / 3);
    this._normRef1 = ref(this.HID * this.IN,  he(this.IN));
    this._normRef2 = ref(this.OUT * this.HID, he(this.HID));

    this._netPriors  = null;
    this._netHidden  = null;
    this._netInp     = null;
    this._netBlend   = 0;
    this._gameBuffer = [];
    this._trained    = false;
    this._lastMove   = null;
    /* Gesundheitszustand. Ein Netz, dessen forward() nicht-finite
       Wahrscheinlichkeiten liefert, hört sofort auf zu STEUERN
       (blendWeight → 0) — es lernt weiter, aber es kann keinen Zug mehr
       verderben und keinen NaN mehr in die Suche schieben. */
    this._healthy     = true;
    this._divergences = 0;

    if (this.load()) {
      console.log(`[PolicyNet] Geladen: ${this.gamesPlayed} Spiele · ${this.wins} Siege`);
    } else {
      console.log('[PolicyNet] Neue Gewichte initialisiert.');
    }
  }

  get blendWeight() {
    /* Der eine Schalter, der den kompletten Blend-Pfad stilllegt — im
       Hauptthread wie im Worker, denn dessen netBlend kommt aus genau
       diesem Getter (postMessage in requestAIMove). */
    if (!this._healthy) return 0;
    if (this.gamesPlayed < 2) return 0;
    return Math.min(PARAMS.netMaxBlend,
      (this.gamesPlayed / Math.max(1, PARAMS.netWarmup)) * PARAMS.netMaxBlend);
  }

  _rand(n, scale) {
    const a = new Float32Array(n);
    for (let i = 0; i < n; i++) a[i] = (Math.random()*2-1) * scale;
    return a;
  }

  /* Index des ersten NaN/Infinity, sonst -1. Bewusst eine Schleife statt
     .some(): sie liefert die Stelle mit, und die steht in jeder Meldung. */
  static _firstBad(a) {
    for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) return i;
    return -1;
  }

  /* Erster kaputter Gewichtswert über alle vier Tensoren, sonst null. */
  _badWeight() {
    for (const [name, a] of [['W1',this.W1], ['b1',this.b1], ['W2',this.W2], ['b2',this.b2]]) {
      const i = PolicyNet._firstBad(a);
      if (i >= 0) return {name, i, v: a[i]};
    }
    return null;
  }

  /* Max-Norm-Projektion einer Schicht (Gewichte + Bias als ein Tensor,
     denn hidden = b1 + W1·inp — ein davonlaufender Bias täte dasselbe wie
     davonlaufende Gewichte). Rein skalierend: sie begrenzt, wie GROSS eine
     Schicht werden darf, nicht, was sie gelernt hat. */
  _projectLayer(W, b, limit) {
    let n = 0;
    for (let i = 0; i < W.length; i++) n += W[i] * W[i];
    for (let i = 0; i < b.length; i++) n += b[i] * b[i];
    n = Math.sqrt(n);
    if (!(n > limit)) return 0;   /* NaN fällt hier durch — dafür ist _badWeight da */
    const f = limit / n;
    for (let i = 0; i < W.length; i++) W[i] *= f;
    for (let i = 0; i < b.length; i++) b[i] *= f;
    return n;
  }

  /* Eine Meldung, die den Fall wirklich rekonstruierbar macht: Blend-Stand,
     Lernrate, Gewichtsspannen und die erste kaputte Stelle. */
  _diag(was, extra) {
    const spanne = a => {
      let mx = 0, nf = 0;
      for (let i = 0; i < a.length; i++) {
        const v = a[i];
        if (!Number.isFinite(v)) { nf++; continue; }
        const m = v < 0 ? -v : v;
        if (m > mx) mx = m;
      }
      return `max ${mx.toExponential(2)}, ${nf} nicht-finit`;
    };
    console.error(`[PolicyNet] ${was}`, Object.assign({
      gamesPlayed: this.gamesPlayed,
      wins:        this.wins,
      netBlend:    this.blendWeight,
      netMaxBlend: PARAMS.netMaxBlend,
      netWarmup:   PARAMS.netWarmup,
      netLR:          PARAMS.netLR,
      netGradClip:    PARAMS.netGradClip,
      netWeightDecay: PARAMS.netWeightDecay,
      netMaxNorm:     PARAMS.netMaxNorm,
      W1: spanne(this.W1), b1: spanne(this.b1),
      W2: spanne(this.W2), b2: spanne(this.b2)
    }, extra || {}));
  }

  boardToInput(board, color, lastMove = null, koPos = null) {
    const inp = new Float32Array(this.IN);
    const opp = color === 1 ? 2 : 1;
    // Layer 0-1: eigene / gegnerische Steine (0..721)
    for (let i = 0; i < 361; i++) {
      if      (board[i] === color) inp[i]     = 1;
      else if (board[i] === opp)   inp[361+i] = 1;
    }
    // Freiheiten pro Stein vorberechnen
    const liberties = new Uint8Array(361);
    const visited   = new Uint8Array(361);
    for (let i = 0; i < 361; i++) {
      if (board[i] === 0 || visited[i]) continue;
      const ff = floodFill(board, i);
      const L = ff.liberties.length;
      for (const g of ff.group) { visited[g] = 1; liberties[g] = L; }
    }
    // Layer 2-5: Freiheiten one-hot 1..4+ (722..2165)
    for (let i = 0; i < 361; i++) {
      if (board[i] === 0) continue;
      const lib = Math.min(Math.max(liberties[i], 1), 4);
      inp[722 + i * 4 + (lib - 1)] = 1;
    }
    // Layer 6: Atari (genau 1 Freiheit) (2166..2526)
    for (let i = 0; i < 361; i++) {
      if (board[i] && liberties[i] === 1) inp[722 + 361*4 + i] = 1;
    }
    // Layer 7: Ko-Position
    if (koPos !== null && koPos >= 0) inp[722 + 361*5 + koPos] = 1;
    // Layer 8: letzter Zug
    if (lastMove !== null) {
      const li = idx(lastMove.x, lastMove.y);
      inp[722 + 361*6 + li] = 1;
    }
    // Layer 9: Rand-Distanz (normalisiert)
    for (let i = 0; i < 361; i++) {
      const x = xOf(i), y = yOf(i);
      inp[722 + 361*7 + i] = Math.min(x, SIZE-1-x, y, SIZE-1-y) / (SIZE/2);
    }
    // Layer 10: einfaches eigenes Territorium
    for (let i = 0; i < 361; i++) {
      if (board[i] === color) { inp[722 + 361*8 + i] = 1; continue; }
      if (board[i] !== 0) continue;
      let ownT = true;
      for (const n of NEIGHBORS[i]) if (board[n] === opp) { ownT = false; break; }
      if (ownT) inp[722 + 361*8 + i] = 1;
    }
    return inp;
  }

  forward(inp) {
    const {HID, IN, OUT} = this;
    const h = new Float32Array(HID);
    for (let j = 0; j < HID; j++) {
      let s = this.b1[j], base = j*IN;
      for (let i = 0; i < IN; i++) s += this.W1[base+i] * inp[i];
      h[j] = s > 0 ? s : 0;
    }
    const logits = new Float32Array(OUT);
    let maxL = -Infinity;
    for (let k = 0; k < OUT; k++) {
      let s = this.b2[k], base = k*HID;
      for (let j = 0; j < HID; j++) s += this.W2[base+j] * h[j];
      if ((logits[k] = s) > maxL) maxL = s;
    }
    const probs = new Float32Array(OUT);
    let sumE = 0;
    for (let k = 0; k < OUT; k++) { probs[k] = Math.exp(logits[k]-maxL); sumE += probs[k]; }
    for (let k = 0; k < OUT; k++) probs[k] /= sumE;

    /* Die Stelle, an der divergierte Gewichte sichtbar werden. Wächst |W1|
       weiter, laufen erst hidden und dann die Logits über die Float32-
       Grenze; sobald maxL = Infinity ist, ist logits[k] − maxL = Inf − Inf
       = NaN und JEDE Wahrscheinlichkeit NaN. Von hier lief das NaN früher
       ungebremst weiter: Score-Blend → _mctsKids-Softmax (Z = NaN, also
       alle Priors NaN) → PUCT ohne wählbares Kind → TypeError auf best.idx.
       Der Pfad endet jetzt hier.
       Rückgabe im Fehlerfall: Gleichverteilung (hebt jeden Score um
       dieselbe Konstante, verschiebt also keine Rangfolge) und hidden =
       null, damit _backward diese Stichprobe gar nicht erst anfasst. */
    const bad = PolicyNet._firstBad(probs);
    if (bad >= 0) {
      if (this._healthy) {
        this._healthy = false;
        let hMax = 0;
        for (const v of h) if (Number.isFinite(v) && v > hMax) hMax = v;
        this._diag('forward() liefert nicht-finite Wahrscheinlichkeiten — das Netz steuert ab sofort nicht mehr mit.',
          {ersterIndex: bad, wert: probs[bad], maxLogit: maxL, sumE,
           hiddenMax: hMax, hiddenKaputt: PolicyNet._firstBad(h)});
        this.dashUpdate();
      }
      const u = new Float32Array(OUT).fill(1 / OUT);
      return {probs: u, hidden: null};
    }
    return {probs, hidden: h};
  }

  /* Ein REINFORCE-Schritt. Gibt zurück, ob die Stichprobe wirklich gelernt
     wurde — trainGame() zählt damit, wie viel einer Partie brauchbar war.

     Warum hier überhaupt gedeckelt wird: bei negativem Advantage maximiert
     dieser Schritt −log p(a), und das ist nach unten unbeschränkt. Der
     Fehler ist dabei nicht dL — das bleibt betragsmäßig unter |lr| — sondern
     das PRODUKT dL·hidden, mit dem W2 aktualisiert wird: hidden hängt an W1,
     W1 hängt über dH an W2. Diese Rückkopplung ließ |W2| zuletzt um Faktor
     ~10 pro Partie wachsen, bis Float32 überlief. Deshalb zwei Deckel je
     Schicht:
       · elementweise auf [−cap, cap] — fängt einzelne Ausreißer
       · auf die Norm des ganzen Schicht-Updates — fängt genau das Produkt
     Die Norm ist billig, weil beide Gewichts-Updates Rang 1 sind:
     ‖dL ⊗ hidden‖ = ‖dL‖·‖hidden‖ und ‖dH ⊗ inp‖ = ‖dH‖·‖inp‖. Die +1 sind
     die Bias-Anteile. Gemessen gesund liegt diese Norm bei 1e-2 … 3,5e-2,
     der Deckel (Standard 1) greift also nur im Runaway.
     Die Reihenfolge bleibt wie bisher: erst W2/b2 anwenden, dann dH aus dem
     BEREITS aktualisierten W2 rechnen. */
  _backward(inp, hidden, probs, moveIdx, reward) {
    const {HID, IN, OUT} = this;
    /* hidden === null kommt aus dem forward()-Schutz oben: solche
       Stichproben sind Rauschen, kein Trainingssignal. */
    if (!inp || !hidden || !probs) return false;
    if (!Number.isFinite(reward)) return false;
    let lr = PARAMS.netLR * reward;
    if (!Number.isFinite(lr)) return false;
    if (PolicyNet._firstBad(probs) >= 0 || PolicyNet._firstBad(hidden) >= 0) return false;

    /* Hier sitzt die eigentliche Divergenz — und deshalb steht sie vor den
       Deckeln. Bei negativem Advantage lautet der Schritt „mach das
       Gegenteil dieses Zuges", und dieses Ziel hat kein Optimum: p(a) → 0
       erreicht man nur mit ‖W‖ → ∞. Der Gradient für den gespielten Zug ist
       (1−p)·|lr| und schrumpft dabei NICHT — er bleibt bis zuletzt fast
       maximal. Ein Netz, das eine Niederlage verarbeitet, drückt also
       400 Züge lang mit voller Kraft in eine Richtung, die erst im
       Unendlichen ankommt. Genau das trieb hidden über die Float32-Grenze.
       Sobald ein Zug unwahrscheinlicher ist als ein zufälliger (1/361), ist
       nichts mehr zu verlernen; der Schritt wird proportional gedämpft und
       läuft glatt aus, statt hart abzuschneiden. Positive Advantages bleiben
       unberührt — dort bremst der Gradient (1−p) → 0 von selbst. */
    if (reward < 0) {
      const boden = 1 / OUT;
      const p = probs[moveIdx];
      if (!(p > 0)) return false;
      if (p < boden) lr *= p / boden;
    }

    const cap = PARAMS.netGradClip > 0 ? PARAMS.netGradClip : Infinity;

    /* ── Ausgabeschicht ──────────────────────────────────────────── */
    const dL = new Float32Array(OUT);
    let nL = 0;
    for (let k = 0; k < OUT; k++) {
      let g = -(probs[k] - (k===moveIdx ? 1 : 0)) * lr;
      if (g >  cap) g =  cap;
      if (g < -cap) g = -cap;
      dL[k] = g; nL += g * g;
    }
    let nHid = 0;
    for (let j = 0; j < HID; j++) nHid += hidden[j] * hidden[j];
    const normL = Math.sqrt(nL * (1 + nHid));
    if (normL > cap) { const f = cap / normL; for (let k = 0; k < OUT; k++) dL[k] *= f; }

    for (let k = 0; k < OUT; k++) {
      if (Math.abs(dL[k]) < 1e-9) continue;
      this.b2[k] += dL[k];
      const base = k*HID;
      for (let j = 0; j < HID; j++) this.W2[base+j] += dL[k] * hidden[j];
    }

    /* ── Versteckte Schicht ──────────────────────────────────────── */
    const dH = new Float32Array(HID);
    let nH = 0;
    for (let j = 0; j < HID; j++) {
      if (hidden[j] <= 0) continue;
      let g = 0;
      for (let k = 0; k < OUT; k++) g += this.W2[k*HID+j] * dL[k];
      if (g >  cap) g =  cap;
      if (g < -cap) g = -cap;
      dH[j] = g; nH += g * g;
    }
    let nInp = 0;
    for (let i = 0; i < IN; i++) nInp += inp[i] * inp[i];
    const normH = Math.sqrt(nH * (1 + nInp));
    if (normH > cap) { const f = cap / normH; for (let j = 0; j < HID; j++) dH[j] *= f; }

    for (let j = 0; j < HID; j++) {
      if (Math.abs(dH[j]) < 1e-9) continue;
      this.b1[j] += dH[j];
      const base = j*IN;
      for (let i = 0; i < IN; i++) this.W1[base+i] += dH[j] * inp[i];
    }
    return true;
  }

  trainGame(reward) {
    const buf = this._gameBuffer;
    if (!buf.length) { console.log('[PolicyNet] Kein Buffer — kein Training.'); return; }
    /* Fix #6: REINFORCE mit Baseline. Roher Reward (±1) verstärkt bei
       einer 90%-Winrate fast nur noch "mehr vom Gleichen" — die Baseline
       (erwarteter Reward aus der bisherigen Winrate) zentriert das Signal:
       ein Sieg bei 90% Winrate ist wenig Information (advantage ~0.2),
       eine Niederlage dagegen viel (advantage ~-1.8). Winrate ist schon
       persistiert, also kein neues Speicherfeld nötig. */
    const baseline = this.gamesPlayed > 0 ? (2 * this.wins / this.gamesPlayed - 1) : 0;
    const advantage = reward - baseline;
    let gelernt = 0, verworfen = 0;
    for (const {inp, probs, hidden, moveIdx} of buf) {
      if (this._backward(inp, hidden, probs, moveIdx, advantage)) gelernt++;
      else verworfen++;
    }

    /* L2 pro Zug, einmal pro Partie als (1−wd)^Züge angewendet — 554 000
       Multiplikationen statt 554 000 × Züge. Der Deckel in _backward
       verhindert den Überlauf (‖W‖ kann nur noch linear wachsen, nicht mehr
       exponentiell); der Zerfall gibt dem Ganzen einen Fixpunkt, statt es
       auf Dauer nur langsamer davonlaufen zu lassen. */
    const wd = PARAMS.netWeightDecay;
    if (wd > 0 && wd < 1 && gelernt) {
      const keep = Math.pow(1 - wd, gelernt);
      if (keep > 0 && keep < 1)
        for (const a of [this.W1, this.b1, this.W2, this.b2])
          for (let i = 0; i < a.length; i++) a[i] *= keep;
    }

    /* Harte Zustandsgrenze. Der Deckel in _backward bremst einen Schritt,
       verhindert aber nur den Überlauf, nicht den Weglauf: 400 gedeckelte
       Schritte pro Partie summieren sich weiter. Erst die Projektion hält
       die Gewichte dauerhaft in einem Bereich, in dem die Logits gar keine
       Float32-Grenze mehr erreichen können. */
    const mn = PARAMS.netMaxNorm;
    if (mn > 0) {
      const v1 = this._projectLayer(this.W1, this.b1, mn * this._normRef1);
      const v2 = this._projectLayer(this.W2, this.b2, mn * this._normRef2);
      if (v1 || v2)
        console.warn('[PolicyNet] Max-Norm griff — Schicht(en) zurückskaliert: '
          + (v1 ? `‖W1‖ ${v1.toExponential(2)} → ${(mn*this._normRef1).toExponential(2)} ` : '')
          + (v2 ? `‖W2‖ ${v2.toExponential(2)} → ${(mn*this._normRef2).toExponential(2)}` : ''));
    }

    /* Genau hier wurde der Fehler früher dauerhaft: save() schrieb die
       divergierten Gewichte nach localStorage, und ab dem nächsten Laden
       war jede Partie betroffen — auch nach einem Reload, auch im Worker.
       Jetzt wird VOR dem Speichern geprüft und ein kaputter Stand
       zurückgerollt statt weitergereicht. load() liefert exakt den letzten
       gespeicherten, also validierten Stand; erst wenn auch der fehlt oder
       das dreimal in Folge passiert, wird das Netz neu initialisiert. */
    const bad = this._badWeight();
    if (bad) {
      this._divergences++;
      this._diag(`Training divergiert (${bad.name}[${bad.i}] = ${bad.v}) — Partie verworfen.`,
        {advantage, zuege: buf.length, gelernt, verworfen, divergenzen: this._divergences});
      this._gameBuffer = [];
      if (this._divergences < 3 && this.load()) {
        this._healthy = true;
        console.warn('[PolicyNet] Letzter gültiger Stand wiederhergestellt '
          + `(${this.gamesPlayed} Spiele).`);
        this.dashUpdate();
      } else {
        console.warn('[PolicyNet] Kein gültiger Stand verfügbar — Netz wird zurückgesetzt.');
        this.reset();
      }
      return;
    }

    this._divergences = 0;
    this.gamesPlayed++;
    if (reward > 0) this.wins++;
    this.lastResult  = reward;
    this._gameBuffer = [];
    this.save();
    this.dashUpdate();
    const wr = Math.round(this.wins/this.gamesPlayed*100);
    console.log(`[PolicyNet] Spiel ${this.gamesPlayed}: ${reward>0?'Sieg ✓':'Niederlage ✗'} | Siege: ${wr}% | Blend: ${(this.blendWeight*100).toFixed(0)}%`
      + (verworfen ? ` | ${verworfen} von ${buf.length} Zügen ohne verwertbares Signal` : ''));
  }

  save() {
    /* Nie einen nicht-finiten Stand persistieren. Ohne diese Zeilen
       überlebte der Fehler jeden Reload und jede neue Partie. */
    const bad = this._badWeight();
    if (bad) {
      this._diag(`Speichern abgelehnt: ${bad.name}[${bad.i}] = ${bad.v}`);
      return false;
    }
    try {
      const enc = a => {
        const u = new Uint8Array(a.buffer); let s = '';
        for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
        return btoa(s);
      };
      localStorage.setItem('go_pnet', JSON.stringify({
        W1:enc(this.W1), b1:enc(this.b1),
        W2:enc(this.W2), b2:enc(this.b2),
        games:this.gamesPlayed, wins:this.wins
      }));
      return true;
    } catch(e) { console.warn('[PolicyNet] Speichern fehlgeschlagen:', e); return false; }
  }

  load() {
    try {
      const raw = localStorage.getItem('go_pnet');
      if (!raw) return false;
      const d = JSON.parse(raw);
      const dec = (s,C) => {
        const r=atob(s), b=new Uint8Array(r.length);
        for(let i=0;i<r.length;i++) b[i]=r.charCodeAt(i);
        return new C(b.buffer);
      };
      const w1=dec(d.W1,Float32Array), w2=dec(d.W2,Float32Array);
      // Dimensions-Check: alte 722×64-Gewichte verwerfen (neues Netz ist 3971×128)
      if (w1.length !== this.HID*this.IN || w2.length !== this.OUT*this.HID) {
        console.log('[PolicyNet] Gespeicherte Gewichte haben andere Dimension — starte neu.');
        return false;
      }
      const b1=dec(d.b1,Float32Array), b2=dec(d.b2,Float32Array);
      if (b1.length !== this.HID || b2.length !== this.OUT) {
        console.log('[PolicyNet] Gespeicherte Biases haben andere Dimension — starte neu.');
        return false;
      }
      /* Selbstheilung für bereits vergiftete Browser: ein Stand aus der
         Zeit vor dem Gradienten-Deckel kann NaN/Infinity enthalten. Ihn zu
         laden hieße, den Fehler in jede weitere Sitzung mitzunehmen. */
      for (const [nm, a] of [['W1',w1], ['b1',b1], ['W2',w2], ['b2',b2]]) {
        const i = PolicyNet._firstBad(a);
        if (i >= 0) {
          console.warn(`[PolicyNet] Gespeicherte Gewichte enthalten NaN/Infinity `
            + `(${nm}[${i}] = ${a[i]}) — verworfen, Netz startet mit frischen Gewichten.`);
          return false;
        }
      }
      this.W1=w1; this.b1=b1;
      this.W2=w2; this.b2=b2;
      this.gamesPlayed=d.games||0; this.wins=d.wins||0;
      this._healthy=true;
      return true;
    } catch(e) { return false; }
  }

  reset() {
    localStorage.removeItem('go_pnet');
    const he = n => Math.sqrt(2/n);
    this.W1=this._rand(this.HID*this.IN, he(this.IN));
    this.b1=new Float32Array(this.HID);
    this.W2=this._rand(this.OUT*this.HID, he(this.HID));
    this.b2=new Float32Array(this.OUT);
    this.gamesPlayed=0; this.wins=0; this.lastResult=null;
    this._gameBuffer=[]; this._trained=false;
    this._healthy=true; this._divergences=0;
    this.save(); this.dashUpdate();
    console.log('[PolicyNet] Zurückgesetzt.');
  }

  dashUpdate() {
    const el = id => document.getElementById(id);
    if (!el('pn-games')) return;
    el('pn-games').textContent = this.gamesPlayed;
    const wr = this.gamesPlayed > 0 ? Math.round(this.wins/this.gamesPlayed*100) : 0;
    el('pn-wins').textContent  = `${this.wins} (${wr}%)`;
    el('pn-blend').textContent = `${(this.blendWeight*100).toFixed(0)}%`;
    const res = el('pn-result');
    res.textContent = this.lastResult===null ? '—' : this.lastResult>0 ? '✓ Sieg' : '✗ Niederlage';
    res.style.color = this.lastResult===null ? '' : this.lastResult>0 ? 'var(--green)' : 'var(--red)';
    /* Ein stillgelegtes Netz muss sichtbar sein: sonst sieht man nur, dass
       der Einfluss auf 0 steht, und hält es für Warmup. */
    const hp = el('pn-health');
    if (hp) {
      hp.textContent  = this._healthy ? 'ok' : '⚠ divergiert (steuert nicht)';
      hp.style.color  = this._healthy ? '' : 'var(--red)';
    }
    const bar = el('pn-warmup-bar');
    if (bar) bar.style.width = Math.min(100, (this.gamesPlayed/Math.max(1,PARAMS.netWarmup))*100)+'%';
  }
}

globalThis.policyNet = new PolicyNet();
</script>

    const preset = PRESETS[name];
    if (!preset) return;
    if (preset.values === null) {
      dashReset();
    } else {
      Object.assign(PARAMS, preset.values);
      for (const [k,v] of Object.entries(preset.values)) {
        const inp = document.getElementById('pd-' + k);
        if (inp) {
          inp.value = v;
          inp.classList.toggle('changed', Math.abs(v - PARAMS_DEFAULT[k]) > 1e-9);
        }
      }
    }
    document.querySelectorAll('.pd-preset-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('pd-preset-' + name)?.classList.add('active');
    dashRefreshPhase();
  };

  window.dashToggle = function() {
    const body = document.getElementById('pdash-body');
    const arrow = document.getElementById('pdash-arrow');
    const open = body.classList.toggle('open');
    arrow.textContent = open ? '▾' : '▸';
    if (open) dashRefreshPhase();
  };

  window.dashSecToggle = function(id) {
    const rows = document.getElementById('pdsec-' + id);
    const arr  = document.getElementById('pdarr-' + id);
    const c = rows.classList.toggle('collapsed');
    arr.textContent = c ? '▸' : '▾';
  };

  window.dashCrdUpdate = function(key, input) {
    const raw = parseInt(input.value.replace(',','.'), 10);
    if (isNaN(raw) || raw <= 0) return;
    PARAMS[key] = raw;
    input.classList.toggle('changed', raw !== PARAMS_DEFAULT[key]);
  };

  window.dashTipToggle = function(tipId, btn) {
    const el = document.getElementById(tipId);
    if (!el) return;
    const show = el.classList.toggle('show');
    btn.classList.toggle('active', show);
  };

  window.dashHintToggle = function(hintId) {
    const el = document.getElementById(hintId);
    if (el) el.classList.toggle('show');
  };

  window.dashUpdate = function(key, input, isFloat) {
    const valStr = input.value.replace(',', '.');
    let raw = isFloat ? parseFloat(valStr) : parseInt(valStr, 10);
    if (isNaN(raw)) return;
    const mn = input.min !== '' ? parseFloat(input.min) : -Infinity;
    const mx = input.max !== '' ? parseFloat(input.max) : Infinity;
    raw = Math.min(mx, Math.max(mn, raw));
    PARAMS[key] = raw;
    const changed = Math.abs(raw - PARAMS_DEFAULT[key]) > 1e-9;
    input.classList.toggle('changed', changed);
    if (key === 'rolloutWeight' || key === 'scoreWeight') {
      /* Bidirektionaler Sync: egal welcher der beiden geändert wird,
         der jeweils andere folgt, sodass die Summe immer 1 bleibt.
         Vorher lief der Sync nur rollout→score; eine Änderung an
         scoreWeight ließ die Summe unbemerkt von 1 abweichen. */
      const clamped = Math.min(1, Math.max(0, raw));
      const other = key === 'rolloutWeight' ? 'scoreWeight' : 'rolloutWeight';
      PARAMS[key] = clamped;
      input.value = clamped;
      PARAMS[other] = parseFloat((1 - clamped).toFixed(4));
      const otherInput = document.getElementById('pd-' + other);
      if (otherInput) {
        otherInput.value = PARAMS[other];
        otherInput.classList.toggle('changed', Math.abs(PARAMS[other] - PARAMS_DEFAULT[other]) > 1e-9);
      }
    }
    dashRefreshPhase();
  };

  window.dashRefreshPhase = function() {
    const badge = document.getElementById('pd-phase-badge');
    if (!badge || typeof state === 'undefined') return;
    const mc = state.moveCount;
    const empty = 361 - Array.from(state.board).filter(v=>v>0).length;
    /* Live-Mix der Experten anzeigen (Soft-Gating) */
    const {wOpen, wMid, wEnd} = phaseWeights(mc, empty);
    const phase = (wEnd >= wOpen && wEnd >= wMid) ? 'Endspiel'
                : (wOpen >= wMid) ? 'Eröffnung' : 'Mittelspiel';
    const parts = [];
    if (wOpen > 0.02) parts.push(`Ö ${Math.round(wOpen*100)}%`);
    if (wMid  > 0.02) parts.push(`M ${Math.round(wMid*100)}%`);
    if (wEnd  > 0.02) parts.push(`E ${Math.round(wEnd*100)}%`);
    badge.textContent = (parts.length > 1 ? parts.join(' · ') : phase) + ' (Zug ' + mc + ')';
    const col = phase==='Eröffnung'?'rgba(39,174,96,.15)':phase==='Mittelspiel'?'rgba(200,160,90,.12)':'rgba(192,57,43,.12)';
    const brd = phase==='Eröffnung'?'rgba(39,174,96,.3)':phase==='Mittelspiel'?'rgba(200,160,90,.3)':'rgba(192,57,43,.3)';
    const txt = phase==='Eröffnung'?'var(--green)':phase==='Mittelspiel'?'var(--wood-light)':'var(--red)';
    badge.style.cssText=`display:inline-block;padding:1px 6px;border-radius:2px;margin-left:4px;font-size:.55rem;background:${col};color:${txt};border:1px solid ${brd}`;
    if (window.policyNet) policyNet.dashUpdate();
  };

  /* Gespeichert werden nur Abweichungen vom Default, mit Versionsnummer.
     Früher lag hier der ganze Parametersatz: Wer einmal gespeichert hatte,
     behielt alle Defaults von damals, und keine spätere Messung kam in
     seinem Browser an (README, „Gemessen heißt nicht wirksam“). */
  function dashAbweichungen() {
    const a = {};
    for (const k of Object.keys(PARAMS_DEFAULT))
      if (typeof PARAMS[k] === 'number' && Math.abs(PARAMS[k] - PARAMS_DEFAULT[k]) > 1e-12) a[k] = PARAMS[k];
    return a;
  }
  window.dashSave = function() {
    let ok = true;
    try { localStorage.setItem(PD_STORE, JSON.stringify({version: PD_VERSION, abweichungen: dashAbweichungen()})); }
    catch (e) { console.warn('[Dashboard] Speichern fehlgeschlagen:', e); ok = false; }
    const btn = document.querySelectorAll('.pd-export-btn')[0];
    const orig = btn.textContent;
    btn.textContent = ok ? '✓ Gespeichert' : '✗ Fehler';
    btn.style.color = ok ? 'var(--green)' : 'var(--red)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1500);
  };

  /* Beim Seitenaufbau einspielen. Nur Schlüssel, die es wirklich gibt, und
     nur endliche Zahlen — ein alter oder manipulierter Eintrag darf die
     Engine nicht mit NaN oder Fremdfeldern vergiften. */
  function dashLoadSaved() {
    let raw;
    try { raw = localStorage.getItem(PD_STORE); }
    catch (e) { console.warn('[Dashboard] localStorage nicht lesbar:', e); return 0; }
    if (!raw) return 0;
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { console.warn('[Dashboard] Gespeicherte Konfig unlesbar, ignoriert'); return 0; }
    /* Altes Format (der ganze Parametersatz, ohne Version): Welche Werte
       bewusst geändert waren, lässt sich nicht mehr erkennen, und die
       übrigen hielten veraltete Defaults fest. Einmal verwerfen, sichtbar
       im Protokoll. */
    if (!obj || obj.version !== PD_VERSION || typeof obj.abweichungen !== 'object' || !obj.abweichungen) {
      try { localStorage.removeItem(PD_STORE); } catch (e) {}
      const hinweis = 'Gespeicherte Einstellungen im alten Format verworfen (sie hielten alte Defaults fest). Eigene Änderungen bitte neu speichern.';
      console.warn('[Dashboard] ' + hinweis);
      if (typeof state !== 'undefined' && state.log) state.log.push('! ' + hinweis);
      return 0;
    }
    let n = 0;
    for (const k of Object.keys(PARAMS_DEFAULT)) {
      const v = obj.abweichungen[k];
      if (typeof v === 'number' && Number.isFinite(v)) { PARAMS[k] = v; n++; }
    }
    if (n) console.log(`[Dashboard] ${n} gespeicherte Parameter geladen`);
    return n;
  }

  window.dashReset = function() {
    try { localStorage.removeItem(PD_STORE); } catch (e) {}
    Object.assign(PARAMS, PARAMS_DEFAULT);
    for (const key of Object.keys(PARAMS_DEFAULT)) {
      const inp = document.getElementById('pd-' + key);
      if (inp) { inp.value = PARAMS[key]; inp.classList.remove('changed'); }
    }
    for (const sec of SECTIONS)
      if (sec.params) for (const p of sec.params) {
        const inp = document.getElementById('pd-' + p.key);
        if (inp) { inp.value = PARAMS[p.key]; inp.classList.remove('changed'); }
      }
    document.querySelectorAll('.pd-preset-btn').forEach(b=>b.classList.remove('active'));
    dashRefreshPhase();
  };

  window.dashExport = function() {
    const lines = [
      '// Go KI — Parameter-Snapshot',
      `// Stand: Zug ${typeof state!=='undefined'?state.moveCount:0}`,
      '// Haupthebel: endAreaGain (×30), passGainThreshold, aiTimeBudget',
      'globalThis.PARAMS = {'
    ];
    for (const [k,v] of Object.entries(PARAMS)) lines.push(`  ${k}: ${v},`);
    lines.push('};');
    const txt = lines.join('\n');
    navigator.clipboard.writeText(txt).catch(()=>{});
    const btn = document.querySelector('.pd-export-btn');
    const orig = btn.textContent;
    btn.textContent = '✓ Kopiert'; btn.style.color='var(--green)';
    setTimeout(()=>{ btn.textContent=orig; btn.style.color=''; },1500);
  };

  const origUpdateUI = window.updateUI;
  if (typeof origUpdateUI === 'function') {
    window.updateUI = function(...args) { origUpdateUI(...args); dashRefreshPhase(); };
  }
})();
</script>
</body>
</html>
