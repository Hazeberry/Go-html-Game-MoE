  const K = PARAMS.mctsRootChildren, top = PARAMS.endspielNetzTop;
  if (top > 0 && scored.length > K) {
    const kopf = scored.slice(0, K), drin = new Set(kopf.map(s => s.m.idx));
    const rest = scored.slice(K).sort((a, b) => p[b.m.idx] - p[a.m.idx]);
    const beste = [...scored].sort((a, b) => p[b.m.idx] - p[a.m.idx]).slice(0, top);
    const fehlt = beste.filter(s => !drin.has(s.m.idx));
    if (fehlt.length) {
      const weg = new Set(fehlt.map(s => s.m.idx));
      const neu = [...kopf.slice(0, K - fehlt.length), ...fehlt, ...kopf.slice(K - fehlt.length), ...rest.filter(s => !weg.has(s.m.idx))];
      scored.splice(0, scored.length, ...neu);
    }
  }
  scored.__pNetz = p; scored.__lambda = PARAMS.endspielNetz;
}

/* Merkt sich den eigenen Zug je Farbe für das Endspiel-Netz; sonst unverändert */
function getAIMove(board, aiColor, histHashes, captures, mc, diff, reqId, koPoint, lastMove) {
  const r = _getAIMoveKern(board, aiColor, histHashes, captures, mc, diff, reqId, koPoint, lastMove);
  endspielNetzMerke(aiColor, r && r.type === 'stone' ? r.y * 19 + r.x : -1, mc);
  return r;
}

function _getAIMoveKern(board, aiColor, histHashes, captures, mc, diff, reqId, koPoint, lastMove) {
  _lastMoveIdx = (lastMove === undefined || lastMove === null) ? -1 : lastMove;
  const hs = new Set(histHashes);
  let legal = getLegalMoves(board, aiColor, hs, koPoint);
  if (!legal.length) return {type:'pass', requestId:reqId};
  /* Benson-Zugfilter: Züge, deren Stein beweisbar tot geboren würde,
     kommen gar nicht erst in die Kandidatenliste. Schlagen können solche
     Züge nie (pass-alive-Randketten haben immer ≥2 Freiheiten), helfen
     können sie nie (in der Region entsteht nie ein Auge) — sie verschenken
     nur einen Stein. Bleibt kein Zug übrig, ist Passen der einzige
     nicht-verschenkende Zug. */
  if (PARAMS.bensonMoveFilter >= 1) {
    const e = bensonClassify(board);
    const born = _bnBornDead[aiColor];
    const kept = legal.filter(m => born[m.idx] !== e);
    if (!kept.length) {
      /* Kein einziger Zug, der nicht sofort verschenkt wäre — der Gegner
         besitzt beweisbar jede leere Region. Passen ist korrekt, aber wenn
         das anhält UND wir zurückliegen, ist Aufgeben ehrlicher, als den
         Menschen weiterspielen zu lassen. Beobachtet: eine Easy-Partie lief
         so bis Zug 539, weil die Q-basierte Aufgabe nur im MCTS-Zweig sitzt
         und Easy/Mittel den nie erreichen. Dieses Kriterium ist bewiesen
         statt geschätzt und gilt daher für ALLE Stufen. */
      _allDeadStreak++;
      const opp = aiColor === 1 ? 2 : 1;
      /* Fläche allein: Gefangene zählen bei Flächenzählung nicht (vorher
         doppelt, Code-Review 13.10.). Komi bleibt draußen wie überall in
         der Engine. */
      const zurueck = estimateArea(board, aiColor) < estimateArea(board, opp);
      if (PARAMS.resignEnabled >= 1 && mc >= PARAMS.resignMinMoves &&
          zurueck && _allDeadStreak >= PARAMS.resignAllDeadStreak)
        return {type:'resign', requestId:reqId,
          info:`alle Züge todgeboren, ${_allDeadStreak}× in Folge, Rückstand`};
      return {type:'pass', requestId:reqId,
        info:`Pass — alle ${legal.length} legalen Züge wären todgeboren (Benson)`};
    }
    _allDeadStreak = 0;
    legal = kept;
  }
  /* Augenschutz (PARAMS.augenSchutz): eigene echte Augen nie fuellen. Bleibt
     nichts uebrig, ist Passen der einzige Zug, der nichts verschenkt. */
  if (PARAMS.augenSchutz >= 1) {
    const ohne = legal.filter(m => !fuelltEigenesAuge(board, m.idx, aiColor));
    if (!ohne.length) return {type:'pass', requestId:reqId, info:'Pass — frei sind nur noch eigene Augen'};
    legal = ohne;
  }
  /* Lese-Verzicht (PARAMS.leseVerzicht): Zuege, deren Kette der Leser sofort
     faengt, kommen nicht in die Kandidaten. Siehe docs/endspiel-verlust.md. */
  if (PARAMS.leseVerzicht >= 1) {
    const ohne = legal.filter(m => !vergeblicherZug(board, m.idx, aiColor));
    if (ohne.length) legal = ohne;
  }
  const empty = legal.length;
  buildCrisisMap(board, aiColor);
  /* Nach der Krisenkarte und VOR der Bewertung: die Kandidaten sollen die
     Dauer dieses Zuges sehen, nicht die des vorigen. */
  if (PARAMS.tsumegoSunkCost > 0) aktualisiereKrisenDauer(board, aiColor);
  primeAreaCache(board, aiColor);
  if (PARAMS.influenceInvade > 0 || PARAMS.influenceOwn > 0) primeInfluenceCache(board);
  if (PARAMS.endTieBreak > 0 || PARAMS.gebietZug > 0) primeEndTieBreak(board);
  if (PARAMS.raumGewicht > 0 || PARAMS.raumZug > 0) primeRaum(board);
  /* Muster (PARAMS.musterGewicht) nur hier, an der Wurzel der KI. */
  const mg = PARAMS.musterGewicht;
  const scored = legal.map(m => ({m, score: evaluateMove(board, m.idx, aiColor, mc, empty)
    + (mg > 0 ? mg * musterWert(board, m.idx, aiColor) : 0)}));
  scored.sort((a,b) => b.score - a.score);
  /* Gegnerwert (PARAMS.gegnerWert): was derselbe Punkt dem Gegner braechte,
     mit evaluateMove aus seiner Sicht. Hier nur berechnet, solange die
     Karten fuer dieses Brett gueltig sind; aufgeschlagen wird erst nach der
     Pass-Pruefung, damit die unveraendert bleibt. Siehe docs/gegnerwert.md. */
  let _gegnerWerte = null;
  if (PARAMS.gegnerWert > 0) {
    const opp = aiColor === 1 ? 2 : 1;
    const oppLegal = new Set(getLegalMoves(board, opp, hs).map(m => m.idx));
    buildCrisisMap(board, opp);
    primeAreaCache(board, opp);
    _gegnerWerte = new Map();
    for (const s of scored) {
      if (!oppLegal.has(s.m.idx)) continue;
      const v = evaluateMove(board, s.m.idx, opp, mc, oppLegal.size);
      if (v > 0) _gegnerWerte.set(s.m.idx, PARAMS.gegnerWert * v);
    }
    buildCrisisMap(board, aiColor);
    primeAreaCache(board, aiColor);
  }
  /* Gegnergebiet (PARAMS.gegnerGebiet): nur der Gebietsanteil des
     Gegnerwerts -- wie viel Bouzy-Bilanz der Gegner mit diesem Punkt
     gewaenne, gewichtet wie gebietZug. Braucht die Bouzy-Ebenen dieses
     Bretts (_tbValid), die getAIMove fuer gebietZug ohnehin vorbereitet. */
  if (PARAMS.gegnerGebiet > 0 && _tbValid) {
    const opp = aiColor === 1 ? 2 : 1, vz = opp === 1 ? 1 : -1;
    if (!_gegnerWerte) _gegnerWerte = new Map();
    for (const s of scored) {
      const i = s.m.idx;
      _ggScratch.set(board); _ggScratch[i] = opp;
      if (removeDeadGroups(_ggScratch, aiColor, i) === 0 && countLiberties(_ggScratch, i, 1) === 0) continue;
      const d = (tbBilanzNach(lsAktiv() ? lsNach(_ggScratch, i, opp) : _ggScratch) - (lsAktiv() ? lsBasis(opp) : _tbBilanz)) * vz;
      if (d > 0) _gegnerWerte.set(i, (_gegnerWerte.get(i) || 0) + PARAMS.gegnerGebiet * PARAMS.gebietZug * d);
    }
  }
  /* PolicyNet: Priors berechnen + Score blenden (nur Hard-KI).
     FIX: Im Worker ist policyNet nur ein Stub OHNE boardToInput/forward —
     der alte Code crashte dort mit TypeError, sobald blendWeight > 0 war
     (ab 2 Spielen), und die Hard-KI lief ab dann bei JEDEM Zug synchron
     im UI-Thread. Jetzt: Worker nutzt die übergebenen Priors, nur der
     Haupt-Thread rechnet selbst.

     Und dieselbe Trennung wie im Haupt-Thread: der Zweig läuft jetzt
     unabhängig von blendWeight, damit das Netz auch während des Warmups
     Priors sieht und aufzeichnen kann. Geblendet wird erst weiter unten,
     und nur wenn blendWeight > 0 ist. Ohne diese Trennung kann ein
     Selbstspiel-Trainingslauf im Harness nichts lernen — derselbe
     geschlossene Kreis wie im Spiel. */
  if (diff === 'hard' && globalThis.policyNet) {
    const _bw = policyNet.blendWeight;
    let _p = null, _h = null, _inp = null;
    if (typeof policyNet.forward === 'function') {
      /* Letzten Zug aus dem EIGENEN Parameter ableiten, nicht aus dem
         Seitenkanal policyNet._lastMove. Im Browser ist beides derselbe
         Wert (state.lastMove wird oben gesetzt und hier übergeben), im
         Harness setzt niemand _lastMove — Feature-Layer 8 wäre dort also
         dauerhaft leer gewesen, während er im Spiel gefüllt ist. */
      const _lm = _lastMoveIdx >= 0 ? {x: xOf(_lastMoveIdx), y: yOf(_lastMoveIdx)} : null;
      _inp = policyNet.boardToInput(board, aiColor, _lm, koPoint);
      const _r = policyNet.forward(_inp);
      _p = _r.probs; _h = _r.hidden;
    } else {
      _p = policyNet._netPriors;   /* Worker: vorberechnet aus postMessage */
    }
    if (_p) {
      policyNet._netPriors = _p; policyNet._netHidden = _h;
      policyNet._netInp    = _inp; policyNet._netBlend  = _bw;
      if (_bw > 0) {
        /* Ein einzelner nicht-finiter Prior reichte, um über _mctsKids'
           Softmax (Z = NaN) die Priors ALLER Wurzelkinder zu vergiften und
           die PUCT-Auswahl ohne Kandidaten zurückzulassen. Betroffene
           Kandidaten behalten deshalb ihren reinen MoE-Score, statt ihn zu
           verlieren — und das Netz meldet sich, statt still zu bleiben. */
        let _skipped = 0;
        scored.forEach(s => {
          const p = _p[s.m.idx];
          if (Number.isFinite(p)) s.score = (1-_bw)*s.score + _bw * p * PARAMS.netScoreScale;
          else _skipped++;
        });
        if (_skipped)
          console.warn(`[PolicyNet] ${_skipped} von ${scored.length} Priors nicht-finit — `
            + `für diese Kandidaten wurde nicht geblendet.`);
        scored.sort((a,b) => b.score - a.score);
      }
    }
  }
  _areaCacheValid = false;
  const best = scored[0].score;

  const PASS_GAIN_THRESHOLD = PARAMS.passGainThreshold;
  const wantsToPass =
    (mc > 40  && best < PARAMS.passMinMc40) ||
    (mc > 80  && best < PARAMS.passMinMc80)  ||
    (mc > 120 && best < PARAMS.passMinMc120)  ||
    (best < PARAMS.passMinMc150 && mc > 150);

  /* Die Einflusskarte ist farbneutral und die Stellung bis hierher
     unveraendert: der Pass-Check unten bewertet die Gegnerzuege mit derselben
     Karte. Wer nicht in den Pass-Check geht, braucht sie nicht mehr. */
  if (!wantsToPass) { _infValid = false; _tbValid = false; }

  if (wantsToPass) {
    let ownInAtari = false;
    for (let k = 0; k < BOARD_SIZE; k++) {
      /* gegen den PARAMETER prüfen, nicht gegen die Literalkonstante:
         crisisAtari ist im Dashboard einstellbar (0–200). Stand hier 100
         fest, hörte die Atari-Erkennung bei jedem abweichenden Wert still
         auf zu greifen — die KI hätte gepasst, obwohl eigene Gruppen im
         Atari stehen. Zeile 1584 macht es bereits so. */
      if (_crisisOwn[k] >= PARAMS.crisisAtari) { ownInAtari = true; break; }
    }
    const opp = aiColor === 1 ? 2 : 1;
    buildCrisisMap(board, opp);
    primeAreaCache(board, opp);   /* sonst rechnet evalEndgame pro Kandidat O(n) neu */
    const oppLegal = getLegalMoves(board, opp, hs);
    let oppBest = -Infinity;
    const oppTop = [];   /* die drei besten Gegnerzuege, fuer passUnabwendbar */
    for (const m of oppLegal) {
      const sc = evaluateMove(board, m.idx, opp, mc, oppLegal.length);
      if (sc > oppBest) oppBest = sc;
      if (oppTop.length < 3 || sc > oppTop[oppTop.length - 1].sc) {
        oppTop.push({idx: m.idx, sc}); oppTop.sort((x, y) => y.sc - x.sc);
        if (oppTop.length > 3) oppTop.pop();
      }
    }
    const opponentGainsAlot = oppBest > PASS_GAIN_THRESHOLD;
    /* passUnabwendbar: Atari oder grosser Gegnerzug verbieten den Pass nur,
       wenn ein eigener Zug etwas dagegen tun kann. Muss vor dem
       Zuruecksetzen der Caches laufen; es setzt sie selbst um. */
    const unabwendbar = PARAMS.passUnabwendbar >= 1 && (ownInAtari || opponentGainsAlot)
      && gegnerzugUnabwendbar(board, aiColor, scored, oppTop, mc, PASS_GAIN_THRESHOLD, oppLegal.length);
    _areaCacheValid = false;
    _infValid = false;
    _tbValid = false;
    buildCrisisMap(board, aiColor);
    if ((!ownInAtari && !opponentGainsAlot) || unabwendbar) {
      return unabwendbar
        ? {type:'pass', requestId:reqId, info:'Pass — der Gegnerzug ist nicht abwendbar'}
        : {type:'pass', requestId:reqId};
    }
  }
  /* Krisenkandidaten (PARAMS.krisenKandidaten): Rettung einer eigenen Kette
     aus dem Atari (danach mindestens zwei Freiheiten) und jeder Schlag
     bekommen mindestens den Wert des besten Kandidaten. Sonst ueberstrahlt
     gebietZug die Taktik: Die Rettung von drei Steinen im Atari lag mit 422
     auf Rang 222 hinter Gebietszuegen mit 1398 und erreichte die Suche nie.
     Ob der Zug gespielt wird, entscheidet weiterhin die Suche. */
  if (PARAMS.krisenKandidaten > 0 && scored.length) {
    const top = scored[0].score, opp = aiColor === 1 ? 2 : 1;
    let gehoben = false;
    for (const s of scored) {
      if (s.score >= top) continue;
      const i = s.m.idx;
      let krise = false;
      for (const n of NEIGHBORS[i]) {
        if (board[n] === opp && countLiberties(board, n, 2) === 1) { krise = true; break; }   /* Schlag */
        if (board[n] === aiColor && countLiberties(board, n, 2) === 1) {                      /* Rettung? */
          _ggScratch.set(board); _ggScratch[i] = aiColor;
          removeDeadGroups(_ggScratch, opp, i);
          if (countLiberties(_ggScratch, i, 2) >= 2) { krise = true; break; }
        }
      }
      if (krise) { s.score = top; gehoben = true; }
    }
    if (gehoben) scored.sort((a,b) => b.score - a.score);
  }
  /* Lese-Rettung (PARAMS.leseRettung): eigene Ketten ab zwei Steinen mit
     hoechstens drei Freiheiten, die der taktische Leser fangen kann: Zuege,
     nach denen er sie nicht mehr faengt, kommen an die Spitze. Stufe 2
     zusaetzlich fuer gegnerische Ketten: Zuege, nach denen der Gegner sie
     nicht mehr retten kann. Nach der Pass-Pruefung, wie krisenKandidaten.
     Siehe docs/laufkampf-lesen.md. */
  if (PARAMS.leseRettung > 0 && scored.length) {
    const top = scored[0].score, opp = aiColor === 1 ? 2 : 1;
    const legalSet = new Set(scored.map(s => s.m.idx)), heben = new Set();
    const ges = new Uint8Array(BOARD_SIZE);
    for (let k = 0; k < BOARD_SIZE; k++) {
      const c = board[k];
      if (!c || ges[k]) continue;
      const {group, liberties} = floodFill(board, k);
      for (const g of group) ges[g] = 1;
      if (group.length < 2 || liberties.length > 3) continue;
      if (c === aiColor) {
        if (!leseAngriff(board, k).ja) continue;
        for (const m of _verteidigungsZuege(board, group, liberties)) {
          if (!legalSet.has(m)) continue;
          const nb = _leseZug(board, m, aiColor);
          if (nb && nb[k] && !leseAngriff(nb, k).ja) heben.add(m);
        }
      } else if (PARAMS.leseRettung >= 2) {
        if (!leseAngriff(board, k).ja) continue;
        for (const m of _angriffsZuege(board, liberties)) {
          if (!legalSet.has(m)) continue;
          const nb = _leseZug(board, m, aiColor);
          if (nb && (!nb[k] || !leseVerteidigung(nb, k).ja)) heben.add(m);
        }
      }
    }
    if (heben.size) {
      for (const s of scored) if (heben.has(s.m.idx)) s.score = Math.max(s.score, top) + 1;
      scored.sort((a,b) => b.score - a.score);
    }
  }
  if (_gegnerWerte) {
    for (const s of scored) {
      const v = _gegnerWerte.get(s.m.idx);
      if (v) s.score += v;
    }
    scored.sort((a,b) => b.score - a.score);
  }
  let chosen;
  if (diff === 'easy') {
    const n = Math.max(1, Math.floor(scored.length * 0.25));
    chosen = scored[Math.floor(Math.random() * n)].m;
  } else if (diff === 'medium') {
    const n = Math.max(1, Math.floor(scored.length * 0.08));
    chosen = scored[Math.floor(Math.random() * n)].m;
  } else {
    /* ── Schwer: MCTS-PUCT (neu) oder Kandidaten+Rollouts (alt, useMCTS=0) ── */
    if (PARAMS.useMCTS >= 1) {
      endspielNetzWurzel(board, aiColor, mc, scored, koPoint);
      const r = mctsPUCT(board, aiColor, captures, scored, koPoint);
      if (r) {
        /* Aufgabe-Prüfung: Q ist aus KI-Sicht — anhaltend ≤ -resignQ heißt,
           selbst die beste gefundene Fortsetzung verliert praktisch sicher.
           Die Serie lebt im Worker zwischen Zügen (wie _lastMsPerSim).

           Q allein reicht dafür NICHT: es hängt an evaluateBoard, und das
           wird vom Gefangenen-Term beherrscht. Vier gemessene Partien gaben
           bei ausgeglichenem Gebiet auf, zwei davon aus einer Führung heraus.
           Deshalb muss die Gebietsschätzung zustimmen — die Serie zählt jetzt
           Züge, die nach BEIDEN Maßstäben hoffnungslos sind. Reihenfolge ist
           Absicht: estimateArea läuft nur, wenn Q die Schwelle ohnehin reißt. */
        if (PARAMS.resignEnabled >= 1 && mc >= PARAMS.resignMinMoves && r.q <= -PARAMS.resignQ
            && gebietSagtVerloren(board, aiColor)) {
          _hopelessStreak++;
          if (_hopelessStreak >= PARAMS.resignStreak) {
            const opp = aiColor === 1 ? 2 : 1;
            const g = aufgabeGebiet(board, aiColor);
            const tote = g.totEigen + g.totFremd;
            return {type:'resign', requestId:reqId,
              info:`Q ${r.q.toFixed(2)} über ${_hopelessStreak} Züge in Folge · Fläche `
                 + `${g.eigen}:${g.fremd}`
                 + (tote === 1 ? ' ohne 1 beweisbar toten Stein'
                    : tote ? ` ohne ${tote} beweisbar tote Steine` : '')
                 + ` (roh ${estimateArea(board, aiColor)}:${estimateArea(board, opp)})`};
          }
        } else {
          _hopelessStreak = 0;
        }
        return {type:'stone', x:r.m.x, y:r.m.y, requestId:reqId,
          info:`MCTS ${r.sims}${r.sims < 50 ? ' ⚠' : ''} Sims · ${r.share}% ${coordToLabel(r.m.x,r.m.y)} · Q ${r.q.toFixed(2)}`};
      }
      return {type:'pass', requestId:reqId};
    }
    let CAND, R, D;
    let _hc = false;
    for (let _i = 0; _i < BOARD_SIZE; _i++)
      if (_crisisOwn[_i] >= PARAMS.crisisAtari || _crisisOpp[_i] >= PARAMS.crisisAtari) { _hc = true; break; }
    if (_hc) {
      CAND = PARAMS.crisisCand; R = PARAMS.crisisRoll; D = PARAMS.crisisDepth;
    } else if (mc < PARAMS.openingMoves) {
      CAND = PARAMS.candOpen; R = PARAMS.rollOpen; D = PARAMS.depthOpen;
    } else if (mc <= PARAMS.endgameMoves && empty >= PARAMS.endgameEmpty) {
      const f = empty > 200 ? 1.0 : empty > 100 ? 1.4 : 1.8;
      CAND = Math.min(PARAMS.candMidMax, Math.round(PARAMS.candMid  * f));
      R    = Math.max(PARAMS.rollMidMin, Math.round(PARAMS.rollMid  * f));
      D    = Math.min(PARAMS.depthMidMax,Math.round(PARAMS.depthMid * f));
    } else {
      CAND = Math.min(PARAMS.candEnd,    Math.max(3, Math.round(empty * 0.15)));
      R    = Math.max(PARAMS.rollEndMin, Math.round(PARAMS.rollEnd  * (empty < 30 ? 2.0 : 1.2)));
      D    = Math.min(PARAMS.depthEndMax,Math.round(PARAMS.depthEnd * (empty < 30 ? 2.0 : 1.3)));
    }
    const cands = scored.slice(0, Math.min(CAND, scored.length));
    if (!cands.length) return {type:'pass', requestId:reqId};
    const opp = aiColor === 1 ? 2 : 1;
    let bm = cands[0].m, bs = -Infinity;
    const timeBudget = getAdaptiveTimeBudget(empty);
    const deadline = Date.now() + timeBudget;
    const hardDeadline = deadline + timeBudget;   /* Sicherheitsbremse, s. mctsPUCT */
    _simScratch.set(board);
    for (const {m, score} of cands) {
      if (Date.now() > deadline) break;
      _simScratch[m.idx] = aiColor;
      const {captured:cn, undo} = removeDeadGroupsUndoable(_simScratch, opp, m.idx);
      const sc = {1:captures[1], 2:captures[2]}; sc[aiColor] += cn;
      let tot = 0;
      /* Ko-Punkt nach dem Kandidaten, nicht der der Ausgangsstellung */
      const koDanach = koNachZug(_simScratch, m.idx, cn);
      for (let r = 0; r < R; r++) tot += rollout(_simScratch, opp, histHashes, sc, D, aiColor, koDanach, hardDeadline);
      const comb = (tot/R) * PARAMS.rolloutWeight + score * PARAMS.scoreWeight;
      if (comb > bs) { bs = comb; bm = m; }
      applyUndo(_simScratch, undo);
      _simScratch[m.idx] = 0;
    }
    chosen = bm;
  }
  /* FIX Bug 7: _gameBuffer.push entfernt — applyAIResult übernimmt das.
     Der Worker hat kein _gameBuffer (würde crashen), und im Sync-Fallback
     würde applyAIResult sonst doppelt pushen. */
  return {type:'stone', x:chosen.x, y:chosen.y, requestId:reqId};
}
</script>
<script>
'use strict';

const KOMI = 7.5;
const state = {
  board: createBoard(), currentPlayer: 1, captures: {1:0,2:0},
  boardHistory: new Set([computeZobrist(createBoard())]),
  /* Dieselben Hashes in Zugfolge: undo() kürzt die Liste und baut die Menge
     daraus neu. Vorher nahm undo() nur die letzten 50 Undo-Einträge, und
     ältere Stellungen fielen aus der Superko-Prüfung. */
  hashListe: [computeZobrist(createBoard())],
  currentHash: computeZobrist(createBoard()),
  consecutivePasses: 0, moveCount: 0, gameOver: false, log: [], lastMove: null,
  koPoint: null,                          // Fix 7: 1-Ply-Ko-Punkt (Index oder null)
  sgfMoves: [],                           // Zugfolge für SGF-Export
  resignedBy: null,                       // Farbe, die aufgegeben hat (für Anzeige + SGF RE[+R])
  finalMargin: null,                      // zuletzt berechneter Punktestand, z.B. "Schwarz +34.5"
  scoringMode: 'area',                    // 'area' (chinesisch) oder 'territory' (japanisch)
  /* Bug-Report-Daten: Diagnose pro KI-Zug + exakter Zustand VOR dem letzten
     KI-Zug. Motivation: der Hänger nach Zug 185 (Session 15.7.) war nicht
     reproduzierbar, weil der Brettzustand fehlte — das Zugprotokoll allein
     reicht nicht (Ko, Gefangene, Superko-Historie gehen verloren). */
  aiDiag: [], lastAIRequest: null, aiReqT0: 0, aiReqBudget: 0,
  workerDeadReason: null,
  aiEnabled: false, aiColor: 2, aiDifficulty: 'easy',
  aiThinking: false, aiRequestId: 0, aiWorker: null, aiWorkerCtx: null, deadStones: new Set(), undoStack: []
};

/* Touch-Bedienung: erster Tipp = Vorschau, zweiter Tipp = setzen */
let pendingTouch = null;

function humanTurn() { return !state.aiEnabled || state.currentPlayer !== state.aiColor; }

function saveUndoState() {
  state.undoStack.push({
    board: cloneBoard(state.board), currentPlayer: state.currentPlayer,
    captures: {...state.captures}, currentHash: state.currentHash,
    consecutivePasses: state.consecutivePasses, moveCount: state.moveCount,
    gameOver: state.gameOver, logLength: state.log.length,
    deadStones: new Set(state.deadStones), lastMove: state.lastMove,
    sgfLen: state.sgfMoves.length,
    koPoint: state.koPoint,                 // Fix 7
    hashLen: state.hashListe.length,
    /* PolicyNet trainiert auf seinen Zügen dieser Partie; undo() nimmt die
       zurückgenommenen aus dem Puffer. */
    netBufLen: globalThis.policyNet && policyNet._gameBuffer ? policyNet._gameBuffer.length : 0
  });
  if (state.undoStack.length > 50) state.undoStack.shift();
  updateUndoButton();
}

function undo() {
  if (!state.undoStack.length || state.aiThinking) return;
  const prev = state.undoStack.pop();
  state.board = prev.board; state.currentPlayer = prev.currentPlayer;
  state.captures = prev.captures; state.currentHash = prev.currentHash;
  state.consecutivePasses = prev.consecutivePasses; state.moveCount = prev.moveCount;
  state.gameOver = prev.gameOver; state.deadStones = prev.deadStones;
  state.lastMove = prev.lastMove; pendingTouch = null;
  state.koPoint = prev.koPoint;            // Fix 7
  state.sgfMoves.length = prev.sgfLen;     // SGF-Zugliste mit zurückrollen
  state.log.splice(prev.logLength);
  state.hashListe.length = prev.hashLen;
  state.boardHistory = new Set(state.hashListe);
  if (globalThis.policyNet && policyNet._gameBuffer && policyNet._gameBuffer.length > prev.netBufLen)
    policyNet._gameBuffer.length = prev.netBufLen;
  /* Eine Aufgabe der KI hat keinen eigenen Undo-Eintrag; wer danach
     zurücknimmt, spielt weiter, die Aufgabe gilt nicht mehr (SGF RE). */
  state.resignedBy = null; state.finalMargin = null;
  document.getElementById('territory-panel').style.display = 'none';
  drawStateToCache(); render(); updateUI(); updateAIStatus(); updateUndoButton();
}

function updateUndoButton() {
  document.getElementById('btn-undo').disabled = !state.undoStack.length || state.aiThinking;
}

function placeStone(x, y) {
  if (state.gameOver) return {ok:false,reason:'Spiel beendet.'};
  const i = idx(x, y);
  if (state.board[i] !== 0) return {ok:false,reason:'Feld besetzt.'};
  if (state.koPoint !== null && i === state.koPoint)
    return {ok:false,reason:'Ko verboten.'};              /* Fix 7: billig, vor Zobrist */
  const opp = state.currentPlayer === 1 ? 2 : 1;
  const test = cloneBoard(state.board); test[i] = state.currentPlayer;
  const cap = removeDeadGroups(test, opp, i);
  if (cap === 0) {
    const {liberties} = floodFill(test, i);
    if (liberties.length === 0) return {ok:false,reason:'Suizid verboten.'};
  }
  const newHash = computeZobrist(test);
  if (state.boardHistory.has(newHash)) return {ok:false,reason:'Superko verboten.'};
  saveUndoState();
  state.board = test; state.captures[state.currentPlayer] += cap;
  state.currentHash = newHash; state.boardHistory.add(newHash); state.hashListe.push(newHash);
  state.consecutivePasses = 0; state.moveCount++;
  state.lastMove = i; pendingTouch = null;
  /* Fix 7: Ko-Punkt setzen — genau 1 Stein geschlagen, schlagender Stein ist
     Einzelgruppe mit 1 Freiheit → diese Freiheit ist der Ko-Punkt für den
     Gegner. floodFill ist kostenlos, lief bei cap===0 schon für Suizid-Check,
     bei cap>0 ein einzelner BFS auf dem bereits modifizierten Board. */
  if (cap === 1) {
    const ff = floodFill(test, i);
    state.koPoint = (ff.group.length === 1 && ff.liberties.length === 1)
      ? ff.liberties[0] : null;
  } else {
    state.koPoint = null;
  }
  const sym = state.currentPlayer === 1 ? '●' : '○';
  state.sgfMoves.push({c: state.currentPlayer, x: x, y: y});
  state.log.push(`${state.moveCount}. ${sym} ${coordToLabel(x,y)}${cap ? ` (+${cap})` : ''}`);
  state.currentPlayer = opp;
  drawStateToCache(); updateUndoButton();
  return {ok:true};
}

function pass() {
  if (state.gameOver) return;
  saveUndoState();
  const opp = state.currentPlayer === 1 ? 2 : 1;
  const name = state.currentPlayer === 1 ? '● Schwarz' : '○ Weiß';
  state.sgfMoves.push({c: state.currentPlayer, pass: true});
  state.log.push(`${++state.moveCount}. ${name} passt`);
  state.consecutivePasses++;
  state.koPoint = null;                   /* Fix 7: Passen bricht Ko */
  if (state.consecutivePasses >= 2) {
    state.gameOver = true; state.log.push('— Spiel beendet (2× Pass) —');
    resolveLifeAndDeath(); showFinalScore();
  } else state.currentPlayer = opp;
  updateUndoButton();
}

function resetGame() {
  /* Worker-Pool beenden — neuer Worker beim nächsten Hard-Zug */
  cleanupWorker();
  state.workerDead = false;   /* Neues Spiel = neuer Versuch */
  state.workerDeadReason = null;
  if (globalThis.policyNet) { policyNet._trained=false; policyNet._gameBuffer=[]; }
  state.aiRequestId++;
  const eb = createBoard(), eh = computeZobrist(eb);
  Object.assign(state, {
    board: eb, currentPlayer: 1, captures: {1:0,2:0},
    boardHistory: new Set([eh]), hashListe: [eh], currentHash: eh,
    consecutivePasses: 0, moveCount: 0, gameOver: false, lastMove: null,
    koPoint: null,                         // Fix 7
    sgfMoves: [],
    resignedBy: null, finalMargin: null,
    log: [], aiThinking: false, deadStones: new Set(), undoStack: [],
    aiDiag: [], lastAIRequest: null, aiReqT0: 0, aiReqBudget: 0
  });
  _hopelessStreak = 0;   /* Hauptthread-Kopien der Aufgabe-Serien zurücksetzen
                            (die Worker-Kopien sterben mit cleanupWorker oben) */
  _allDeadStreak  = 0;
  pendingTouch = null;
  document.getElementById('territory-panel').style.display = 'none';
  drawStateToCache(); updateUndoButton();
}

function resolveLifeAndDeath() {
  /* Tote Steine nach toteSteineAmEnde (gemeinsame Spiellogik): Benson
     exakt, der Rest je Gruppe mit Augen. Die alte Regel je Kette entfernte
     lebende Randsteine und zählte jeden Punkt eines Zwei-Punkte-Auges als
     eigenes Auge (docs/zaehlung.md). */
  state.deadStones = new Set();
  const tot = toteSteineAmEnde(state.board);
  for (let i = 0; i < BOARD_SIZE; i++) if (tot[i]) state.deadStones.add(i);
  for (const i of state.deadStones) {
    const color = state.board[i];
    state.board[i] = 0;
    if (color) state.captures[color === 1 ? 2 : 1]++;
  }
  if (state.deadStones.size) {
    state.log.push(`! ${state.deadStones.size} tote Steine entfernt`);
    drawStateToCache();
  }
}

function finalAreaScore() {
  const area = {1:0, 2:0}, visited = new Uint8Array(BOARD_SIZE);
  for (let i = 0; i < BOARD_SIZE; i++) if (state.board[i]) area[state.board[i]]++;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (state.board[i] || visited[i]) continue;
    const region = [], queue = [i], borders = new Set();
    let head = 0; visited[i] = 1;
    while (head < queue.length) {
      const c = queue[head++]; region.push(c);
      for (const n of NEIGHBORS[c]) {
        const cell = state.board[n];
        if (!cell) { if (!visited[n]) { visited[n] = 1; queue.push(n); } }
        else borders.add(cell);
      }
    }
    if (borders.size === 1) area[[...borders][0]] += region.length;
  }
  return area;
}

function finalTerritoryScore() {
  /* Territory (japanisch): Gefangene + umschlossene freie Gebiete.
     Im Unterschied zu Area werden lebende Steine selbst NICHT gezählt —
     nur das Gebiet drumherum plus die Gefangenen. */
  const territory = {1: state.captures[1], 2: state.captures[2]};
  const visited = new Uint8Array(BOARD_SIZE);
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (state.board[i] || visited[i]) continue;
    const region = [], queue = [i], borders = new Set();
    let head = 0; visited[i] = 1;
    while (head < queue.length) {
      const c = queue[head++]; region.push(c);
      for (const n of NEIGHBORS[c]) {
        const cell = state.board[n];
        if (!cell) { if (!visited[n]) { visited[n] = 1; queue.push(n); } }
        else borders.add(cell);
      }
    }
    if (borders.size === 1) territory[[...borders][0]] += region.length;
  }
  return territory;
}

function showFinalScore() {
  let scoreB, scoreW, winner, diff, label;
  if (state.scoringMode === 'territory') {
    const t = finalTerritoryScore();
    scoreB = t[1]; scoreW = t[2] + KOMI;
    label = 'Territory (Komi 7.5)';
  } else {
    const a = finalAreaScore();
    scoreB = a[1]; scoreW = a[2] + KOMI;
    label = 'Area (Komi 7.5)';
  }
  diff = Math.abs(scoreB - scoreW);
  winner = scoreB > scoreW ? 'Schwarz' : 'Weiß';
  /* Für die Aufgabe-Anzeige mitnehmen: dort gewinnt formal der Gegner,
     der Punktestand ist aber trotzdem die interessante Information. */
  state.finalMargin = `${winner} +${diff.toFixed(1)}`;
  document.getElementById('final-label').textContent = label;
  document.getElementById('final-score').textContent = state.finalMargin;
  document.getElementById('territory-panel').style.display = 'flex';
  /* PolicyNet-Training bleibt bewusst auf Area-Scoring — das Netz wurde
     durchgängig darauf kalibriert; ein Wechsel der Anzeige-Wertung soll
     die gelernte Skala nicht verschieben. */
  if (globalThis.policyNet && !policyNet._trained) {
    policyNet._trained = true;
    const _a = finalAreaScore(), _ac = state.aiColor;
    const _ai = _ac===1 ? _a[1] : _a[2]+KOMI, _op = _ac===1 ? _a[2]+KOMI : _a[1];
    policyNet.trainGame(_ai > _op ? 1 : -1);
  }
}

function applyAIResult(result, reqId, netInp, netPriors, netHidden) {
  /* Veraltete Antwort: aiThinking gehört dem NEUEREN Request und darf hier
     nicht angefasst werden. Vorher wurde es hier gelöscht, obwohl der
     nachfolgende Request noch rechnete — mit drei Folgen:
       · der Watchdog des neuen Requests bricht sich selbst ab
         (er prüft `if (!state.aiThinking) return;`) → kein Hänger-Schutz
       · der Rückgängig-Knopf wird mitten in der Rechnung wieder aktiv,
         und undo() lässt sich ausführen (Guard prüft aiThinking) — die
         danach eintreffende Antwort setzt dann einen Stein auf ein Brett,
         das es so nicht mehr gibt
       · die Statusanzeige springt auf „KI aktiv", während sie noch denkt
     fallbackToMainThread macht es an derselben Stelle bereits richtig. */
  if (!result || reqId !== state.aiRequestId) return;
  if (state.gameOver || state.currentPlayer !== state.aiColor) {
    state.aiThinking = false; updateAIStatus(); return;
  }
  if (result.type === 'stone') {
    const r = placeStone(result.x, result.y);
    /* Erst nach dem gelungenen Zug in den Trainingspuffer: placeStone hat
       dabei den Undo-Eintrag mit der Pufferlänge davor angelegt, und ein
       abgelehnter Zug gehört nicht ins Training. */
    if (r.ok && netPriors && globalThis.policyNet) {
      policyNet._gameBuffer.push({
        inp: netInp, probs: netPriors, hidden: netHidden,
        moveIdx: idx(result.x, result.y)
      });
    }
    if (!r.ok) {
      state.log.push(`! KI: ${r.reason} → Fallback`);
      const fb = findAnyLegalMove(state.aiColor);
      if (fb) { const r2 = placeStone(fb.x, fb.y); if (!r2.ok) pass(); }
      else pass();
    } else if (result.info) {
      state.log.push(`   ↳ ${result.info}`);
    }
  } else if (result.type === 'resign') {
    state.gameOver = true;
    state.resignedBy = state.aiColor;
    const kiName = state.aiColor === 1 ? '● Schwarz' : '○ Weiß';
    state.log.push(`— ${kiName} (KI) gibt auf —`);
    if (result.info) state.log.push(`   ↳ ${result.info}`);
    /* Stand ermitteln, aber das Brett dabei NICHT anfassen. Eine Aufgabe
       beendet die Partie sofort — es wird nichts ausgezählt, also darf auch
       nichts vom Brett verschwinden. Vorher lief hier resolveLifeAndDeath()
       direkt: Nach der Aufgabe verschwanden plötzlich Steine, die niemand
       geschlagen hatte ("! 30 tote Steine entfernt"), und die Gefangenen-
       Anzeige sprang von 6 auf 36. Jetzt: auswerten, Zahl merken, Brett,
       Gefangene, Tote und Protokoll exakt wiederherstellen. */
    const _bSave = cloneBoard(state.board);
    const _cSave = {...state.captures};
    const _dSave = state.deadStones;
    const _logLen = state.log.length;
    /* PolicyNet: Die KI hat aufgegeben, also verloren -- wie die Fläche
       gerade steht, spielt keine Rolle. Vor showFinalScore, das sonst nach
       Fläche trainiert hätte. */
    if (globalThis.policyNet && !policyNet._trained) { policyNet._trained = true; policyNet.trainGame(-1); }
    resolveLifeAndDeath();
    showFinalScore();
    const stand = state.finalMargin;
    state.board = _bSave; state.captures = _cSave; state.deadStones = _dSave;
    state.log.length = _logLen;          /* "tote Steine entfernt" zurücknehmen */
    drawStateToCache();
    const gewinner = state.aiColor === 1 ? 'Weiß' : 'Schwarz';
    document.getElementById('final-label').textContent = 'Aufgabe';
    document.getElementById('final-score').textContent =
      `${gewinner} gewinnt (Stand ${stand || '–'})`;
  } else {
    pass();
    if (result.info) state.log.push(`   ↳ ${result.info}`);
  }
  /* Diagnose-Zeile für den Bug-Report: was hatte die KI vor, wie lange hat
     sie wirklich gebraucht, mit welchem Budget? dauerMs >> budgetMs zeigt
     einen Zug, bei dem die Sicherheitsbremsen greifen mussten. */
  state.aiDiag.push({
    zug: state.moveCount, typ: result.type, info: result.info || null,
    dauerMs: state.aiReqT0 ? Date.now() - state.aiReqT0 : null,
    budgetMs: state.aiReqT0 ? state.aiReqBudget : null,
    msProSim: typeof _lastMsPerSim === 'number' ? Math.round(_lastMsPerSim * 100) / 100 : null
  });
  state.aiReqT0 = 0;
  state.aiThinking = false;
  render(); updateUI(); updateAIStatus(); updateUndoButton();
  if (!state.gameOver && state.aiEnabled && state.currentPlayer === state.aiColor) triggerAIMove();
}

/* ═══ Worker-Fallback-Kette (aus der Session vom 30.6. zurückportiert) ═══
   1. data:-URL  — unter file:// (Origin "null") oft der einzige Weg
   2. blob:-URL  — Standardweg (https / GitHub Pages)
   3. Hauptthread synchron — greift garantiert
   Neu gegenüber damals: workerDead-Flag verhindert, dass ein kaputter
   Worker bei jedem Zug neu gebaut wird und erneut crasht; onerror nutzt
   die AKTUELLE reqId statt der beim Erstellen eingefrorenen (sonst
   konnte aiThinking nach spätem Worker-Fehler dauerhaft hängen). */
function buildWorkerSource() {
  const aiSrc = document.getElementById('shared-go-logic').textContent
              + '\n' + document.getElementById('worker-ai').textContent;
  const handler = `
    self.onmessage = function(e) {
      const d = e.data;
      /* Absicherung: manche mobilen WebViews feuern Worker.onerror nicht
         zuverlässig bei geworfenen Exceptions — der Spinner würde dann
         für immer hängen, ohne dass irgendein Fehler sichtbar wird.
         Deshalb fängt der Worker sich selbst ab und meldet IMMER etwas
         zurück, auch im Fehlerfall. */
      try {
        Object.assign(PARAMS, d.params);
        if (d.netPriors) {
          globalThis.policyNet = {
            _netPriors: new Float32Array(d.netPriors),
            _netHidden: null, _netInp: null,
            _netBlend: d.netBlend, _gameBuffer: [],
            blendWeight: d.netBlend
          };
        }
        const histSet = new Set(d.histHashes);
        const result = getAIMove(
          new Uint8Array(d.board), d.aiColor, histSet,
          d.captures, d.mc, 'hard', d.reqId,
          d.koPoint ?? null,                     /* Fix 7: 8. Parameter */
          d.lastMove ?? null                     /* Lokalitätsterm — fehlte in Go-v3: dort kam lastMove nie im Worker an */
        );
        if (globalThis.policyNet) globalThis.policyNet._netPriors = null;
        /* lastMsPerSim mitschicken: der Hauptthread-Watchdog hat eine
           EIGENE Kopie von _lastMsPerSim (getrennte JS-Umgebung) und
           würde ohne diese Rückmeldung für immer mit null rechnen. */
        self.postMessage({...result, reqId: d.reqId, lastMsPerSim: _lastMsPerSim});
      } catch (err) {
        self.postMessage({
          type: 'workerError',
          message: (err && err.message) || String(err),
          stack: (err && err.stack) || '',
          reqId: d.reqId,
          lastMsPerSim: _lastMsPerSim
        });
      }
    };`;
  return aiSrc + '\n' + handler;
}

function cleanupWorker() {
  if (state.aiWorker) { state.aiWorker.terminate(); state.aiWorker = null; }
  if (state.aiWorkerCtx) {
    if (state.aiWorkerCtx.url && state.aiWorkerCtx.url.startsWith('blob:'))
      URL.revokeObjectURL(state.aiWorkerCtx.url);
    state.aiWorkerCtx = null;
  }
}

function fallbackToMainThread(reqId, netInp, netPriors, netHidden) {
  setTimeout(() => {
    if (reqId !== state.aiRequestId) return;
    let r;
    try {
      r = getAIMove(state.board, state.aiColor,
        Array.from(state.boardHistory), {...state.captures},
        state.moveCount, 'hard', reqId,
        state.koPoint, state.lastMove);      /* Fix 7 + Lokalitätsterm */
    } catch (e) {
      /* Letzte Verteidigungslinie: wirft getAIMove hier, gibt es keinen
         Watchdog mehr, der uns rettet — ohne dieses catch blieb aiThinking
         für immer true und die KI hing (so gesehen in der 347-Züge-Partie:
         der Reuse-Crash tötete erst den Worker, dann denselben Code hier). */
      console.error('[Fallback] getAIMove synchron gescheitert:', e);
      state.log.push(`! KI-Fehler (synchron): ${(e && e.message) || e} → Notzug`);
      const fb = findAnyLegalMove(state.aiColor);
      r = fb ? {type:'stone', x:fb.x, y:fb.y, requestId:reqId} : {type:'pass', requestId:reqId};
    }
    applyAIResult(r, reqId, netInp, netPriors, netHidden);
  }, 10);
}

/* Worker aus data:- oder blob:-URL bauen und die Handler anhängen.
   data: zuerst — unter file:// (Origin "null") oft der einzige Weg. */
function erzeugeWorker(art) {
  const workerSrc = buildWorkerSource();
  let url;
  if (art === 'data') {
    /* UTF-8-sicheres Base64 — btoa() allein crasht an den deutschen
       Umlauten in den Kommentaren. */
    url = 'data:application/javascript;base64,' + btoa(unescape(encodeURIComponent(workerSrc)));
  } else {
    url = URL.createObjectURL(new Blob([workerSrc], {type: 'application/javascript'}));
  }
  state.aiWorker = new Worker(url);
  state.aiWorkerCtx = {url, art, antwort: false, letzteAnfrage: null, netInp: null, netPriors: null, netHidden: null};
  attachWorkerHandlers();
}

function attachWorkerHandlers() {
  state.aiWorker.onmessage = function(e) {
    const ctx = state.aiWorkerCtx;
    if (ctx) ctx.antwort = true;   /* der Worker läuft; ein späterer Fehler ist ein echter Absturz */
    /* Messwert des Workers in die Hauptthread-Kopie übernehmen — der
       Watchdog in triggerAIMove nutzt getAdaptiveTimeBudget und rechnete
       sonst für immer mit _lastMsPerSim === null (worker-ai läuft in
       beiden Umgebungen, aber die Variablen sind getrennte Kopien). */
    if (e.data && typeof e.data.lastMsPerSim === 'number')
      _lastMsPerSim = e.data.lastMsPerSim;
    /* Selbst abgefangener Fehler aus dem Worker (siehe buildWorkerSource):
       genauso behandeln wie ein echtes onerror-Event, da manche mobilen
       WebViews onerror bei geworfenen Exceptions nicht zuverlässig feuern. */
    if (e.data && e.data.type === 'workerError') {
      console.error('[Worker] Interner Fehler:', e.data.message, e.data.stack || '');
      /* Grund festhalten und ins Protokoll — der Worker-Tod in der
         347-Züge-Partie war unsichtbar, weil er nur in der Konsole stand.
         So landet er im Zugprotokoll UND im 🐞-Bug-Report. */
      state.workerDeadReason = `workerError: ${e.data.message || 'unbekannt'}`;
      state.log.push(`! Worker-Fehler: ${e.data.message || 'unbekannt'} → synchroner Modus`);
      state.workerDead = true;
      cleanupWorker();
      fallbackToMainThread(e.data.reqId,
        ctx ? ctx.netInp : null, ctx ? ctx.netPriors : null, ctx ? ctx.netHidden : null);
      return;
    }
    applyAIResult(e.data, e.data.reqId,
      ctx ? ctx.netInp : null, ctx ? ctx.netPriors : null, ctx ? ctx.netHidden : null);
  };
  state.aiWorker.onerror = function(err) {
    const ctx = state.aiWorkerCtx;
    /* Chrome lehnt einen data:-Worker manchmal erst asynchron ab, über
       onerror, nicht beim Erzeugen. Dann zuerst blob: versuchen und dieselbe
       Anfrage neu senden, statt sofort für immer auf den Hauptthread zu
       gehen (Code-Review 13.10., Punkt 5). Nur, solange der data:-Worker
       noch nie geantwortet hat. */
    if (ctx && ctx.art === 'data' && !ctx.antwort && ctx.letzteAnfrage) {
      const anfrage = ctx.letzteAnfrage, netz = {netInp: ctx.netInp, netPriors: ctx.netPriors, netHidden: ctx.netHidden};
      try {
        cleanupWorker();
        erzeugeWorker('blob');
        Object.assign(state.aiWorkerCtx, netz, {letzteAnfrage: anfrage});
        state.log.push('! data:-Worker abgelehnt → blob:-Worker');
        state.aiWorker.postMessage(anfrage);
        return;
      } catch (e2) {
        console.warn('[Worker] blob:-URL ebenfalls fehlgeschlagen:', e2.message || e2);
      }
    }
    console.error('[Worker] Fehler:', err.message || err);
    state.workerDeadReason = `onerror: ${err.message || 'unbekannt'}`;
    state.log.push(`! Worker-Crash: ${err.message || 'unbekannt'} → synchroner Modus`);
    state.workerDead = true;   /* nicht bei jedem Zug erneut versuchen */
    cleanupWorker();
    fallbackToMainThread(state.aiRequestId,
      ctx ? ctx.netInp : null, ctx ? ctx.netPriors : null, ctx ? ctx.netHidden : null);
  };
}

function triggerAIMove() {
  if (!state.aiEnabled || state.gameOver || state.currentPlayer !== state.aiColor) return;
  state.aiThinking = true;
  const reqId = ++state.aiRequestId;
  updateAIStatus(); updateUndoButton();

  /* Fix C (Tin/GLM-Review): billiger Roh-Scan für den Watchdog — NICHT
     getLegalMoves (das wäre der teure floodFill-Scan selbst). Nur zum
     Schätzen, wie viel adaptive Zeit dieser Zug bekommen wird. */
  let _emptyCount = 0;
  for (let i = 0; i < BOARD_SIZE; i++) if (state.board[i] === 0) _emptyCount++;

  let _netInp = null, _netPriors = null, _netHidden = null;
  /* BEOBACHTEN und STEUERN sind zwei verschiedene Dinge. Hier stand
     zusätzlich `policyNet.blendWeight > 0` — und daraus wurde ein
     geschlossener Kreis, der das Netz dauerhaft tot hielt:

       blendWeight ist 0, solange gamesPlayed < 2
         → _netPriors bleibt null
         → applyAIResult schiebt nichts in _gameBuffer
         → trainGame() bricht mit „Kein Buffer" ab, VOR gamesPlayed++
         → gamesPlayed bleibt 0

     Es gibt keinen Pfad aus diesem Kreis: save() läuft nur in trainGame
     und reset(), und load() verwirft alte Gewichte mit abweichender
     Dimension. Im Browser verifiziert — nach einem echten KI-Zug ist der
     Buffer leer und trainGame lässt gamesPlayed auf 0. Das Netz hat also
     noch nie gelernt, bei niemandem.

     Jetzt rechnet das Netz bei jedem Hard-Zug seine Priors und zeichnet
     sie auf; ob sie in die Zugwahl EINGEHEN, entscheidet weiterhin
     allein blendWeight (die Bedingung dafür steht in getAIMove). Kosten:
     ein Vorwärtslauf pro Zug, rund 508 000 Multiplikationen. */
  if (globalThis.policyNet && state.aiDifficulty === 'hard') {
    /* Letzten Zug mitgeben — Feature-Layer 8 war vorher immer leer */
    const _lm = state.lastMove !== null ? {x: xOf(state.lastMove), y: yOf(state.lastMove)} : null;
    policyNet._lastMove = _lm;
    _netInp = policyNet.boardToInput(state.board, state.aiColor, _lm, state.koPoint);
    const {probs, hidden} = policyNet.forward(_netInp);
    _netPriors = probs; _netHidden = hidden;
  }

  if (state.aiDifficulty === 'hard') {
    /* Bug-Report-Snapshot: exakter Zustand VOR diesem KI-Zug, in derselben
       Form wie das Worker-postMessage — damit ein Hänger später außerhalb
       des Spiels 1:1 nachgestellt werden kann (getAIMove mit genau diesen
       Daten füttern). Wird von buildBugReport() exportiert. */
    const _adaptiveBudget = getAdaptiveTimeBudget(_emptyCount);
    state.aiReqT0 = Date.now();
    state.aiReqBudget = _adaptiveBudget;
    state.lastAIRequest = {
      board:      Array.from(state.board),
      aiColor:    state.aiColor,
      histHashes: Array.from(state.boardHistory),
      captures:   {...state.captures},
      mc:         state.moveCount,
      koPoint:    state.koPoint,
      lastMove:   state.lastMove,
      params:     JSON.parse(JSON.stringify(PARAMS)),
      netBlend:   _netPriors ? policyNet.blendWeight : 0,
      lastMsPerSim: _lastMsPerSim
    };
    if (state.workerDead) { fallbackToMainThread(reqId, _netInp, _netPriors, _netHidden); return; }
    try {
      if (!state.aiWorker) {
        try { erzeugeWorker('data'); }
        catch (e1) {
          console.warn('[Worker] data:-URL fehlgeschlagen, versuche blob:', e1.message || e1);
          erzeugeWorker('blob');
        }
      }
      /* Kontext für diesen Zug merken (onmessage braucht die Priors) */
      state.aiWorkerCtx.netInp    = _netInp;
      state.aiWorkerCtx.netPriors = _netPriors;
      state.aiWorkerCtx.netHidden = _netHidden;

      const anfrage = {
        board:    Array.from(state.board),
        aiColor:  state.aiColor,
        histHashes: Array.from(state.boardHistory),
        captures: {...state.captures},
        mc:       state.moveCount,
        reqId,
        koPoint:  state.koPoint,               /* Fix 7 */
        lastMove: state.lastMove,              /* Lokalitätsterm */
        params:   JSON.parse(JSON.stringify(PARAMS)),
        netPriors: _netPriors ? Array.from(_netPriors) : null,
        netBlend:  _netPriors ? policyNet.blendWeight : 0
      };
      state.aiWorkerCtx.letzteAnfrage = anfrage;   /* für den Wechsel data: → blob: in onerror */
      state.aiWorker.postMessage(anfrage);

      /* Watchdog: falls der Worker durch eine echte Endlosschleife hängt
         (kein try/catch der Welt hilft dagegen), erzwinge nach großzügiger
         Zeit den Fallback. aiTimeBudget ist die geplante Denkzeit — das
         Dreifache plus Puffer lässt genug Luft für langsame Geräte, ohne
         bei einem echten Hänger ewig zu warten. (_adaptiveBudget wird oben
         beim Bug-Report-Snapshot berechnet — dieselbe Zahl für beide.) */
      const watchdogMs = _adaptiveBudget * 3 + 3000;
      const _watchdog = () => {
        if (reqId !== state.aiRequestId) return;   /* längst erledigt/abgebrochen */
        if (!state.aiThinking) return;             /* Antwort kam bereits an */
        /* Hintergrund-Tab: Android pausiert Worker UND Timer — ein
           suspendierter Worker ist nicht tot. Nicht töten, weiter warten;
           erst ein Timeout bei SICHTBARER Seite zählt als echter Hänger. */
        if (typeof document !== 'undefined' && document.hidden) {
          setTimeout(_watchdog, watchdogMs);
          return;
        }
        console.warn('[Worker] Watchdog: keine Antwort nach', watchdogMs, 'ms — erzwinge Fallback');
        state.workerDeadReason = `Watchdog: keine Antwort nach ${watchdogMs} ms`;
        state.log.push(`! Worker-Watchdog (${watchdogMs} ms) → synchroner Modus`);
        state.workerDead = true;
        cleanupWorker();
        fallbackToMainThread(reqId, _netInp, _netPriors, _netHidden);
      };
      setTimeout(_watchdog, watchdogMs);
    } catch(e) {
      /* Versuch 3: Hauptthread */
      console.warn('[triggerAIMove] Worker nicht verfügbar, synchron:', e);
      state.workerDead = true;
      cleanupWorker();
      fallbackToMainThread(reqId, _netInp, _netPriors, _netHidden);
    }
  } else {
    setTimeout(() => {
      if (reqId !== state.aiRequestId) return;
      if (state.gameOver || state.currentPlayer !== state.aiColor) {
        state.aiThinking = false; updateAIStatus(); return;
      }
      /* Diagnose auch auf Leicht/Mittel: bisher hingen Zeitmessung und
         Reproduktions-Snapshot am Hard-Zweig, dadurch waren in Bug-Reports
         aus diesen Stufen ALLE Felder null (dauerMs, msProSim, reproduktion)
         — genau dann also unbrauchbar, wenn man sie braucht. */
      state.aiReqT0 = Date.now();
      state.aiReqBudget = 0;              /* diese Stufen haben kein Zeitbudget */
      state.lastAIRequest = {
        board:      Array.from(state.board),
        aiColor:    state.aiColor,
        histHashes: Array.from(state.boardHistory),
        captures:   {...state.captures},
        mc:         state.moveCount,
        koPoint:    state.koPoint,
        lastMove:   state.lastMove,
        difficulty: state.aiDifficulty,
        params:     JSON.parse(JSON.stringify(PARAMS)),
        netBlend:   0,
        lastMsPerSim: _lastMsPerSim
      };
      const r = getAIMove(state.board, state.aiColor,
        Array.from(state.boardHistory), {...state.captures},
        state.moveCount, state.aiDifficulty, reqId,
        state.koPoint, state.lastMove);      /* Fix 7 + Lokalitätsterm */
      applyAIResult(r, reqId, null, null, null);
    }, 50);
  }
}

/* ═══ SGF-Export ═══
   Brücke zur externen Analyse: erzeugte Dateien lassen sich in Sabaki,
   Lizzie oder direkt von KataGo bewerten — damit gibt es endlich eine
   unabhängige Referenz für Zugqualität statt nur Engine-gegen-Engine.
   Koordinaten: unser y=0 ist die oberste Reihe (coordToLabel nutzt SIZE-y),
   SGF-Zeile 'a' ebenfalls → direkte Abbildung, kein Spiegeln.
   Gegenprobe: Q16 = x15,y3 → "pd", der Standard-SGF-Eröffnungszug. */
function buildSGF() {
  const L = i => String.fromCharCode(97 + i);          // 0..18 → a..s
  const esc = t => String(t).replace(/([\]\\])/g, '\\$1');
  const rules = state.scoringMode === 'territory' ? 'Japanese' : 'Chinese';
  const d = new Date();
  const dt = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  let pb = 'Schwarz', pw = 'Weiß';
  if (state.aiEnabled) {
    const tag = `KI (${state.aiDifficulty})`;
    if (state.aiColor === 1) pb = tag; else pw = tag;
  }

  let head = `(;GM[1]FF[4]CA[UTF-8]AP[Go-Dashboard]SZ[${SIZE}]KM[${KOMI}]RU[${rules}]`
           + `PB[${esc(pb)}]PW[${esc(pw)}]DT[${dt}]`;

  if (state.resignedBy) {
    head += `RE[${state.resignedBy === 1 ? 'W' : 'B'}+R]`;   /* Gegner der aufgebenden Farbe gewinnt */
  } else if (state.gameOver) {
    let sb, sw;
    if (state.scoringMode === 'territory') { const t = finalTerritoryScore(); sb = t[1]; sw = t[2] + KOMI; }
    else { const a = finalAreaScore(); sb = a[1]; sw = a[2] + KOMI; }
    const diff = Math.abs(sb - sw).toFixed(1);
    head += `RE[${sb > sw ? 'B' : 'W'}+${diff}]`;
  }

  let body = '';
  for (const m of state.sgfMoves) {
    const c = m.c === 1 ? 'B' : 'W';
    body += m.pass ? `;${c}[]` : `;${c}[${L(m.x)}${L(m.y)}]`;
  }
  return head + '\n' + body + ')\n';
}

function downloadSGF() {
  if (!state.sgfMoves.length) { updateUI('Noch keine Züge zum Exportieren.'); return; }
  try {
    const blob = new Blob([buildSGF()], {type: 'application/x-go-sgf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `go_${state.sgfMoves.length}zuege_${Date.now()}.sgf`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.warn('[SGF] Download fehlgeschlagen, Fallback Zwischenablage:', e);
    const t = document.createElement('textarea');
    t.value = buildSGF(); t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); updateUI('SGF in Zwischenablage kopiert.'); } catch (e2) {}
    document.body.removeChild(t);
  }
}

function findAnyLegalMove(color) {
  const opp = color === 1 ? 2 : 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (state.board[i] !== 0) continue;
    if (state.koPoint !== null && i === state.koPoint) continue;   /* Fix 7 */
    const test = cloneBoard(state.board); test[i] = color;
    const cap = removeDeadGroups(test, opp, i);
    if (cap > 0 && !state.boardHistory.has(computeZobrist(test)))
      return {x: xOf(i), y: yOf(i)};
  }
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (state.board[i] !== 0) continue;
    if (state.koPoint !== null && i === state.koPoint) continue;   /* Fix 7 */
    const test = cloneBoard(state.board); test[i] = color;
    const cap = removeDeadGroups(test, opp, i);
    if (cap === 0 && floodFill(test, i).liberties.length === 0) continue;
    /* Kein eigenes Auge füllen: lieber passen (null) als die eigene Gruppe
       umbringen. */
    if (cap === 0 && fuelltEigenesAuge(state.board, i, color)) continue;
    if (!state.boardHistory.has(computeZobrist(test)))
      return {x: xOf(i), y: yOf(i)};
  }
  return null;
}

const canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
let layout = {}, grainCanvas = null;
let boardCache = document.createElement('canvas'), stateCache = document.createElement('canvas');
const bCtx = boardCache.getContext('2d'), sCtx = stateCache.getContext('2d');

function computeLayout() {
  const max = Math.min(innerWidth * 0.92, innerHeight * 0.82, 640);
  const M = Math.round(max / 22), C = Math.round((max - M*2) / (SIZE-1));
  return {MARGIN: M, CELL: C, S: M*2 + C*(SIZE-1)};
}

function generateGrain() {
  const {S} = layout; grainCanvas = document.createElement('canvas');
  grainCanvas.width = grainCanvas.height = S;
  const g = grainCanvas.getContext('2d'); g.fillStyle = '#c8a05a'; g.fillRect(0,0,S,S);
  for (let i = 0; i < 30; i++) {
    const px = Math.random()*S; g.beginPath(); g.moveTo(px,0); g.lineTo(px+8,S);
    g.strokeStyle = `rgba(0,0,0,${0.012+Math.random()*0.012})`;
    g.lineWidth = 0.6+Math.random(); g.stroke();
  }
}

function drawBoardToCache() {
  const {MARGIN:M, CELL:C, S} = layout, c = bCtx;
  c.drawImage(grainCanvas, 0, 0);
  c.strokeStyle = '#5a3a10'; c.lineWidth = 0.8;
  for (let i = 0; i < SIZE; i++) {
    const p = M + i*C;
    c.beginPath(); c.moveTo(p, M); c.lineTo(p, M+(SIZE-1)*C); c.stroke();
    c.beginPath(); c.moveTo(M, p); c.lineTo(M+(SIZE-1)*C, p); c.stroke();
  }
  c.strokeStyle = '#4a2e08'; c.lineWidth = 1.5;
  c.strokeRect(M, M, (SIZE-1)*C, (SIZE-1)*C);
  c.fillStyle = '#5a3a10';
  c.font = `${Math.round(C*0.38)}px 'Noto Sans Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < SIZE; i++) {
    const gx = M + i*C, gy = M + i*C;
    c.fillText(COL_LETTERS[i], gx, M/2); c.fillText(COL_LETTERS[i], gx, S-M/2);
    c.fillText(String(SIZE-i), M/2, gy); c.fillText(String(SIZE-i), S-M/2, gy);
  }
  c.fillStyle = '#4a2e08';
  for (const [hx,hy] of HOSHI_XY) {
    c.beginPath(); c.arc(M+hx*C, M+hy*C, C*0.13, 0, Math.PI*2); c.fill();
  }
}

function drawStoneTo(ct, x, y, color, isDead) {
  const {MARGIN:M, CELL:C} = layout, cx = M+x*C, cy = M+y*C, r = C*0.46;
  ct.beginPath(); ct.arc(cx, cy, r, 0, Math.PI*2);
  if (color === 1) {
    const g = ct.createRadialGradient(cx-r*.3, cy-r*.3, r*.05, cx, cy, r);
    g.addColorStop(0,'#666'); g.addColorStop(.3,'#2a2a2a'); g.addColorStop(1,'#0d0d0d');
    ct.shadowColor='rgba(0,0,0,.6)'; ct.shadowBlur=C*.25;
    ct.shadowOffsetX=C*.06; ct.shadowOffsetY=C*.08;
    ct.fillStyle=g; ct.fill(); ct.shadowColor='transparent';
    ct.beginPath(); ct.arc(cx-r*.28, cy-r*.28, r*.22, 0, Math.PI*2);
    ct.fillStyle='rgba(255,255,255,.15)'; ct.fill();
  } else {
    const g = ct.createRadialGradient(cx-r*.3, cy-r*.35, r*.05, cx, cy, r);
    g.addColorStop(0,'#fff'); g.addColorStop(.5,'#ede8df'); g.addColorStop(1,'#c8c0b0');
    ct.shadowColor='rgba(0,0,0,.45)'; ct.shadowBlur=C*.22;
    ct.shadowOffsetX=C*.05; ct.shadowOffsetY=C*.07;
    ct.fillStyle=g; ct.fill(); ct.shadowColor='transparent';
    ct.strokeStyle='rgba(120,100,70,.35)'; ct.lineWidth=0.6; ct.stroke();
    ct.beginPath(); ct.arc(cx-r*.28, cy-r*.3, r*.2, 0, Math.PI*2);
    ct.fillStyle='rgba(255,255,255,.7)'; ct.fill();
  }
  if (isDead) {
    ct.strokeStyle='#c0392b'; ct.lineWidth=3; ct.beginPath();
    ct.moveTo(cx-r*.6,cy-r*.6); ct.lineTo(cx+r*.6,cy+r*.6);
    ct.moveTo(cx+r*.6,cy-r*.6); ct.lineTo(cx-r*.6,cy+r*.6); ct.stroke();
  }
}

function drawStateToCache() {
  sCtx.drawImage(boardCache, 0, 0);
  for (let i = 0; i < BOARD_SIZE; i++)
    if (state.board[i]) drawStoneTo(sCtx, xOf(i), yOf(i), state.board[i], state.deadStones.has(i));
  /* Letzter-Zug-Markierung */
  const lm = state.lastMove;
  if (lm !== null && state.board[lm]) {
    const {MARGIN:M, CELL:C} = layout;
    sCtx.beginPath();
    sCtx.arc(M + xOf(lm)*C, M + yOf(lm)*C, C*0.2, 0, Math.PI*2);
    sCtx.strokeStyle = state.board[lm] === 1 ? 'rgba(255,255,255,.85)' : 'rgba(0,0,0,.6)';
    sCtx.lineWidth = Math.max(1.5, C*0.07);
    sCtx.stroke();
  }
}

function resizeCanvas() {
  layout = computeLayout();
  canvas.width = canvas.height = layout.S;
  boardCache.width = boardCache.height = layout.S;
  stateCache.width = stateCache.height = layout.S;
  generateGrain(); drawBoardToCache(); drawStateToCache();
}
resizeCanvas();

function render() { ctx.drawImage(stateCache, 0, 0); }

function drawGhost(col, row) {
  const {MARGIN:M, CELL:C} = layout;
  ctx.beginPath(); ctx.arc(M+col*C, M+row*C, C*0.44, 0, Math.PI*2);
  ctx.fillStyle = state.currentPlayer===1 ? 'rgba(28,28,28,.4)' : 'rgba(242,237,228,.5)';
  ctx.fill();
}

const elStone=document.getElementById('turn-stone'), elLabel=document.getElementById('turn-label');
const elCapB=document.getElementById('captures-b'), elCapW=document.getElementById('captures-w');
const elMsg=document.getElementById('message'), elLog=document.getElementById('log');
const elAI=document.getElementById('ai-status');

function updateUI(msg='') {
  if (window.policyNet) {
    const nwEl = document.getElementById('nw-indicator');
    if (nwEl) {
      const bw = policyNet.blendWeight;
      if (bw <= 0) { nwEl.textContent='🧠'; nwEl.style.opacity='.35';
        /* Zwei verschiedene Gründe für blendWeight 0 — sie zu verwechseln
           hat das tote Netz lange verdeckt. */
        nwEl.title = PARAMS.netMaxBlend <= 0
          ? `PolicyNet: lernt mit, steuert nicht (netMaxBlend 0) · ${policyNet.gamesPlayed} Spiele`
          : `PolicyNet: Warmup · ${policyNet.gamesPlayed} von ${PARAMS.netWarmup} Spielen`;
      }
      else { nwEl.textContent=`🧠${(bw*100).toFixed(0)}%`; nwEl.title=`PolicyNet aktiv · ${policyNet.gamesPlayed} Spiele · ${Math.round(policyNet.wins/policyNet.gamesPlayed*100)}% Siege`; nwEl.style.opacity='1'; nwEl.style.color=bw>0.15?'var(--green)':'var(--wood)'; }
    }
    policyNet.dashUpdate();
  }
  const isB = state.currentPlayer===1;
  elStone.className=isB?'black':'white'; elLabel.textContent=isB?'Schwarz':'Weiß';
  elCapB.textContent=state.captures[1]; elCapW.textContent=state.captures[2];
  elMsg.textContent=state.gameOver?'Spiel beendet':(msg||'–');
  /* Als Text, nicht als HTML: das Log nimmt auch Fehlermeldungen des Workers
     auf, und nichts davon soll je als Markup gelesen werden. */
  elLog.textContent = '';
  for (const l of state.log.slice(-40)) {
    const d = document.createElement('div');
    d.textContent = l;
    elLog.appendChild(d);
  }
  elLog.scrollTop=elLog.scrollHeight;
}

function updateAIStatus() {
  const labels={easy:'Leicht',medium:'Mittel',hard:'Schwer'};
  const side=state.aiColor===1?'Schwarz':'Weiß';
  if(!state.aiEnabled){elAI.textContent='KI ist deaktiviert';elAI.className='ai-status';return;}
  elAI.textContent=state.aiThinking?'KI denkt...':`KI aktiv · ${side} · ${labels[state.aiDifficulty]}`;
  elAI.className=`ai-status${state.aiThinking?' ai-thinking':''}`;
}

function eventToBoard(e, hitRadius) {
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const{MARGIN:M,CELL:C}=layout;
  const col=Math.round((mx-M)/C),row=Math.round((my-M)/C);
  if(col<0||col>=SIZE||row<0||row>=SIZE)return null;
  if(Math.hypot(mx-(M+col*C),my-(M+row*C))>C*hitRadius)return null;
  return {col,row};
}

function commitMove(col,row){
  const res=placeStone(col,row);render();updateUI(res.ok?'':res.reason);
  if(res.ok&&!state.gameOver&&!humanTurn())triggerAIMove();
}

/* pointerup statt click: Maus setzt direkt; Touch braucht zwei Tipps
   (1. Tipp = Vorschau + Koordinate, 2. Tipp auf denselben Punkt = setzen).
   Fangradius für Finger großzügiger als für die Maus. */
canvas.addEventListener('pointerup', e => {
  if(state.gameOver||!humanTurn())return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const isTouch = e.pointerType!=='mouse';
  const pos = eventToBoard(e, isTouch?0.68:0.48);
  if(!pos){ pendingTouch=null; render(); return; }
  if(!isTouch){ commitMove(pos.col,pos.row); return; }
  if(pendingTouch&&pendingTouch.col===pos.col&&pendingTouch.row===pos.row){
    pendingTouch=null;
    commitMove(pos.col,pos.row);
  } else if(state.board[idx(pos.col,pos.row)]===0){
    pendingTouch=pos;
    render(); drawGhost(pos.col,pos.row);
    updateUI(`${coordToLabel(pos.col,pos.row)} — erneut tippen zum Setzen`);
  } else {
    pendingTouch=null; render();
  }
});

canvas.addEventListener('mousemove', e => {
  if(state.gameOver||!humanTurn()||pendingTouch)return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const{MARGIN:M,CELL:C}=layout;
  const col=Math.round((mx-M)/C),row=Math.round((my-M)/C);
  render();
  if(col>=0&&col<SIZE&&row>=0&&row<SIZE&&state.board[idx(col,row)]===0)drawGhost(col,row);
});
canvas.addEventListener('mouseleave',()=>{
  render();
  if(pendingTouch)drawGhost(pendingTouch.col,pendingTouch.row);
});

document.getElementById('btn-ai-toggle').addEventListener('click',function(){
  state.aiEnabled=!state.aiEnabled;
  this.textContent=state.aiEnabled?'KI deaktivieren':'KI aktivieren';
  this.classList.toggle('active-mode',state.aiEnabled);
  updateAIStatus();
  if(state.aiEnabled&&!state.gameOver&&!humanTurn())triggerAIMove();
});

document.querySelectorAll('.diff-btn').forEach(btn=>btn.addEventListener('click',function(){

document.querySelectorAll('.color-btn').forEach(btn=>btn.addEventListener('click',function(){
  document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
  this.classList.add('active');state.aiColor=parseInt(this.dataset.color);updateAIStatus();

function copyWithFeedback(text, btnId, idleLabel) {
  const done = () => {
    const btn = document.getElementById(btnId);
    btn.textContent = '✓'; btn.style.color = 'var(--green)';
    setTimeout(() => { btn.textContent = idleLabel; btn.style.color = ''; }, 1500);
  };
  navigator.clipboard.writeText(text).then(done).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  });
}

/* ═══ Bug-Report: Zugprotokoll + exakter Reproduktions-Zustand ═══
   Kombiniert alles, was zum Nachstellen eines KI-Problems nötig ist:
   - zugprotokoll: die menschenlesbare Zugliste (wie 📋)
   - kiDiagnose:   pro KI-Zug Sims/Q aus info, echte Dauer vs. Budget, ms/Sim
   - brett:        ASCII-Brett des AKTUELLEN Zustands (X=Schwarz, O=Weiß)
   - reproduktion: der letzte Worker-Request 1:1 (Brett, Historie-Hashes,
     Gefangene, Ko-Punkt, PARAMS) — getAIMove damit füttern reproduziert
     exakt den Zug, bei dem es geklemmt hat. Genau das fehlte beim nicht
     reproduzierbaren Hänger nach Zug 185. */
function buildBugReport() {
  const rows = [];
  for (let y = 0; y < SIZE; y++) {
    let r = '';
    for (let x = 0; x < SIZE; x++) r += '.XO'[state.board[idx(x, y)]] + ' ';
    rows.push(String(SIZE - y).padStart(2) + ' ' + r.trimEnd());
  }
  rows.push('   ' + COL_LETTERS.split('').join(' '));
  return JSON.stringify({
    meta: {
      erstellt:   new Date().toISOString(),
      userAgent:  navigator.userAgent,
      zug:        state.moveCount,
      amZug:      state.currentPlayer === 1 ? 'Schwarz' : 'Weiß',
      kiFarbe:    state.aiColor === 1 ? 'Schwarz' : 'Weiß',
      kiStufe:    state.aiDifficulty,
      kiDenkt:    state.aiThinking,
      workerDead: state.workerDead,
      workerDeadReason: state.workerDeadReason || null,
      spielVorbei: state.gameOver,
      koPoint:    state.koPoint,
      gefangene:  {...state.captures},
      msProSim:   typeof _lastMsPerSim === 'number' ? Math.round(_lastMsPerSim * 100) / 100 : null
    },
    brett: rows,
    zugprotokoll: state.log,
    kiDiagnose: state.aiDiag,
    reproduktion: state.lastAIRequest
  }, null, 1);
}

document.getElementById('btn-bug-report').addEventListener('click', () => {
