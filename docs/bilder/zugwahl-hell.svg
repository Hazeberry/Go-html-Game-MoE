<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1480" viewBox="0 0 920 1480" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel beschr">
<title id="titel">Wie die KI einen Zug findet</title><desc id="beschr">Stellung, legale Züge, Filter (Benson, augenSchutz), Zugbewertung als Mischung von Experten mit Gebiet und Krise, Pass-Prüfung, optionale Taktik-Schalter, Monte-Carlo-Suche mit PUCT, Rollouts und tanh(evaluateBoard/200), Aufgabe-Prüfung, dann der meistbesuchte Zug.</desc>
<defs><marker id="spitze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="spitzeA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<rect width="920" height="1480" rx="8" fill="#fcfcfb"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Wie die KI einen Zug findet</text>
<text x="24" y="58" font-size="13" fill="#52514e" text-anchor="start">Der Weg durch getAIMove auf Stufe „Schwer“, mit den heutigen Defaults. Gestrichelt: Schalter, die im Default aus sind.</text>
<text x="24" y="78" font-size="13" fill="#52514e" text-anchor="start">Rechts die Ausgänge: Hier kann die KI passen oder aufgeben, statt zu ziehen.</text>
<rect x="32" y="104" width="600" height="58" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="46" y="125" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Stellung</text>
<text x="46" y="144" font-size="12.5" fill="#52514e" text-anchor="start">Brett, Ko-Punkt, Gefangene und alle bisherigen Stellungen</text>
<line x1="332" y1="162" x2="332" y2="185" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="188" width="600" height="58" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="46" y="209" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Legale Züge</text>
<text x="618" y="209" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">getLegalMoves</text>
<text x="46" y="228" font-size="12.5" fill="#52514e" text-anchor="start">kein Selbstmord, kein Ko, kein Superko</text>
<line x1="332" y1="246" x2="332" y2="269" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="272" width="600" height="76" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="46" y="293" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Filter</text>
<text x="46" y="312" font-size="12.5" fill="#52514e" text-anchor="start">Benson: Züge, deren Stein beweisbar tot geboren wäre, fallen weg</text>
<text x="46" y="329.5" font-size="12.5" fill="#52514e" text-anchor="start">augenSchutz: eigene echte Augen werden nicht gefüllt</text>
<line x1="635" y1="310" x2="697" y2="310" stroke="#eb6834" stroke-width="1.5" marker-end="url(#spitzeA)"/>
<rect x="700" y="295" width="190" height="30" rx="15" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="795" y="315" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Pass: nichts übrig</text>
<line x1="332" y1="348" x2="332" y2="371" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="374" width="600" height="320" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="46" y="395" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Zugbewertung: Mischung von Experten</text>
<text x="618" y="395" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">evaluateMove</text>
<text x="46" y="414" font-size="12.5" fill="#52514e" text-anchor="start">Jeder Zug bekommt einen Wert; die Partiephase gewichtet drei Experten:</text>
<rect x="46" y="440" width="184" height="56" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="461" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Eröffnung</text>
<text x="60" y="480" font-size="12" fill="#52514e" text-anchor="start">bis etwa Zug 20</text>
<rect x="240" y="440" width="184" height="56" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="254" y="461" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Mittelspiel</text>
<text x="254" y="480" font-size="12" fill="#52514e" text-anchor="start">Ketten, Freiheiten</text>
<rect x="434" y="440" width="184" height="56" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="448" y="461" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Endspiel</text>
<text x="448" y="480" font-size="12" fill="#52514e" text-anchor="start">ab Zug 80 oder Enge</text>
<rect x="46" y="508" width="572" height="56" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="529" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">+ Gebiet</text>
<text x="604" y="529" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gebietZug 80</text>
<text x="60" y="548" font-size="12" fill="#52514e" text-anchor="start">80 × Gebietsgewinn des Zuges auf der Bouzy-Einflusskarte</text>
<rect x="46" y="574" width="572" height="56" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="595" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">+ Krise</text>
<text x="604" y="595" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">evalTsumego</text>
<text x="60" y="614" font-size="12" fill="#52514e" text-anchor="start">Atari, Augen, Nakade: in Krisenzonen wird Taktik eingemischt</text>
<rect x="46" y="640" width="572" height="40" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1" stroke-dasharray="5 4"/>
<text x="60" y="665" font-size="12" fill="#52514e" text-anchor="start">Policy-Netz: lernt mit, steuert nicht (netMaxBlend 0)</text>
<line x1="332" y1="694" x2="332" y2="717" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="720" width="600" height="96" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="46" y="741" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Pass-Prüfung</text>
<text x="46" y="760" font-size="12.5" fill="#52514e" text-anchor="start">Ist der beste Wert für diese Partiephase zu klein?</text>
<text x="46" y="777.5" font-size="12.5" fill="#52514e" text-anchor="start">Dann passt die KI, außer eine eigene Kette steht im Atari oder dem Gegner</text>
<text x="46" y="795" font-size="12.5" fill="#52514e" text-anchor="start">winkt ein großer Zug, den ein eigener Zug abwenden kann (passUnabwendbar).</text>
<line x1="635" y1="768" x2="697" y2="768" stroke="#eb6834" stroke-width="1.5" marker-end="url(#spitzeA)"/>
<rect x="700" y="753" width="190" height="30" rx="15" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="795" y="773" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Pass</text>
<line x1="332" y1="816" x2="332" y2="839" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="842" width="600" height="58" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1" stroke-dasharray="5 4"/>
<text x="46" y="863" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Taktik-Schalter</text>
<text x="46" y="882" font-size="12.5" fill="#52514e" text-anchor="start">leseRettung, krisenKandidaten, gegnerWert: heben einzelne Kandidaten an</text>
<line x1="635" y1="871" x2="697" y2="871" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#spitze)"/>
<rect x="700" y="844" width="190" height="54" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="714" y="865" font-size="12" fill="#52514e" text-anchor="start">Leicht / Mittel: Zufall</text>
<text x="714" y="882" font-size="12" fill="#52514e" text-anchor="start">unter den besten 25 % / 8 %</text>
<line x1="332" y1="900" x2="332" y2="923" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="926" width="600" height="366" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="46" y="947" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Suche: Monte-Carlo-Baum mit PUCT</text>
<text x="618" y="947" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mctsPUCT</text>
<text x="46" y="966" font-size="12.5" fill="#52514e" text-anchor="start">Simulationen nach Zeitbudget; der Baum wird im nächsten Zug weiterverwendet.</text>
<rect x="46" y="980" width="572" height="58" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="1001" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Wurzel</text>
<text x="60" y="1020" font-size="12" fill="#52514e" text-anchor="start">die 16 besten Kandidaten aus der Zugbewertung, Prior per Softmax</text>
<rect x="46" y="1048" width="572" height="58" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="1069" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Auswahl</text>
<text x="60" y="1088" font-size="12" fill="#52514e" text-anchor="start">Q + 1,4 · P · √N / (1 + n), dazu RAVE; innere Knoten mit 8 Kindern</text>
<rect x="46" y="1116" width="572" height="76" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="1137" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Blatt: Rollout</text>
<text x="60" y="1156" font-size="12" fill="#52514e" text-anchor="start">24 Halbzüge, jeweils zufällig unter den 3 bzw. 6 besten Zügen</text>
<text x="60" y="1173" font-size="12" fill="#52514e" text-anchor="start">nach quickEval, ohne eigene Augen zu füllen</text>
<rect x="46" y="1202" width="572" height="76" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="1223" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Wert</text>
<text x="60" y="1242" font-size="12" fill="#52514e" text-anchor="start">tanh(evaluateBoard / 200), aus Sicht der KI zwischen −1 und +1</text>
<text x="60" y="1259" font-size="12" fill="#52514e" text-anchor="start">evaluateBoard = Gefangene × 20 + je Kette Größe × 5 + Freiheiten × 3</text>
<line x1="332" y1="1292" x2="332" y2="1315" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="1318" width="600" height="58" rx="6" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="46" y="1339" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Aufgabe-Prüfung</text>
<text x="46" y="1358" font-size="12.5" fill="#52514e" text-anchor="start">Q ≤ −0,95 in 5 Zügen in Folge (ab Zug 60), und die Gebietsschätzung sagt verloren</text>
<line x1="635" y1="1347" x2="697" y2="1347" stroke="#eb6834" stroke-width="1.5" marker-end="url(#spitzeA)"/>
<rect x="700" y="1332" width="190" height="30" rx="15" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="795" y="1352" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Aufgabe</text>
<line x1="332" y1="1376" x2="332" y2="1399" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="192" y="1402" width="280" height="34" rx="17" fill="#2a78d6"/>
<text x="332" y="1424" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Zug: das meistbesuchte Kind</text>
<text x="24" y="1464" font-size="11" fill="#898781" text-anchor="start">Erzeugt mit auswertung/architektur.js. Die Zahlen sind Defaults und im Dashboard einstellbar.</text>
</svg>
