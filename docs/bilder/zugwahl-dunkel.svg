<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1516" viewBox="0 0 920 1516" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel beschr">
<title id="titel">Wie die KI einen Zug findet</title><desc id="beschr">Stellung, legale Züge, Filter (Benson, augenSchutz), Zugbewertung als Mischung von Experten mit Gebiet und Krise, Pass-Prüfung, optionale Taktik-Schalter, Monte-Carlo-Suche mit PUCT, Rollouts und tanh(evaluateBoard/200), Aufgabe-Prüfung, dann der meistbesuchte Zug.</desc>
<defs><marker id="spitze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="spitzeA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker></defs>
<rect width="920" height="1516" rx="8" fill="#1a1a19"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start">Wie die KI einen Zug findet</text>
<text x="24" y="58" font-size="13" fill="#c3c2b7" text-anchor="start">Der Weg durch getAIMove auf Stufe „Schwer“, mit den heutigen Defaults. Gestrichelt: Schalter, die im Default aus sind.</text>
<text x="24" y="78" font-size="13" fill="#c3c2b7" text-anchor="start">Rechts die Ausgänge: Hier kann die KI passen oder aufgeben, statt zu ziehen.</text>
<rect x="32" y="104" width="600" height="58" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="46" y="125" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Stellung</text>
<text x="46" y="144" font-size="12.5" fill="#c3c2b7" text-anchor="start">Brett, Ko-Punkt, Gefangene und alle bisherigen Stellungen</text>
<line x1="332" y1="162" x2="332" y2="185" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="188" width="600" height="58" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="46" y="209" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Legale Züge</text>
<text x="618" y="209" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">getLegalMoves</text>
<text x="46" y="228" font-size="12.5" fill="#c3c2b7" text-anchor="start">kein Selbstmord, kein Ko, kein Superko</text>
<line x1="332" y1="246" x2="332" y2="269" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="272" width="600" height="94" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="46" y="293" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Filter</text>
<text x="46" y="312" font-size="12.5" fill="#c3c2b7" text-anchor="start">Benson: Züge, deren Stein beweisbar tot geboren wäre, fallen weg</text>
<text x="46" y="329.5" font-size="12.5" fill="#c3c2b7" text-anchor="start">augenSchutz: eigene echte Augen werden nicht gefüllt</text>
<text x="46" y="347" font-size="12.5" fill="#c3c2b7" text-anchor="start">leseVerzicht: keine Züge, deren Kette der Leser sofort fängt</text>
<line x1="635" y1="310" x2="697" y2="310" stroke="#d95926" stroke-width="1.5" marker-end="url(#spitzeA)"/>
<rect x="700" y="295" width="190" height="30" rx="15" fill="#1a1a19" stroke="#d95926" stroke-width="1.5"/>
<text x="795" y="315" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Pass: nichts übrig</text>
<line x1="332" y1="366" x2="332" y2="389" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="392" width="600" height="320" rx="6" fill="#1b2533" stroke="#3987e5" stroke-width="1.5"/>
<text x="46" y="413" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Zugbewertung: Mischung von Experten</text>
<text x="618" y="413" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">evaluateMove</text>
<text x="46" y="432" font-size="12.5" fill="#c3c2b7" text-anchor="start">Jeder Zug bekommt einen Wert; die Partiephase gewichtet drei Experten:</text>
<rect x="46" y="458" width="184" height="56" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="60" y="479" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Eröffnung</text>
<text x="60" y="498" font-size="12" fill="#c3c2b7" text-anchor="start">bis etwa Zug 20</text>
<rect x="240" y="458" width="184" height="56" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="254" y="479" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Mittelspiel</text>
<text x="254" y="498" font-size="12" fill="#c3c2b7" text-anchor="start">Ketten, Freiheiten</text>
<rect x="434" y="458" width="184" height="56" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="448" y="479" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Endspiel</text>
<text x="448" y="498" font-size="12" fill="#c3c2b7" text-anchor="start">ab Zug 80 oder Enge</text>
<rect x="46" y="526" width="572" height="56" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="60" y="547" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">+ Gebiet</text>
<text x="604" y="547" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gebietZug 80</text>
<text x="60" y="566" font-size="12" fill="#c3c2b7" text-anchor="start">80 × Gebietsgewinn des Zuges auf der Bouzy-Einflusskarte</text>
<rect x="46" y="592" width="572" height="56" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="60" y="613" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">+ Krise</text>
<text x="604" y="613" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">evalTsumego</text>
<text x="60" y="632" font-size="12" fill="#c3c2b7" text-anchor="start">Atari, Augen, Nakade: in Krisenzonen wird Taktik eingemischt</text>
<rect x="46" y="658" width="572" height="40" rx="6" fill="#1a1a19" stroke="#898781" stroke-width="1" stroke-dasharray="5 4"/>
<text x="60" y="683" font-size="12" fill="#c3c2b7" text-anchor="start">Policy-Netz: lernt mit, steuert nicht (netMaxBlend 0)</text>
<line x1="332" y1="712" x2="332" y2="735" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="738" width="600" height="96" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="46" y="759" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Pass-Prüfung</text>
<text x="46" y="778" font-size="12.5" fill="#c3c2b7" text-anchor="start">Ist der beste Wert für diese Partiephase zu klein?</text>
<text x="46" y="795.5" font-size="12.5" fill="#c3c2b7" text-anchor="start">Dann passt die KI, außer eine eigene Kette steht im Atari oder dem Gegner</text>
<text x="46" y="813" font-size="12.5" fill="#c3c2b7" text-anchor="start">winkt ein großer Zug, den ein eigener Zug abwenden kann (passUnabwendbar).</text>
<line x1="635" y1="786" x2="697" y2="786" stroke="#d95926" stroke-width="1.5" marker-end="url(#spitzeA)"/>
<rect x="700" y="771" width="190" height="30" rx="15" fill="#1a1a19" stroke="#d95926" stroke-width="1.5"/>
<text x="795" y="791" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Pass</text>
<line x1="332" y1="834" x2="332" y2="857" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="860" width="600" height="58" rx="6" fill="#1a1a19" stroke="#898781" stroke-width="1" stroke-dasharray="5 4"/>
<text x="46" y="881" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Taktik-Schalter</text>
<text x="46" y="900" font-size="12.5" fill="#c3c2b7" text-anchor="start">leseRettung, krisenKandidaten, gegnerWert: heben einzelne Kandidaten an</text>
<line x1="635" y1="889" x2="697" y2="889" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#spitze)"/>
<rect x="700" y="862" width="190" height="54" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="714" y="883" font-size="12" fill="#c3c2b7" text-anchor="start">Leicht / Mittel: Zufall</text>
<text x="714" y="900" font-size="12" fill="#c3c2b7" text-anchor="start">unter den besten 25 % / 8 %</text>
<line x1="332" y1="918" x2="332" y2="941" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="944" width="600" height="384" rx="6" fill="#1b2533" stroke="#3987e5" stroke-width="1.5"/>
<text x="46" y="965" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Suche: Monte-Carlo-Baum mit PUCT</text>
<text x="618" y="965" font-size="11.5" fill="#898781" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mctsPUCT</text>
<text x="46" y="984" font-size="12.5" fill="#c3c2b7" text-anchor="start">Simulationen nach Zeitbudget; der Baum wird im nächsten Zug weiterverwendet.</text>
<rect x="46" y="998" width="572" height="76" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="60" y="1019" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Wurzel</text>
<text x="60" y="1038" font-size="12" fill="#c3c2b7" text-anchor="start">die 16 besten Kandidaten aus der Zugbewertung, Prior per Softmax;</text>
<text x="60" y="1055" font-size="12" fill="#c3c2b7" text-anchor="start">auch bei übernommenem Baum (wurzelFrisch), mit dessen Besuchen</text>
<rect x="46" y="1084" width="572" height="58" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="60" y="1105" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Auswahl</text>
<text x="60" y="1124" font-size="12" fill="#c3c2b7" text-anchor="start">Q + 1,4 · P · √N / (1 + n), dazu RAVE; innere Knoten mit 8 Kindern</text>
<rect x="46" y="1152" width="572" height="76" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="60" y="1173" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Blatt: Rollout</text>
<text x="60" y="1192" font-size="12" fill="#c3c2b7" text-anchor="start">24 Halbzüge, jeweils zufällig unter den 3 bzw. 6 besten Zügen</text>
<text x="60" y="1209" font-size="12" fill="#c3c2b7" text-anchor="start">nach quickEval, ohne eigene Augen zu füllen</text>
<rect x="46" y="1238" width="572" height="76" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="60" y="1259" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Wert</text>
<text x="60" y="1278" font-size="12" fill="#c3c2b7" text-anchor="start">tanh(evaluateBoard / 200), aus Sicht der KI zwischen −1 und +1</text>
<text x="60" y="1295" font-size="12" fill="#c3c2b7" text-anchor="start">evaluateBoard = Gefangene × 20 + je Kette Größe × 5 + Freiheiten × 3</text>
<line x1="332" y1="1328" x2="332" y2="1351" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="32" y="1354" width="600" height="58" rx="6" fill="#242423" stroke="#4a4a46" stroke-width="1"/>
<text x="46" y="1375" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Aufgabe-Prüfung</text>
<text x="46" y="1394" font-size="12.5" fill="#c3c2b7" text-anchor="start">Q ≤ −0,95 in 5 Zügen in Folge (ab Zug 60), und die Gebietsschätzung sagt verloren</text>
<line x1="635" y1="1383" x2="697" y2="1383" stroke="#d95926" stroke-width="1.5" marker-end="url(#spitzeA)"/>
<rect x="700" y="1368" width="190" height="30" rx="15" fill="#1a1a19" stroke="#d95926" stroke-width="1.5"/>
<text x="795" y="1388" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Aufgabe</text>
<line x1="332" y1="1412" x2="332" y2="1435" stroke="#898781" stroke-width="1.5" marker-end="url(#spitze)"/>
<rect x="192" y="1438" width="280" height="34" rx="17" fill="#3987e5"/>
<text x="332" y="1460" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Zug: das meistbesuchte Kind</text>
<text x="24" y="1500" font-size="11" fill="#898781" text-anchor="start">Erzeugt mit auswertung/architektur.js. Die Zahlen sind Defaults und im Dashboard einstellbar.</text>
</svg>
