name: Prüfstand Fuego ohne Vorgabe

# Manueller Lauf aus docs/muster-fuego-siege.md §3: der Default D ohne Vorgabe
# (Farben wechseln je Partie, Komi 7,5) gegen Fuego mit 10, 20, 30, 50 und
# 70 Spielen je Zug, je 120 Partien, Seed 227. Gewählt wird die Spielzahl, bei
# der D 40 bis 50 % gewinnt (gerade-wahl.js).
#
# Ablauf:
#   fuego-bauen   Fuego einmal bauen (SVN r2038, C++14)
#   fuego         D gegen Fuego × 5 Spielzahlen × 4 Teile zu 30 Partien
#   ergebnis      Bericht, Rohdaten gepackt, Branch ergebnisse/fuego-gerade-lauf<N>

# Keine Eingaben: Seed und Bedingungen stehen in der Vorabfestlegung.
on:
  workflow_dispatch:

concurrency:
  group: fuego-gerade
  cancel-in-progress: false

permissions:
  contents: read

env:
  SEED: '227'
  ARME: auswertung/komponenten/arme-o.sh
  VORGABE: '0'

jobs:
  fuego-bauen:
    name: Fuego bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Werkzeuge installieren
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool subversion libboost-all-dev

      - name: Bauen
        run: bash auswertung/fuego/bauen.sh svn gnu++14 fuego-bin

      - uses: actions/upload-artifact@v7
        with:
          name: fuego-bin
          path: fuego-bin/
          retention-days: 7

  fuego:
    name: Fuego ohne Vorgabe, ${{ matrix.spiele }} Spiele je Zug, Partien ab ${{ matrix.von }}
    needs: fuego-bauen
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        spiele: [10, 20, 30, 50, 70]
        von: [1, 31, 61, 91]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: GNU Go und Bibliotheken installieren
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnugo libboost-all-dev

      - uses: actions/download-artifact@v7
        with:
          name: fuego-bin
          path: fuego-bin

      - name: 30 Partien spielen
        env:
          FUEGO_SPIELE: ${{ matrix.spiele }}
          VON: ${{ matrix.von }}
        run: |
          set -euo pipefail
          chmod +x fuego-bin/fuego
          bash auswertung/komponenten/spielen.sh f D "$VON" 30 "$SEED" "stand/s$FUEGO_SPIELE-$VON.jsonl"

      - name: Partien sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stand-s${{ matrix.spiele }}-${{ matrix.von }}
          path: stand/
          if-no-files-found: warn
          retention-days: 90

  ergebnis:
    name: Bericht und Ergebnisbranch
    needs: [fuego]
    # Auch wenn ein Teil scheitert: Der Bericht nennt die Paare, die da sind,
    # und fehlende-teile.txt die, die fehlen.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nur dieser Job schreibt ins Repo, und nur auf einen neuen Branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/download-artifact@v7
        with:
          pattern: stand-*
          path: stand
          merge-multiple: true

      - name: Bericht
        run: bash auswertung/fuego/gerade-ergebnis.sh

      - name: Ergebnisbranch
        env:
          LAUF: ${{ github.run_number }}
          LAUF_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          zweig="ergebnisse/fuego-gerade-lauf${LAUF}"
          ziel="docs/daten/fuego-gerade/lauf${LAUF}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$zweig"
          mkdir -p "$ziel"
          cp -r ergebnisse/. "$ziel/"
          git add "$ziel"
          git commit -q -m "Prüfstand Fuego ohne Vorgabe: Ergebnisse von Lauf ${LAUF}" \
                     -m "Workflow-Lauf ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${LAUF_ID}"
          git push origin "$zweig"
          echo "Ergebnisse auf Branch \`$zweig\` unter \`$ziel\`" >> "$GITHUB_STEP_SUMMARY"
          cat ergebnisse/bericht.md >> "$GITHUB_STEP_SUMMARY"
