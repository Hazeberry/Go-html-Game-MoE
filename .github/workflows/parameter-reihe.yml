name: Parameter-Reihe

# Manueller Lauf der Parameter-Reihe aus docs/parameter-reihe.md: zehn Arme, die
# je einen bisher nie gemessenen Parameter ändern (raveK, mctsPriorSharp,
# phaseBlendWidth, die Pass-Kurve passMinMc*), dazu Arm A (Default) und die
# Negativkontrolle N, gespielt gegen GNU Go Stufe 1 mit neun Vorgabesteinen.
# Gemessen wird, ob ein Parameter den Endstand um mehr als rund 12 Punkte
# verschiebt.
#
# Der Code ist der des Dispatch-Commits (index.html und gnugo-duell.js auf
# main); es gibt keinen Schalter, keine Tabelle, keinen Basis-Commit. Die Arme
# unterscheiden sich nur in --ki (auswertung/dagger/parameter-arme.sh).
#
# Ablauf:
#   pruefen    Eingaben prüfen
#   spielen    11 Arme × 16 Teile zu je 15 Partien (Seed `seed`) und 2 Teile der
#              Negativkontrolle N, 178 Jobs
#   ergebnis   Bericht, Rohdaten gepackt, Branch ergebnisse/parameter-reihe-lauf<N>
#
# Reproduzierbar: mctsFixedSims=120 zählt Simulationen statt Zeit, GNU Go
# bekommt den Seed (gnugo-duell.js), wie in endspiel-messung.yml. Arm A spielt
# dieselben Partien wie Arm A der Messung M1 mit demselben Seed; die Eingabe
# `kontrolle` vergleicht das.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed der 240 Partien je Arm (206 wie in der Messung M1)'
        required: true
        default: '206'
      kontrolle:
        description: 'Arm A der Messung M1 mit demselben Seed im Repo (jsonl oder jsonl.gz), gegen den Arm A verglichen wird; leer = keine Kontrolle'
        required: false
        default: 'docs/daten/endspiel-messung/lauf1/A.jsonl.gz'

# Ein Lauf nach dem anderen: Die Läufe teilen sich die Ergebnisbranches.
concurrency:
  group: parameter-reihe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    name: Eingaben prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      seed: ${{ steps.p.outputs.seed }}
      kontrolle: ${{ steps.p.outputs.kontrolle }}
    steps:
      - uses: actions/checkout@v7

      # Eingaben nur über env und geprüft, nie in die Shell-Zeile interpoliert
      # (Script-Injection über das Dispatch-Formular, wie in ab-harness.yml).
      - name: Eingaben prüfen
        id: p
        env:
          IN_SEED: ${{ inputs.seed }}
          IN_KONTROLLE: ${{ inputs.kontrolle }}
        run: |
          set -euo pipefail
          case "$IN_SEED" in ''|*[!0-9]*) echo "::error::seed muss eine nicht-negative ganze Zahl sein: '$IN_SEED'"; exit 2;; esac
          # Kontrolldatei: ein einfacher Pfad zu einer Datei im Repo
          if [ -n "$IN_KONTROLLE" ]; then
            case "$IN_KONTROLLE" in /*|*..*|*[!A-Za-z0-9_./-]*) echo "::error::ungültiger Pfad: '$IN_KONTROLLE'"; exit 2;; esac
            [ -f "$IN_KONTROLLE" ] || { echo "::error::Datei fehlt im Repo: $IN_KONTROLLE"; exit 2; }
          fi
          { echo "seed=$IN_SEED"; echo "kontrolle=$IN_KONTROLLE"; } >> "$GITHUB_OUTPUT"
          {
            echo "## Parameter-Reihe: 240 Paare je Arm gegen GNU Go"
            echo
            echo "Seed $IN_SEED, Kontrolle von Arm A gegen: \`${IN_KONTROLLE:-keine}\`"
            echo
            echo "Dispatch-Commit \`${GITHUB_SHA:0:7}\` · GNU Go aus dem Paketstand des Runners"
          } >> "$GITHUB_STEP_SUMMARY"

  spielen:
    name: Arm ${{ matrix.arm }}, Partien ab ${{ matrix.von }}
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [A, RAUS, R30, R3000, S0, S1, S9, B0, B24, P300, PNIE]
        von: [1, 16, 31, 46, 61, 76, 91, 106, 121, 136, 151, 166, 181, 196, 211, 226]
        # Die Negativkontrolle N spielt nur die Partien 1 bis 30.
        include:
          - arm: N
            von: 1
          - arm: N
            von: 16
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: GNU Go installieren
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnugo
          gnugo --version | head -n 1
          dpkg -l gnugo | tail -n 1 | cut -c1-80
          echo "Node $(node -v), $(nproc) Kerne, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"

      - name: 15 Partien spielen
        env:
          ARM: ${{ matrix.arm }}
          VON: ${{ matrix.von }}
          SEED: ${{ needs.pruefen.outputs.seed }}
        run: bash auswertung/dagger/parameter-spielen.sh "$ARM" "$VON" "$SEED" "parameter/$ARM-$VON.jsonl"

      - name: Partien sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parameter-${{ matrix.arm }}-${{ matrix.von }}
          path: parameter/
          if-no-files-found: warn
          retention-days: 90

  ergebnis:
    name: Bericht und Ergebnisbranch
    needs: [pruefen, spielen]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nur dieser Job schreibt ins Repo, und nur auf einen neuen Branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/download-artifact@v7
        with:
          pattern: parameter-*
          path: parameter
          merge-multiple: true

      - name: Bericht
        env:
          SEED: ${{ needs.pruefen.outputs.seed }}
          KONTROLLE: ${{ needs.pruefen.outputs.kontrolle }}
        run: |
          set -euo pipefail
          bash auswertung/dagger/parameter-ergebnis.sh "$SEED" "$KONTROLLE"
          cat ergebnisse/bericht.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ergebnisse-parameter
          path: ergebnisse/
          if-no-files-found: warn
          retention-days: 90

      # Die Ergebnisse als Commit des Workflows auf einen eigenen Branch: Sie
      # lassen sich von dort holen, ohne ein Artefakt herunterzuladen, und sind
      # dem Lauf zugeordnet.
      - name: Ergebnisbranch
        env:
          LAUF: ${{ github.run_number }}
          LAUF_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          zweig="ergebnisse/parameter-reihe-lauf${LAUF}"
          ziel="docs/daten/parameter-reihe/lauf${LAUF}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$zweig"
          mkdir -p "$ziel"
          cp -r ergebnisse/. "$ziel/"
          git add "$ziel"
          git commit -q -m "Parameter-Reihe (240 Paare je Arm gegen GNU Go): Ergebnisse von Lauf ${LAUF}" \
                     -m "Workflow-Lauf ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${LAUF_ID}"
          git push origin "$zweig"
          echo "Ergebnisse auf Branch \`$zweig\` unter \`$ziel\`" >> "$GITHUB_STEP_SUMMARY"
